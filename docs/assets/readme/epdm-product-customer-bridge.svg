<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>EPDM product bridge</title><desc>Evidence chain from raw EPDM polymer through customer-line acceptance.</desc>
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f8fbff"/><stop offset="100%" stop-color="#eef4fb"/>
      </linearGradient>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3"
              orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#52647a"/>
      </marker>
    </defs>
    <rect width="1200" height="680" fill="url(#bg)"/><text x="54" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="760" fill="#102033" text-anchor="start">EPDM raw-polymer-to-customer evidence bridge</text><text x="54" y="102" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#52647a" text-anchor="start">A reactor result becomes a product claim only through a controlled formulation and qualification chain</text><line x1="54" y1="124" x2="1146" y2="124" stroke="#dce4ee" stroke-width="2" stroke-linecap="round"/><rect x="55" y="190" width="155" height="260" rx="22" fill="#ffffff" stroke="#2563eb66" stroke-width="2"/><circle cx="132" cy="245" r="31" fill="#2563eb" stroke="#ffffff" stroke-width="4"/><text x="132" y="313" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="760" fill="#102033" text-anchor="middle">Raw polymer</text><text x="132" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#52647a" text-anchor="middle">composition · MWD</text><text x="132" y="391" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#52647a" text-anchor="middle">Mooney · gel</text><line x1="210" y1="322" x2="250" y2="322" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="250" y="190" width="155" height="260" rx="22" fill="#ffffff" stroke="#0891b266" stroke-width="2"/><circle cx="327" cy="245" r="31" fill="#0891b2" stroke="#ffffff" stroke-width="4"/><text x="327" y="313" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="760" fill="#102033" text-anchor="middle">Compound</text><text x="327" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#52647a" text-anchor="middle">fixed recipe</text><text x="327" y="391" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#52647a" text-anchor="middle">mixing history</text><line x1="405" y1="322" x2="445" y2="322" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="445" y="190" width="155" height="260" rx="22" fill="#ffffff" stroke="#7c3aed66" stroke-width="2"/><circle cx="522" cy="245" r="31" fill="#7c3aed" stroke="#ffffff" stroke-width="4"/><text x="522" y="313" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="760" fill="#102033" text-anchor="middle">Cure</text><text x="522" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#52647a" text-anchor="middle">rheometer</text><text x="522" y="391" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#52647a" text-anchor="middle">crosslink state</text><line x1="600" y1="322" x2="640" y2="322" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="640" y="190" width="155" height="260" rx="22" fill="#ffffff" stroke="#d9770666" stroke-width="2"/><circle cx="717" cy="245" r="31" fill="#d97706" stroke="#ffffff" stroke-width="4"/><text x="717" y="313" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="760" fill="#102033" text-anchor="middle">Part</text><text x="717" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#52647a" text-anchor="middle">process window</text><text x="717" y="391" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#52647a" text-anchor="middle">property durability</text><line x1="795" y1="322" x2="835" y2="322" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="835" y="190" width="155" height="260" rx="22" fill="#ffffff" stroke="#dc262666" stroke-width="2"/><circle cx="912" cy="245" r="31" fill="#dc2626" stroke="#ffffff" stroke-width="4"/><text x="912" y="313" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="760" fill="#102033" text-anchor="middle">Customer line</text><text x="912" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#52647a" text-anchor="middle">trial conditions</text><text x="912" y="391" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#52647a" text-anchor="middle">capability / defects</text><line x1="990" y1="322" x2="1030" y2="322" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1030" y="190" width="155" height="260" rx="22" fill="#ffffff" stroke="#15803d66" stroke-width="2"/><circle cx="1107" cy="245" r="31" fill="#15803d" stroke="#ffffff" stroke-width="4"/><text x="1107" y="313" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="760" fill="#102033" text-anchor="middle">Acceptance</text><text x="1107" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#52647a" text-anchor="middle">CQA evidence</text><text x="1107" y="391" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#52647a" text-anchor="middle">named approval</text><rect x="150" y="505" width="900" height="92" rx="22" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="600" y="541" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#dc2626" text-anchor="middle">Causal guardrail</text><text x="600" y="572" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">No customer or durability claim may skip compound, cure, part and line evidence</text></svg>
