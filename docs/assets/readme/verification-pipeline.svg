8" y1="270" x2="665" y2="270" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="735" cy="270" r="58" fill="#d97706" stroke="#ffffff" stroke-width="4"/><text x="735" y="266" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">Lint</text><text x="735" y="291" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#eff6ff" text-anchor="middle">Ruff quality</text><line x1="793" y1="270" x2="860" y2="270" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="930" cy="270" r="58" fill="#15803d" stroke="#ffffff" stroke-width="4"/><text x="930" y="266" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">Package</text><text x="930" y="291" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#eff6ff" text-anchor="middle">wheel + runtime</text><rect x="90" y="410" width="300" height="120" rx="20" fill="#ffffff" stroke="#bfd1e5" stroke-width="2"/><text x="240" y="451" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="760" fill="#102033" text-anchor="middle">Platforms</text><text x="240" y="482" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">Ubuntu 3.11 / 3.12</text><text x="240" y="508" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">Windows + macOS 3.12</text><rect x="450" y="410" width="300" height="120" rx="20" fill="#ffffff" stroke="#bfd1e5" stroke-width="2"/><text x="600" y="451" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="760" fill="#102033" text-anchor="middle">Scientific invariants</text><text x="600" y="482" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">mass / molar closure</text><text x="600" y="508" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">bounds / signs / units</text><rect x="810" y="410" width="300" height="120" rx="20" fill="#ffffff" stroke="#bfd1e5" stroke-width="2"/><text x="960" y="451" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="760" fill="#102033" text-anchor="middle">Release identity</text><text x="960" y="482" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">source manifest</text><text x="960" y="508" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">deterministic archive</text></svg>
