<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>EPDM batch parameter scan</title><desc>Broadcast parameter axes, validated NumPy kernels and scalar-parity output contract.</desc>
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f8fbff"/><stop offset="100%" stop-color="#eef4fb"/>
      </linearGradient>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3"
              orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#52647a"/>
      </marker>
    </defs>
    <rect width="1200" height="680" fill="url(#bg)"/><text x="54" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="760" fill="#102033" text-anchor="start">EPDM broadcast parameter-scan pipeline</text><text x="54" y="102" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#52647a" text-anchor="start">Independent temperature, residence-time, active-site and activity scenarios without Python-loop dispatch</text><line x1="54" y1="124" x2="1146" y2="124" stroke="#dce4ee" stroke-width="2"/><rect x="55" y="175" width="210" height="330" rx="20" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/><text x="160" y="220" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="760" fill="#2563eb" text-anchor="middle">Scenario axes</text><text x="160" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">temperature [nT, 1]</text><text x="160" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">residence [1, nτ]</text><text x="160" y="350" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">active sites [nA, 1]</text><text x="160" y="390" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">activity multiplier</text><text x="160" y="447" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#dc2626" text-anchor="middle">finite · positive</text><text x="160" y="476" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#dc2626" text-anchor="middle">broadcast-compatible</text><rect x="355" y="175" width="230" height="330" rx="20" fill="#ffffff" stroke="#67e8f9" stroke-width="2"/><text x="470" y="220" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="760" fill="#0891b2" text-anchor="middle">Broadcast mesh</text><text x="470" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">common scenario shape</text><text x="470" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">one validation boundary</text><text x="470" y="350" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">no numpy.vectorize</text><text x="470" y="390" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">no object loop</text><text x="470" y="447" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f766e" text-anchor="middle">explicit axis semantics</text><rect x="675" y="175" width="230" height="330" rx="20" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/><text x="790" y="220" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="760" fill="#7c3aed" text-anchor="middle">Array kernels</text><text x="790" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">Arrhenius ufuncs</text><text x="790" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">shared exposure</text><text x="790" y="350" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">−expm1(−k·C*·τ)</text><text x="790" y="390" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">E / P / diene arrays</text><text x="790" y="447" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#d97706" text-anchor="middle">CALCULATED_REFERENCE_ONLY</text><rect x="995" y="175" width="150" height="330" rx="20" fill="#ffffff" stroke="#86efac" stroke-width="2"/><text x="1070" y="220" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="760" fill="#15803d" text-anchor="middle">Outputs</text><text x="1070" y="275" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">shape</text><text x="1070" y="315" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">scenario count</text><text x="1070" y="355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">rate constants</text><text x="1070" y="395" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">conversions</text><text x="1070" y="447" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#15803d" text-anchor="middle">scalar parity</text><line x1="265" y1="340" x2="355" y2="340" stroke="#52647a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="585" y1="340" x2="675" y2="340" stroke="#52647a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="905" y1="340" x2="995" y2="340" stroke="#52647a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="160" y="555" width="880" height="70" rx="18" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/><text x="600" y="585" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750" fill="#15803d" text-anchor="middle">1,000-scenario screening: one array call · elementwise scalar tolerance contract</text><text x="600" y="612" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#102033" text-anchor="middle">Batch throughput is software evidence; it does not certify EPDM kinetic parameters</text></svg>
