<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img"><title>Simulator-neutral integration</title><desc>Governed inputs and qualified outputs around multiple process and automation tools.</desc>
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f8fbff"/><stop offset="100%" stop-color="#eef4fb"/>
      </linearGradient>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3"
              orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#52647a"/>
      </marker>
    </defs>
    <rect width="1200" height="670" fill="url(#bg)"/><text x="54" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="760" fill="#102033" text-anchor="start">Simulator-neutral integration contract</text><text x="54" y="102" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#52647a" text-anchor="start">One governed design basis can feed multiple tools without allowing a simulator default to become evidence</text><line x1="54" y1="124" x2="1146" y2="124" stroke="#dce4ee" stroke-width="2" stroke-linecap="round"/><rect x="60" y="185" width="230" height="310" rx="24" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/><text x="175" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="780" fill="#102033" text-anchor="middle">Governed inputs</text><text x="175" y="275" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">design basis</text><text x="175" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">stream / equipment IDs</text><text x="175" y="345" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">property-method basis</text><text x="175" y="380" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">parameter provenance</text><text x="175" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">model passport</text><rect x="910" y="185" width="230" height="310" rx="24" fill="#ffffff" stroke="#86efac" stroke-width="2"/><text x="1025" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="780" fill="#102033" text-anchor="middle">Qualified outputs</text><text x="1025" y="275" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">balances / residuals</text><text x="1025" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">method applicability</text><text x="1025" y="345" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">uncertainty / conflicts</text><text x="1025" y="380" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">HOLD / PASS state</text><text x="1025" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">named approval</text><rect x="390" y="190" width="190" height="92" rx="20" fill="#ffffff" stroke="#2563eb77" stroke-width="2"/><text x="485" y="245" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="740" fill="#2563eb" text-anchor="middle">Aspen Plus</text><line x1="290" y1="340" x2="390" y2="236" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="580" y1="236" x2="910" y2="340" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="610" y="190" width="190" height="92" rx="20" fill="#ffffff" stroke="#0891b277" stroke-width="2"/><text x="705" y="245" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="740" fill="#0891b2" text-anchor="middle">Aspen HYSYS</text><line x1="290" y1="340" x2="610" y2="236" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="800" y1="236" x2="910" y2="340" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="390" y="330" width="190" height="92" rx="20" fill="#ffffff" stroke="#0f766e77" stroke-width="2"/><text x="485" y="385" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="740" fill="#0f766e" text-anchor="middle">DWSIM</text><line x1="290" y1="340" x2="390" y2="376" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="580" y1="376" x2="910" y2="340" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="610" y="330" width="190" height="92" rx="20" fill="#ffffff" stroke="#7c3aed77" stroke-width="2"/><text x="705" y="385" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="740" fill="#7c3aed" text-anchor="middle">Python / custom</text><line x1="290" y1="340" x2="610" y2="376" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="800" y1="376" x2="910" y2="340" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="500" y="470" width="190" height="92" rx="20" fill="#ffffff" stroke="#d9770677" stroke-width="2"/><text x="595" y="525" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="740" fill="#d97706" text-anchor="middle">DCS / PLC exchange</text><line x1="290" y1="340" x2="500" y2="516" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="690" y1="516" x2="910" y2="340" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="260" y="585" width="680" height="52" rx="18" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="600" y="618" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#dc2626" text-anchor="middle">Simulator convergence is not scientific or engineering qualification</text></svg>
