<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>Performance regression gate</title><desc>Frozen baselines, repeatable measurements, hotspot attribution, parity checks and fail-closed CI decisions.</desc>
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f8fbff"/><stop offset="100%" stop-color="#eef4fb"/>
      </linearGradient>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3"
              orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#52647a"/>
      </marker>
    </defs>
    <rect width="1200" height="680" fill="url(#bg)"/><text x="54" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="760" fill="#102033" text-anchor="start">Fail-closed performance regression gate</text><text x="54" y="102" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#52647a" text-anchor="start">Performance is accepted only when timing, memory, scaling and numerical parity pass together</text><line x1="54" y1="124" x2="1146" y2="124" stroke="#dce4ee" stroke-width="2"/><rect x="55" y="190" width="190" height="275" rx="20" fill="#ffffff" stroke="#2563eb77" stroke-width="2"/><circle cx="150" cy="248" r="34" fill="#2563eb" stroke="#fff" stroke-width="4"/><text x="150" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" fill="#2563eb" text-anchor="middle">Frozen baseline</text><text x="150" y="370" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">version · commit</text><text x="150" y="403" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">input scale · environment</text><line x1="245" y1="330" x2="275" y2="330" stroke="#52647a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="275" y="190" width="190" height="275" rx="20" fill="#ffffff" stroke="#0891b277" stroke-width="2"/><circle cx="370" cy="248" r="34" fill="#0891b2" stroke="#fff" stroke-width="4"/><text x="370" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" fill="#0891b2" text-anchor="middle">Measurement</text><text x="370" y="370" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">warm-up · median</text><text x="370" y="403" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">min/max · stdev</text><line x1="465" y1="330" x2="495" y2="330" stroke="#52647a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="495" y="190" width="190" height="275" rx="20" fill="#ffffff" stroke="#7c3aed77" stroke-width="2"/><circle cx="590" cy="248" r="34" fill="#7c3aed" stroke="#fff" stroke-width="4"/><text x="590" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" fill="#7c3aed" text-anchor="middle">Hotspots</text><text x="590" y="370" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">cProfile</text><text x="590" y="403" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">traced peak memory</text><line x1="685" y1="330" x2="715" y2="330" stroke="#52647a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="715" y="190" width="190" height="275" rx="20" fill="#ffffff" stroke="#d9770677" stroke-width="2"/><circle cx="810" cy="248" r="34" fill="#d97706" stroke="#fff" stroke-width="4"/><text x="810" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" fill="#d97706" text-anchor="middle">Parity</text><text x="810" y="370" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">exact digest</text><text x="810" y="403" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">or named tolerance</text><line x1="905" y1="330" x2="935" y2="330" stroke="#52647a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="935" y="190" width="190" height="275" rx="20" fill="#ffffff" stroke="#15803d77" stroke-width="2"/><circle cx="1030" cy="248" r="34" fill="#15803d" stroke="#fff" stroke-width="4"/><text x="1030" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" fill="#15803d" text-anchor="middle">Gate</text><text x="1030" y="370" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">speed · memory</text><text x="1030" y="403" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">scale · boundaries</text><rect x="90" y="525" width="1020" height="100" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="600" y="560" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="780" fill="#15803d" text-anchor="middle">PASS → permanent CI evidence</text><text x="600" y="592" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#dc2626" text-anchor="middle">FAIL → retain evidence · identify hotspot · fix code · rerun the same workload</text><text x="600" y="618" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#102033" text-anchor="middle">No reduced precision, skipped validation or cached result may satisfy the gate</text></svg>
