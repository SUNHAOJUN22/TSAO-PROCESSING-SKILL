<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>Universal process-package lifecycle</title><desc>Lifecycle of the universal process package.</desc>
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f8fbff"/><stop offset="100%" stop-color="#eef4fb"/>
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17365d" flood-opacity="0.12"/>
      </filter>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#52647a"/>
      </marker>
    </defs>
    <rect width="1200" height="680" fill="url(#bg)"/><text x="54" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="760" fill="#102033" text-anchor="start">Universal process-package lifecycle</text><text x="54" y="102" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="450" fill="#52647a" text-anchor="start">From an evidence-framed brief to a controlled, auditable engineering package</text><line x1="54" y1="124" x2="1146" y2="124" stroke="#dce4ee" stroke-width="2" stroke-linecap="round"/><rect x="70" y="190" width="160" height="250" rx="22" fill="#ffffff" stroke="#2563eb55" stroke-width="2"/><circle cx="150" cy="245" r="34" fill="#2563eb" stroke="#ffffff" stroke-width="4"/><text x="150" y="253" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">01</text><text x="150" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="720" fill="#102033" text-anchor="middle">Brief &amp; CQA</text><text x="150" y="350" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">scope</text><text x="150" y="380" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">specification</text><text x="150" y="410" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">decision rights</text><line x1="230" y1="315" x2="250" y2="315" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="250" y="190" width="160" height="250" rx="22" fill="#ffffff" stroke="#0891b255" stroke-width="2"/><circle cx="330" cy="245" r="34" fill="#0891b2" stroke="#ffffff" stroke-width="4"/><text x="330" y="253" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">02</text><text x="330" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="720" fill="#102033" text-anchor="middle">Evidence &amp; data</text><text x="330" y="350" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">sources</text><text x="330" y="380" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">measurements</text><text x="330" y="410" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">uncertainty</text><line x1="410" y1="315" x2="430" y2="315" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="430" y="190" width="160" height="250" rx="22" fill="#ffffff" stroke="#7c3aed55" stroke-width="2"/><circle cx="510" cy="245" r="34" fill="#7c3aed" stroke="#ffffff" stroke-width="4"/><text x="510" y="253" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">03</text><text x="510" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="720" fill="#102033" text-anchor="middle">Models &amp; balances</text><text x="510" y="350" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">thermo</text><text x="510" y="380" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">reaction</text><text x="510" y="410" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">mass/energy</text><line x1="590" y1="315" x2="610" y2="315" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="610" y="190" width="160" height="250" rx="22" fill="#ffffff" stroke="#d9770655" stroke-width="2"/><circle cx="690" cy="245" r="34" fill="#d97706" stroke="#ffffff" stroke-width="4"/><text x="690" y="253" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">04</text><text x="690" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="720" fill="#102033" text-anchor="middle">Equipment &amp; control</text><text x="690" y="350" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">sizing</text><text x="690" y="380" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">PFD/P&amp;ID</text><text x="690" y="410" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">control</text><line x1="770" y1="315" x2="790" y2="315" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="790" y="190" width="160" height="250" rx="22" fill="#ffffff" stroke="#dc262655" stroke-width="2"/><circle cx="870" cy="245" r="34" fill="#dc2626" stroke="#ffffff" stroke-width="4"/><text x="870" y="253" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">05</text><text x="870" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="720" fill="#102033" text-anchor="middle">HSE &amp; operability</text><text x="870" y="350" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">HAZID</text><text x="870" y="380" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">relief</text><text x="870" y="410" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">abnormal cases</text><line x1="950" y1="315" x2="970" y2="315" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="970" y="190" width="160" height="250" rx="22" fill="#ffffff" stroke="#15803d55" stroke-width="2"/><circle cx="1050" cy="245" r="34" fill="#15803d" stroke="#ffffff" stroke-width="4"/><text x="1050" y="253" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">06</text><text x="1050" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="720" fill="#102033" text-anchor="middle">Acceptance &amp; transfer</text><text x="1050" y="350" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">gates</text><text x="1050" y="380" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">evidence</text><text x="1050" y="410" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">approval</text><rect x="180" y="500" width="840" height="96" rx="22" fill="#102033" stroke="#102033" stroke-width="2"/><text x="600" y="538" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="720" fill="#ffffff" text-anchor="middle">Every stage emits machine-readable artifacts, evidence IDs and explicit HOLD conditions</text><text x="600" y="571" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#d7e4f2" text-anchor="middle">Software PASS never substitutes for scientific, engineering, HSE, customer or industrial approval</text></svg>
