<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>Control and safety chain</title><desc>Relationship among measurement, control, alarms, interlocks, relief and evidence gates.</desc>
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f8fbff"/><stop offset="100%" stop-color="#eef4fb"/>
      </linearGradient>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3"
              orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#52647a"/>
      </marker>
    </defs>
    <rect width="1200" height="680" fill="url(#bg)"/><text x="54" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="760" fill="#102033" text-anchor="start">Control, interlock and process-safety chain</text><text x="54" y="102" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#52647a" text-anchor="start">Normal control and independent protection remain connected but explicitly separated</text><line x1="54" y1="124" x2="1146" y2="124" stroke="#dce4ee" stroke-width="2" stroke-linecap="round"/><rect x="55" y="190" width="155" height="250" rx="22" fill="#ffffff" stroke="#2563eb66" stroke-width="2"/><circle cx="132" cy="245" r="32" fill="#2563eb" stroke="#ffffff" stroke-width="4"/><text x="132" y="302" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="760" fill="#102033" text-anchor="middle">Measurement</text><text x="132" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#52647a" text-anchor="middle">sensor · analyzer</text><text x="132" y="390" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#52647a" text-anchor="middle">measurement boundary</text><line x1="210" y1="315" x2="250" y2="315" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="250" y="190" width="155" height="250" rx="22" fill="#ffffff" stroke="#0891b266" stroke-width="2"/><circle cx="327" cy="245" r="32" fill="#0891b2" stroke="#ffffff" stroke-width="4"/><text x="327" y="302" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="760" fill="#102033" text-anchor="middle">Regulatory</text><text x="327" y="324" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="760" fill="#102033" text-anchor="middle">control</text><text x="327" y="370" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#52647a" text-anchor="middle">PID · cascade</text><text x="327" y="400" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#52647a" text-anchor="middle">constraint control</text><line x1="405" y1="315" x2="445" y2="315" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="445" y="190" width="155" height="250" rx="22" fill="#ffffff" stroke="#d9770666" stroke-width="2"/><circle cx="522" cy="245" r="32" fill="#d97706" stroke="#ffffff" stroke-width="4"/><text x="522" y="302" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="760" fill="#102033" text-anchor="middle">Alarm &amp;</text><text x="522" y="324" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="760" fill="#102033" text-anchor="middle">operator</text><text x="522" y="370" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#52647a" text-anchor="middle">priority · response</text><text x="522" y="400" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#52647a" text-anchor="middle">abnormal procedure</text><line x1="600" y1="315" x2="640" y2="315" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="640" y="190" width="155" height="250" rx="22" fill="#ffffff" stroke="#dc262666" stroke-width="2"/><circle cx="717" cy="245" r="32" fill="#dc2626" stroke="#ffffff" stroke-width="4"/><text x="717" y="302" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="760" fill="#102033" text-anchor="middle">Interlock / SIS</text><text x="717" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#52647a" text-anchor="middle">trip · permissive</text><text x="717" y="390" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#52647a" text-anchor="middle">independent function</text><line x1="795" y1="315" x2="835" y2="315" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="835" y="190" width="155" height="250" rx="22" fill="#ffffff" stroke="#7c3aed66" stroke-width="2"/><circle cx="912" cy="245" r="32" fill="#7c3aed" stroke="#ffffff" stroke-width="4"/><text x="912" y="302" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="760" fill="#102033" text-anchor="middle">Relief &amp;</text><text x="912" y="324" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="760" fill="#102033" text-anchor="middle">containment</text><text x="912" y="370" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#52647a" text-anchor="middle">relief · flare</text><text x="912" y="400" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#52647a" text-anchor="middle">secondary containment</text><line x1="990" y1="315" x2="1030" y2="315" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1030" y="190" width="155" height="250" rx="22" fill="#ffffff" stroke="#15803d66" stroke-width="2"/><circle cx="1107" cy="245" r="32" fill="#15803d" stroke="#ffffff" stroke-width="4"/><text x="1107" y="302" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="760" fill="#102033" text-anchor="middle">Evidence Gate</text><text x="1107" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#52647a" text-anchor="middle">test · approval</text><text x="1107" y="390" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#52647a" text-anchor="middle">MOC · learning</text><rect x="135" y="500" width="930" height="95" rx="22" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="600" y="537" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="780" fill="#d97706" text-anchor="middle">HAZID → HAZOP → LOPA → SIL interface</text><text x="600" y="570" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">Software structures evidence and actions; qualified teams own the safety decision</text></svg>
