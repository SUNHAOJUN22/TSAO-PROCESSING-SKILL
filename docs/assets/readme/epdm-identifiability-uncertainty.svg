<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>EPDM identifiability and uncertainty</title><desc>Data, sensitivity, identifiability, uncertainty and decision gates for EPDM models.</desc>
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f8fbff"/><stop offset="100%" stop-color="#eef4fb"/>
      </linearGradient>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3"
              orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#52647a"/>
      </marker>
    </defs>
    <rect width="1200" height="680" fill="url(#bg)"/><text x="54" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="760" fill="#102033" text-anchor="start">EPDM parameter identifiability and uncertainty ladder</text><text x="54" y="102" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#52647a" text-anchor="start">Model fidelity advances only when the experiment can distinguish the parameters that drive the decision</text><line x1="54" y1="124" x2="1146" y2="124" stroke="#dce4ee" stroke-width="2" stroke-linecap="round"/><rect x="75" y="190" width="180" height="265" rx="24" fill="#ffffff" stroke="#2563eb66" stroke-width="2"/><circle cx="165" cy="245" r="34" fill="#2563eb" stroke="#ffffff" stroke-width="4"/><text x="165" y="315" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="770" fill="#102033" text-anchor="middle">Data boundary</text><text x="165" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">conditions · units</text><text x="165" y="391" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">site basis · covariance</text><line x1="255" y1="323" x2="295" y2="323" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="295" y="190" width="180" height="265" rx="24" fill="#ffffff" stroke="#0891b266" stroke-width="2"/><circle cx="385" cy="245" r="34" fill="#0891b2" stroke="#ffffff" stroke-width="4"/><text x="385" y="315" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="770" fill="#102033" text-anchor="middle">Sensitivity</text><text x="385" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">local / global</text><text x="385" y="391" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">observable response</text><line x1="475" y1="323" x2="515" y2="323" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="515" y="190" width="180" height="265" rx="24" fill="#ffffff" stroke="#7c3aed66" stroke-width="2"/><circle cx="605" cy="245" r="34" fill="#7c3aed" stroke="#ffffff" stroke-width="4"/><text x="605" y="315" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="770" fill="#102033" text-anchor="middle">Identifiability</text><text x="605" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">rank · correlation</text><text x="605" y="391" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">profile likelihood</text><line x1="695" y1="323" x2="735" y2="323" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="735" y="190" width="180" height="265" rx="24" fill="#ffffff" stroke="#d9770666" stroke-width="2"/><circle cx="825" cy="245" r="34" fill="#d97706" stroke="#ffffff" stroke-width="4"/><text x="825" y="315" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="770" fill="#102033" text-anchor="middle">Uncertainty</text><text x="825" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">parameter / prediction</text><text x="825" y="391" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">scenario propagation</text><line x1="915" y1="323" x2="955" y2="323" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="955" y="190" width="180" height="265" rx="24" fill="#ffffff" stroke="#15803d66" stroke-width="2"/><circle cx="1045" cy="245" r="34" fill="#15803d" stroke="#ffffff" stroke-width="4"/><text x="1045" y="315" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="770" fill="#102033" text-anchor="middle">Decision Gate</text><text x="1045" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">experiment · model</text><text x="1045" y="391" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">scale-up / HOLD</text><rect x="115" y="505" width="970" height="98" rx="22" fill="#eef2ff" stroke="#c4b5fd" stroke-width="2"/><text x="600" y="542" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="780" fill="#7c3aed" text-anchor="middle">Parameter classes</text><text x="600" y="575" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#102033" text-anchor="middle">measured · estimated · literature prior · nuisance · structurally fixed · not identifiable</text></svg>
