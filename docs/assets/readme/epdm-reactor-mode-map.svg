<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>EPDM reactor-mode decision map</title><desc>Mapping of EPDM reactor modes to model fidelity levels.</desc>
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f8fbff"/>
        <stop offset="100%" stop-color="#eef4fb"/>
      </linearGradient>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3"
              orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#52647a"/>
      </marker>
    </defs>
    <rect width="1200" height="680" fill="url(#bg)"/><text x="54" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="760" fill="#102033" text-anchor="start">EPDM reactor-mode decision map</text><text x="54" y="102" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="450" fill="#52647a" text-anchor="start">Select model topology from the operating mode, mixing regime, data density and decision risk</text><line x1="54" y1="124" x2="1146" y2="124" stroke="#dce4ee" stroke-width="2" stroke-linecap="round"/><rect x="70" y="175" width="235" height="150" rx="24" fill="#ffffff" stroke="#2563eb66" stroke-width="2"/><circle cx="188" cy="220" r="28" fill="#2563eb" stroke="#ffffff" stroke-width="4"/><text x="188" y="273" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="780" fill="#102033" text-anchor="middle">Batch</text><text x="188" y="301" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#52647a" text-anchor="middle">initial inventory</text><text x="188" y="323" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#52647a" text-anchor="middle">time trajectory</text><rect x="345" y="175" width="235" height="150" rx="24" fill="#ffffff" stroke="#0891b266" stroke-width="2"/><circle cx="463" cy="220" r="28" fill="#0891b2" stroke="#ffffff" stroke-width="4"/><text x="463" y="273" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="780" fill="#102033" text-anchor="middle">Semibatch</text><text x="463" y="301" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#52647a" text-anchor="middle">scheduled feed</text><text x="463" y="323" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#52647a" text-anchor="middle">material-energy step</text><rect x="620" y="175" width="235" height="150" rx="24" fill="#ffffff" stroke="#7c3aed66" stroke-width="2"/><circle cx="738" cy="220" r="28" fill="#7c3aed" stroke="#ffffff" stroke-width="4"/><text x="738" y="273" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="780" fill="#102033" text-anchor="middle">Continuous CSTR</text><text x="738" y="301" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#52647a" text-anchor="middle">steady inventory</text><text x="738" y="323" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#52647a" text-anchor="middle">residence-time closure</text><rect x="895" y="175" width="235" height="150" rx="24" fill="#ffffff" stroke="#d9770666" stroke-width="2"/><circle cx="1013" cy="220" r="28" fill="#d97706" stroke="#ffffff" stroke-width="4"/><text x="1013" y="273" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="780" fill="#102033" text-anchor="middle">Reactor cascade</text><text x="1013" y="301" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#52647a" text-anchor="middle">stage composition</text><text x="1013" y="323" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#52647a" text-anchor="middle">grade transition</text><line x1="188" y1="325" x2="188" y2="395" stroke="#8294aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="463" y1="325" x2="463" y2="395" stroke="#8294aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="738" y1="325" x2="738" y2="395" stroke="#8294aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="1013" y1="325" x2="1013" y2="395" stroke="#8294aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="65" y="400" width="330" height="100" rx="22" fill="#ffffff" stroke="#2563eb66" stroke-width="2"/><text x="230" y="442" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="780" fill="#2563eb" text-anchor="middle">Level 1 — screening</text><text x="230" y="472" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#52647a" text-anchor="middle">constant-site rates · rapid ranking</text><rect x="435" y="400" width="330" height="100" rx="22" fill="#ffffff" stroke="#d9770666" stroke-width="2"/><text x="600" y="442" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="780" fill="#d97706" text-anchor="middle">Level 2 — engineering</text><text x="600" y="472" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#52647a" text-anchor="middle">Arrhenius · balances · heat/mixing</text><rect x="805" y="400" width="330" height="100" rx="22" fill="#ffffff" stroke="#7c3aed66" stroke-width="2"/><text x="970" y="442" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="780" fill="#7c3aed" text-anchor="middle">Level 3 — detailed reference</text><text x="970" y="472" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#52647a" text-anchor="middle">site families · moments · phase/gel</text><rect x="170" y="550" width="860" height="70" rx="20" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="600" y="579" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#dc2626" text-anchor="middle">Promotion rule</text><text x="600" y="605" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="560" fill="#102033" text-anchor="middle">Higher fidelity requires identifiable parameters, qualified data and a decision benefit</text></svg>
