t-size="19" font-weight="760" fill="#102033" text-anchor="middle">Named approval</text><text x="960" y="240" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">role · decision · date · evidence</text><rect x="250" y="485" width="700" height="96" rx="22" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="600" y="524" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#dc2626" text-anchor="middle">FAIL / HOLD is a useful engineering result</text><text x="600" y="557" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="520" fill="#102033" text-anchor="middle">It exposes missing evidence before a weak assumption reaches equipment, safety or customer decisions</text></svg>
