    <rect width="1200" height="680" fill="url(#bg)"/><text x="54" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="760" fill="#102033" text-anchor="start">Evidence and qualification gates</text><text x="54" y="102" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="450" fill="#52647a" text-anchor="start">Claims advance only when data lineage, model boundaries and qualified approvals are complete</text><line x1="54" y1="124" x2="1146" y2="124" stroke="#dce4ee" stroke-width="2" stroke-linecap="round"/><line x1="130" y1="340" x2="1070" y2="340" stroke="#9aa9bb" stroke-width="5" stroke-linecap="round"/><circle cx="150" cy="340" r="37" fill="#2563eb" stroke="#ffffff" stroke-width="4"/><text x="150" y="347" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">G0</text><text x="150" y="405" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#102033" text-anchor="middle">scope</text><circle cx="330" cy="340" r="37" fill="#0891b2" stroke="#ffffff" stroke-width="4"/><text x="330" y="347" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">G4</text><text x="330" y="405" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#102033" text-anchor="middle">laboratory</text><circle cx="510" cy="340" r="37" fill="#7c3aed" stroke="#ffffff" stroke-width="4"/><text x="510" y="347" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">G8</text><text x="510" y="405" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#102033" text-anchor="middle">process</text><circle cx="690" cy="340" r="37" fill="#d97706" stroke="#ffffff" stroke-width="4"/><text x="690" y="347" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" fill="#ffffff"