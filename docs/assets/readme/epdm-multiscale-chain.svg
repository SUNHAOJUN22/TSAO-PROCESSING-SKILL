<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>EPDM multiscale chain</title><desc>EPDM mechanism-to-process-package chain.</desc>
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f8fbff"/><stop offset="100%" stop-color="#eef4fb"/>
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17365d" flood-opacity="0.12"/>
      </filter>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#52647a"/>
      </marker>
    </defs>
    <rect width="1200" height="680" fill="url(#bg)"/><text x="54" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="760" fill="#102033" text-anchor="start">EPDM multiscale mechanism-to-package chain</text><text x="54" y="102" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="450" fill="#52647a" text-anchor="start">Chemical events are connected to architecture, reactor behavior, finishing and customer acceptance</text><line x1="54" y1="124" x2="1146" y2="124" stroke="#dce4ee" stroke-width="2" stroke-linecap="round"/><rect x="70" y="180" width="190" height="240" rx="24" fill="#ffffff" stroke="#2563eb66" stroke-width="2"/><circle cx="165" cy="234" r="34" fill="#2563eb" stroke="#ffffff" stroke-width="4"/><text x="165" y="296" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="760" fill="#102033" text-anchor="middle">Active sites</text><text x="165" y="338" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">catalyst family</text><text x="165" y="368" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">site fraction</text><text x="165" y="398" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">poison memory</text><line x1="260" y1="300" x2="285" y2="300" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="285" y="180" width="190" height="240" rx="24" fill="#ffffff" stroke="#0891b266" stroke-width="2"/><circle cx="380" cy="234" r="34" fill="#0891b2" stroke="#ffffff" stroke-width="4"/><text x="380" y="296" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="760" fill="#102033" text-anchor="middle">Elementary kinetics</text><text x="380" y="338" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">E/P/diene insertion</text><text x="380" y="368" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">transfer</text><text x="380" y="398" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">deactivation</text><line x1="475" y1="300" x2="500" y2="300" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="500" y="180" width="190" height="240" rx="24" fill="#ffffff" stroke="#7c3aed66" stroke-width="2"/><circle cx="595" cy="234" r="34" fill="#7c3aed" stroke="#ffffff" stroke-width="4"/><text x="595" y="296" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="760" fill="#102033" text-anchor="middle">Chain architecture</text><text x="595" y="338" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">sequence · MWD/CCD</text><text x="595" y="368" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">unsaturation</text><text x="595" y="398" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">branch/gel</text><line x1="690" y1="300" x2="715" y2="300" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="715" y="180" width="190" height="240" rx="24" fill="#ffffff" stroke="#d9770666" stroke-width="2"/><circle cx="810" cy="234" r="34" fill="#d97706" stroke="#ffffff" stroke-width="4"/><text x="810" y="296" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="760" fill="#102033" text-anchor="middle">Reactor physics</text><text x="810" y="338" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">phase stability</text><text x="810" y="368" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">mixing · heat removal</text><text x="810" y="398" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">residence time</text><line x1="905" y1="300" x2="930" y2="300" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="930" y="180" width="190" height="240" rx="24" fill="#ffffff" stroke="#15803d66" stroke-width="2"/><circle cx="1025" cy="234" r="34" fill="#15803d" stroke="#ffffff" stroke-width="4"/><text x="1025" y="296" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="760" fill="#102033" text-anchor="middle">Process package</text><text x="1025" y="338" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">recovery · devol</text><text x="1025" y="368" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">control · HSE</text><text x="1025" y="398" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">acceptance</text><rect x="150" y="485" width="900" height="105" rx="22" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="600" y="528" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#d97706" text-anchor="middle">Causal guardrail</text><text x="600" y="560" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="560" fill="#102033" text-anchor="middle">A software calculation may propose a mechanism; only named evidence and qualified experiments may promote it</text></svg>
