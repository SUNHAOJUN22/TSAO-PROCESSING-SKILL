<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>Three EPDM model levels</title><desc>Three levels of EPDM kinetic and process models.</desc>
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f8fbff"/><stop offset="100%" stop-color="#eef4fb"/>
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17365d" flood-opacity="0.12"/>
      </filter>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#52647a"/>
      </marker>
    </defs>
    <rect width="1200" height="680" fill="url(#bg)"/><text x="54" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="760" fill="#102033" text-anchor="start">Three EPDM model levels</text><text x="54" y="102" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="450" fill="#52647a" text-anchor="start">Use the simplest model that can answer the decision — preserve a path to greater fidelity</text><line x1="54" y1="124" x2="1146" y2="124" stroke="#dce4ee" stroke-width="2" stroke-linecap="round"/><rect x="80" y="180" width="320" height="330" rx="28" fill="#ffffff" stroke="#2563eb66" stroke-width="2"/><rect x="108" y="208" width="112" height="38" rx="19" fill="#2563eb18" stroke="#2563eb55" stroke-width="1"/><text x="164" y="234" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#2563eb" text-anchor="middle">Level 1</text><text x="108" y="288" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="780" fill="#102033" text-anchor="start">Screening</text><circle cx="122" cy="342" r="8" fill="#2563eb" stroke="#2563eb" stroke-width="0"/><text x="145" y="349" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="550" fill="#102033" text-anchor="start">active-site normalized</text><circle cx="122" cy="397" r="8" fill="#2563eb" stroke="#2563eb" stroke-width="0"/><text x="145" y="404" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="550" fill="#102033" text-anchor="start">ternary insertion</text><circle cx="122" cy="452" r="8" fill="#2563eb" stroke="#2563eb" stroke-width="0"/><text x="145" y="459" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="550" fill="#102033" text-anchor="start">rapid conversion</text><text x="108" y="478" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="730" fill="#dc2626" text-anchor="start">CALCULATED_REFERENCE_ONLY</text><rect x="430" y="180" width="320" height="330" rx="28" fill="#ffffff" stroke="#d9770666" stroke-width="2"/><rect x="458" y="208" width="112" height="38" rx="19" fill="#d9770618" stroke="#d9770655" stroke-width="1"/><text x="514" y="234" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#d97706" text-anchor="middle">Level 2</text><text x="458" y="288" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="780" fill="#102033" text-anchor="start">Engineering</text><circle cx="472" cy="342" r="8" fill="#d97706" stroke="#d97706" stroke-width="0"/><text x="495" y="349" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="550" fill="#102033" text-anchor="start">Arrhenius scaling</text><circle cx="472" cy="397" r="8" fill="#d97706" stroke="#d97706" stroke-width="0"/><text x="495" y="404" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="550" fill="#102033" text-anchor="start">semibatch balances</text><circle cx="472" cy="452" r="8" fill="#d97706" stroke="#d97706" stroke-width="0"/><text x="495" y="459" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="550" fill="#102033" text-anchor="start">heat/mixing/recycle</text><text x="458" y="478" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="730" fill="#dc2626" text-anchor="start">CALCULATED_REFERENCE_ONLY</text><rect x="780" y="180" width="320" height="330" rx="28" fill="#ffffff" stroke="#7c3aed66" stroke-width="2"/><rect x="808" y="208" width="112" height="38" rx="19" fill="#7c3aed18" stroke="#7c3aed55" stroke-width="1"/><text x="864" y="234" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#7c3aed" text-anchor="middle">Level 3</text><text x="808" y="288" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="780" fill="#102033" text-anchor="start">Detailed reference</text><circle cx="822" cy="342" r="8" fill="#7c3aed" stroke="#7c3aed" stroke-width="0"/><text x="845" y="349" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="550" fill="#102033" text-anchor="start">site heterogeneity</text><circle cx="822" cy="397" r="8" fill="#7c3aed" stroke="#7c3aed" stroke-width="0"/><text x="845" y="404" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="550" fill="#102033" text-anchor="start">chain moments</text><circle cx="822" cy="452" r="8" fill="#7c3aed" stroke="#7c3aed" stroke-width="0"/><text x="845" y="459" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="550" fill="#102033" text-anchor="start">phase/entropy/gel</text><text x="808" y="478" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="730" fill="#dc2626" text-anchor="start">CALCULATED_REFERENCE_ONLY</text><line x1="400" y1="345" x2="430" y2="345" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="750" y1="345" x2="780" y2="345" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="600" y="565" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" fill="#334155" text-anchor="middle">Fidelity increases only when data, parameter identifiability and decision value justify it</text></svg>
