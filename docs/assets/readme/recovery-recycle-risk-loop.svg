<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>EPDM recovery, recycle and impurity-risk loop</title><desc>EPDM recovery and recycle loop with fail-closed impurity controls.</desc>
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f8fbff"/>
        <stop offset="100%" stop-color="#eef4fb"/>
      </linearGradient>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3"
              orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#52647a"/>
      </marker>
    </defs>
    <rect width="1200" height="680" fill="url(#bg)"/><text x="54" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="760" fill="#102033" text-anchor="start">EPDM recovery, recycle and impurity-risk loop</text><text x="54" y="102" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="450" fill="#52647a" text-anchor="start">A recycle stream is acceptable only when volatile closure, poison memory and purge are finite</text><line x1="54" y1="124" x2="1146" y2="124" stroke="#dce4ee" stroke-width="2" stroke-linecap="round"/><rect x="70" y="265" width="180" height="92" rx="20" fill="#ffffff" stroke="#7c3aed66" stroke-width="2"/><rect x="70" y="265" width="180" height="10" rx="5" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/><text x="160" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" fill="#102033" text-anchor="middle">Reactor effluent</text><line x1="250" y1="311" x2="300" y2="311" stroke="#8294aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="300" y="265" width="180" height="92" rx="20" fill="#ffffff" stroke="#d9770666" stroke-width="2"/><rect x="300" y="265" width="180" height="10" rx="5" fill="#d97706" stroke="#d97706" stroke-width="2"/><text x="390" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" fill="#102033" text-anchor="middle">Quench / deash</text><line x1="480" y1="311" x2="530" y2="311" stroke="#8294aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="530" y="265" width="180" height="92" rx="20" fill="#ffffff" stroke="#dc262666" stroke-width="2"/><rect x="530" y="265" width="180" height="10" rx="5" fill="#dc2626" stroke="#dc2626" stroke-width="2"/><text x="620" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" fill="#102033" text-anchor="middle">Devolatilization</text><line x1="710" y1="311" x2="760" y2="311" stroke="#8294aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="760" y="265" width="180" height="92" rx="20" fill="#ffffff" stroke="#0891b266" stroke-width="2"/><rect x="760" y="265" width="180" height="10" rx="5" fill="#0891b2" stroke="#0891b2" stroke-width="2"/><text x="850" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" fill="#102033" text-anchor="middle">Recovery</text><line x1="940" y1="311" x2="990" y2="311" stroke="#8294aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="990" y="265" width="150" height="92" rx="20" fill="#ffffff" stroke="#15803d66" stroke-width="2"/><rect x="990" y="265" width="150" height="10" rx="5" fill="#15803d" stroke="#15803d" stroke-width="2"/><text x="1065" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" fill="#102033" text-anchor="middle">Product</text><rect x="610" y="445" width="250" height="90" rx="20" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/><text x="735" y="480" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="780" fill="#0891b2" text-anchor="middle">Guard bed + purge</text><text x="735" y="508" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#52647a" text-anchor="middle">removal · purge fraction · limit</text><line x1="850" y1="357" x2="735" y2="445" stroke="#8294aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="610" y1="490" x2="180" y2="357" stroke="#0891b2" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrow)"/><rect x="80" y="555" width="210" height="38" rx="19" fill="#dc262618" stroke="#dc262655" stroke-width="1"/><text x="185" y="581" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#dc2626" text-anchor="middle">finite poison steady state</text><rect x="315" y="555" width="210" height="38" rx="19" fill="#7c3aed18" stroke="#7c3aed55" stroke-width="1"/><text x="420" y="581" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#7c3aed" text-anchor="middle">non-equilibrium devol</text><rect x="550" y="555" width="210" height="38" rx="19" fill="#0891b218" stroke="#0891b255" stroke-width="1"/><text x="655" y="581" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#0891b2" text-anchor="middle">solvent/monomer closure</text><rect x="785" y="555" width="210" height="38" rx="19" fill="#d9770618" stroke="#d9770655" stroke-width="1"/><text x="890" y="581" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#d97706" text-anchor="middle">emissions &amp; purge</text><circle cx="735" cy="205" r="43" fill="#dc2626" stroke="#ffffff" stroke-width="4"/><text x="735" y="201" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="820" fill="#ffffff" text-anchor="middle">HOLD</text><text x="735" y="224" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#ffffff" text-anchor="middle">if unclosed</text><line x1="735" y1="248" x2="735" y2="265" stroke="#dc2626" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/></svg>
