"#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="990" cy="250" r="52" fill="#7c3aed" stroke="#ffffff" stroke-width="4"/><text x="990" y="256" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Balances &amp; models</text><line x1="600" y1="378" x2="995" y2="505" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="995" cy="505" r="52" fill="#15803d" stroke="#ffffff" stroke-width="4"/><text x="995" y="511" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Acceptance &amp; transfer</text><line x1="600" y1="378" x2="600" y2="545" stroke="#8394aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="600" cy="545" r="52" fill="#d97706" stroke="#ffffff" stroke-width="4"/><text x="600" y="551" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">EPDM flagship</text><rect x="90" y="620" width="180" height="38" rx="19" fill="#2563eb18" stroke="#2563eb55" stroke-width="1"/><text x="180" y="646" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#2563eb" text-anchor="middle">Traceable evidence</text><rect x="288" y="620" width="180" height="38" rx="19" fill="#0f766e18" stroke="#0f766e55" stroke-width="1"/><text x="378" y="646" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#0f766e" text-anchor="middle">Mass &amp; energy</text><rect x="486" y="620" width="180" height="38" rx="19" fill="#7c3aed18" stroke="#7c3aed55" stroke-width="1"/><text x="576" y="646" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#7c3aed" text-anchor="middle">Thermodynamics</text><rect x="684" y="620" width="180" height="38" rx="19" fill="#dc262618" stroke="#dc262655" stroke-width="1"/><text x="774" y="646" 