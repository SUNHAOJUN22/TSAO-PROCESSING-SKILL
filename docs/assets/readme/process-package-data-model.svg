ily="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#52647a" text-anchor="middle">hazards · safeguards · relief</text><line x1="600" y1="253" x2="1040" y2="300" stroke="#8294aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="170" y="490" width="360" height="96" rx="22" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/><text x="350" y="529" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="780" fill="#0f766e" text-anchor="middle">Evidence ledger</text><text x="350" y="560" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">source · condition · claim · uncertainty</text><rect x="670" y="490" width="360" height="96" rx="22" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="850" y="529" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="780" fill="#15803d" text-anchor="middle">Acceptance &amp; approvals</text><text x="850" y="560" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">criterion · evidence ID · role · decision</text><line x1="530" y1="538" x2="670" y2="538" stroke="#8294aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="600" y1="420" x2="350" y2="490" stroke="#8294aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="600" y1="420" x2="850" y2="490" stroke="#8294aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/></svg>
