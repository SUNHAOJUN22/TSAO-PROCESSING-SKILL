<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>EPDM process-package reference flowsheet</title><desc>EPDM process reference flowsheet.</desc>
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f8fbff"/><stop offset="100%" stop-color="#eef4fb"/>
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17365d" flood-opacity="0.12"/>
      </filter>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#52647a"/>
      </marker>
    </defs>
    <rect width="1200" height="680" fill="url(#bg)"/><text x="54" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="760" fill="#102033" text-anchor="start">EPDM process-package reference flowsheet</text><text x="54" y="102" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="450" fill="#52647a" text-anchor="start">A process-centered map for reaction, finishing, recycle and quality integration</text><line x1="54" y1="124" x2="1146" y2="124" stroke="#dce4ee" stroke-width="2" stroke-linecap="round"/><rect x="60" y="270" width="150" height="100" rx="18" fill="#ffffff" stroke="#2563eb77" stroke-width="2"/><rect x="60" y="270" width="150" height="12" rx="6" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="135" y="331" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="720" fill="#102033" text-anchor="middle">Feed purification</text><line x1="210" y1="320" x2="260" y2="320" stroke="#65778d" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="260" y="270" width="150" height="100" rx="18" fill="#ffffff" stroke="#0891b277" stroke-width="2"/><rect x="260" y="270" width="150" height="12" rx="6" fill="#0891b2" stroke="#0891b2" stroke-width="2"/><text x="335" y="331" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="720" fill="#102033" text-anchor="middle">Catalyst &amp; dosing</text><line x1="410" y1="320" x2="460" y2="290" stroke="#65778d" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="460" y="240" width="210" height="100" rx="18" fill="#ffffff" stroke="#7c3aed77" stroke-width="2"/><rect x="460" y="240" width="210" height="12" rx="6" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/><text x="565" y="301" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="720" fill="#102033" text-anchor="middle">Solution polymerization</text><line x1="670" y1="290" x2="720" y2="320" stroke="#65778d" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="720" y="270" width="150" height="100" rx="18" fill="#ffffff" stroke="#d9770677" stroke-width="2"/><rect x="720" y="270" width="150" height="12" rx="6" fill="#d97706" stroke="#d97706" stroke-width="2"/><text x="795" y="331" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="720" fill="#102033" text-anchor="middle">Quench / deashing</text><line x1="870" y1="320" x2="920" y2="320" stroke="#65778d" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="920" y="270" width="150" height="100" rx="18" fill="#ffffff" stroke="#dc262677" stroke-width="2"/><rect x="920" y="270" width="150" height="12" rx="6" fill="#dc2626" stroke="#dc2626" stroke-width="2"/><text x="995" y="331" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="720" fill="#102033" text-anchor="middle">Devolatilization</text><rect x="940" y="455" width="170" height="86" rx="18" fill="#ffffff" stroke="#15803d77" stroke-width="2"/><text x="1025" y="490" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="760" fill="#102033" text-anchor="middle">Finishing</text><text x="1025" y="516" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">bale / pellet</text><line x1="995" y1="370" x2="1025" y2="455" stroke="#65778d" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="470" y="455" width="200" height="86" rx="18" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/><text x="570" y="490" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="740" fill="#102033" text-anchor="middle">Solvent / monomer</text><text x="570" y="516" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#52647a" text-anchor="middle">recovery + purge</text><line x1="995" y1="370" x2="670" y2="455" stroke="#65778d" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="470" y1="498" x2="335" y2="370" stroke="#0891b2" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><rect x="90" y="565" width="190" height="38" rx="19" fill="#dc262618" stroke="#dc262655" stroke-width="1"/><text x="185" y="591" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#dc2626" text-anchor="middle">impurity guard</text><rect x="300" y="565" width="190" height="38" rx="19" fill="#7c3aed18" stroke="#7c3aed55" stroke-width="1"/><text x="395" y="591" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#7c3aed" text-anchor="middle">phase stability</text><rect x="510" y="565" width="190" height="38" rx="19" fill="#d9770618" stroke="#d9770655" stroke-width="1"/><text x="605" y="591" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#d97706" text-anchor="middle">heat removal</text><rect x="720" y="565" width="190" height="38" rx="19" fill="#0891b218" stroke="#0891b255" stroke-width="1"/><text x="815" y="591" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#0891b2" text-anchor="middle">volatile closure</text><rect x="930" y="565" width="190" height="38" rx="19" fill="#15803d18" stroke="#15803d55" stroke-width="1"/><text x="1025" y="591" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#15803d" text-anchor="middle">quality bridge</text></svg>
