/text></g><g><rect x="552" y="510" width="476" height="161" rx="20" fill="#101827" stroke="#64748b" stroke-opacity=".65"/><text x="574" y="544" font-size="17" font-weight="650" fill="#6ee7b7" data-box="574,521.9,432,30.5"><tspan x="574" dy="0">02  Componentwise error</tspan></text><text x="574" y="588" font-size="19" font-weight="400" fill="#f8fafc" data-box="574,563.3,432,35.5"><tspan x="574" dy="0">s_i = a + r · max(|y_n,i|, |y⁽⁵⁾_i|)</tspan></text><text x="574" y="617" font-size="19" font-weight="400" fill="#f8fafc" data-box="574,592.3,432,35.5"><tspan x="574" dy="0">e = max_i |y⁽⁵⁾_i − y⁽⁴⁾_i| / s_i</tspan></text></g><g><rect x="1058" y="510" width="476" height="161" rx="20" fill="#101827" stroke="#64748b" stroke-opacity=".65"/><text x="1080" y="544" font-size="17" font-weight="650" fill="#6ee7b7" data-box="1080,521.9,432,30.5"><tspan x="1080" dy="0">03  Local identifiability</tspan></text><text x="1080" y="588" font-size="19" font-weight="400" fill="#f8fafc" data-box="1080,563.3,432,35.5"><tspan x="1080" dy="0">rank_num(J / max |J_ij|) = p</tspan></text></g>
