name: Diagnose alpha11 v5 final evidence once

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    if: ${{ contains(github.event.head_commit.message, '[DIAG-ALPHA11-V5]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Record compact v5 run status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: "30324467737"
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}" > /tmp/run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/jobs?per_page=100" > /tmp/jobs.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(Path('/tmp/run.json').read_text())
          jobs = json.loads(Path('/tmp/jobs.json').read_text()).get('jobs', [])
          payload = {
              'schema': 'TSAO-ALPHA11-V5-RUN-DIAGNOSTIC-1',
              'target_run_id': int(os.environ['TARGET_RUN_ID']),
              'run_status': run.get('status'),
              'run_conclusion': run.get('conclusion'),
              'jobs': [
                  {
                      'id': job.get('id'),
                      'name': job.get('name'),
                      'status': job.get('status'),
                      'conclusion': job.get('conclusion'),
                      'failed_steps': [
                          step.get('name')
                          for step in job.get('steps', [])
                          if step.get('conclusion') == 'failure'
                      ],
                  }
                  for job in jobs
              ],
          }
          Path('reports/ALPHA11_V5_RUN_DIAGNOSTIC.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/ALPHA11_V5_RUN_DIAGNOSTIC.json
          git commit -m 'diagnostic: record alpha11 v5 final evidence status [skip ci]'
          git push origin HEAD:main
