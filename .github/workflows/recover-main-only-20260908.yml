name: Recover independent repository to main only
on:
  push:
    branches: [main]
    paths: [.github/workflows/recover-main-only-20260908.yml]
permissions:
  contents: write
concurrency:
  group: recover-main-only-20260908
  cancel-in-progress: false
jobs:
  preserve-and-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Preserve every branch tip before deleting non-main refs
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: SUNHAOJUN22/TSAO-PROCESSING-SKILL
          RESTORED_PARENT: cd61ba6e4c4122a82dc356036e115ebaeaa8b459
          EXPECTED_BRANCHES: '{"archive/pre-tsaoscience-astra-pro-1":"2ae9ce4ff46528def5bd4d187dced642f200da9f","closure/20260828-controlled-artifact-ci":"b8a447ec2f32be29125aebff48fe247847b8611b","closure/20260828-distribution-ci-readme":"bc13cc4ce7a9e0194cf442bc4f4125e5fdbd2880","closure/final-debug-20260902":"48d8502b8cc25102cfb83882fbdc35ae42219e8a","closure/final-debug-readme-20260901":"6aee7fbb22f4616cdf7da2f20692afdf915669fa","diagnostic/20260831-performance-gate":"5e2b856125320333cd13ed45734a4d1c7e2a4f95","fix/20260831-final-provenance-ci":"8d214416fb59140551089edb779387e26fab16c6","fix/20260831-historical-performance-boundary":"1fad0ae1ca83eef4f60b31ea1f49b8abb646b903","fix/performance-work-unit-ci-20260831":"58c71ab8c6ac0b168c5d43d9a4d600231a3b738f","fix/processing-manifest-readme-20260831":"d748576b152d8b7e2dc4c7a14fc560bcda07d70c","remediation/pep517-setup-bootstrap":"547a7c458d8e85fe57dec7cf89bc3b3f021001c4"}'
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request, urllib.error, urllib.parse
          repo=os.environ['GITHUB_REPOSITORY']
          if repo!=os.environ['EXPECTED_REPOSITORY'] or os.environ['GITHUB_REF']!='refs/heads/main': raise RuntimeError('Unexpected target')
          expected=json.loads(os.environ['EXPECTED_BRANCHES'])
          def api(method,path,body=None,missing=False):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,method=method,data=None if body is None else json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as response:
                      raw=response.read(2000001)
                      if len(raw)>2000000: raise RuntimeError('Response too large')
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  if missing and exc.code==404: return None
                  raise RuntimeError(f'GitHub refused {method} {path}: HTTP {exc.code}') from None
          def ref(kind,name): return '/git/ref/'+kind+'/'+urllib.parse.quote(name,safe='')
          def main(): return api('GET','/git/ref/heads/main')['object']['sha']
          if main()!=os.environ['GITHUB_SHA']: raise RuntimeError('Main moved')
          if [p['sha'] for p in api('GET','/git/commits/'+os.environ['GITHUB_SHA'])['parents']]!=[os.environ['RESTORED_PARENT']]: raise RuntimeError('Unexpected parent')
          actual={r['ref'][11:]:r['object']['sha'] for r in api('GET','/git/matching-refs/heads/') if r['ref']!='refs/heads/main'}
          if actual!=expected: raise RuntimeError('Branch snapshot changed')
          backups=[]
          for branch,sha in sorted(expected.items()):
              if branch=='main': raise RuntimeError('Never remove main')
              tag='recovery/20260908/branch/'+branch
              old=api('GET',ref('tags',tag),missing=True)
              if old is None: api('POST','/git/refs',{'ref':'refs/tags/'+tag,'sha':sha})
              elif old['object']['sha']!=sha: raise RuntimeError('Tag collision')
              if api('GET',ref('tags',tag))['object']['sha']!=sha: raise RuntimeError('Backup mismatch')
              backups.append({'branch':branch,'sha':sha,'tag':tag})
          report={'repository':repo,'workflow_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'backups':backups,'deleted':[],'main_untouched':True,'state':'BACKED_UP'}
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'branch-recovery.json'
          def save(): path.write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          save()
          for item in backups:
              if main()!=os.environ['GITHUB_SHA']: raise RuntimeError('Main changed; stop')
              if api('GET',ref('heads',item['branch']))['object']['sha']!=item['sha']: raise RuntimeError('Branch changed; retain')
              if api('GET',ref('tags',item['tag']))['object']['sha']!=item['sha']: raise RuntimeError('Backup changed; retain')
              api('DELETE','/git/refs/heads/'+urllib.parse.quote(item['branch'],safe=''))
              if api('GET',ref('heads',item['branch']),missing=True) is not None: raise RuntimeError('Deletion unconfirmed')
              report['deleted'].append(item['branch']);save()
          report['remaining_branches']=[r['ref'][11:] for r in api('GET','/git/matching-refs/heads/')]
          report['state']='MAIN_ONLY' if report['remaining_branches']==['main'] else 'INCOMPLETE'
          save();print(json.dumps(report,indent=2))
          if report['state']!='MAIN_ONLY': raise RuntimeError('Unexpected remaining branch')
          PY
      - name: Save preservation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: branch-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/branch-recovery.json
          if-no-files-found: error
          retention-days: 30
