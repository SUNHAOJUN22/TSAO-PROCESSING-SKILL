name: One-shot Processing source-manifest convergence

on:
  push:
    branches:
      - remediation/pep517-setup-bootstrap

permissions:
  contents: write

concurrency:
  group: processing-source-manifest-convergence
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: remediation/pep517-setup-bootstrap
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install exact locked validation stack
        run: |
          python scripts/verify_dependency_lock.py requirements.lock --pyproject pyproject.toml
          python -m pip install --quiet --require-hashes -r requirements.lock
          python -m pip install --quiet --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Regenerate the deterministic source manifest
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/remediation-regenerate-source-manifest.yml
          python scripts/build_source_asset_manifest.py \
            --root . \
            --out reports/SOURCE_CORE_MANIFEST.tsv
          python -m ruff check \
            setup.py \
            tsao/distribution_policy.py \
            tests/test_release_integrity_alpha6.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_distribution_containment_v20.py \
            tests/test_release_integrity_alpha6.py \
            tests/test_doctor_alpha5.py \
            tests/test_main_only_ci_policy.py \
            tests/test_performance_contract.py \
            tests/test_performance_v2_numeric_parity.py
          python -m tsao.cli doctor --root . --profile core
          git diff --check

      - name: Verify and commit the closed manifest set
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          expected = {
              '.github/workflows/remediation-regenerate-source-manifest.yml',
              'reports/SOURCE_CORE_MANIFEST.tsv',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(
                  f'unexpected generated diff: expected={sorted(expected)!r} actual={sorted(actual)!r}'
              )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(provenance): regenerate source manifest"
          git push origin HEAD:remediation/pep517-setup-bootstrap
