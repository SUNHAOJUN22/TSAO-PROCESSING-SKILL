name: One-shot Processing manifest and README closure

on:
  push:
    branches:
      - fix/processing-manifest-readme-20260831
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: processing-manifest-readme-closure
  cancel-in-progress: false

jobs:
  qualify-and-reseal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact closure branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/processing-manifest-readme-20260831
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install exact locked validation stack
        run: |
          python scripts/verify_dependency_lock.py requirements.lock --pyproject pyproject.toml
          python -m pip install --quiet --require-hashes -r requirements.lock
          python -m pip install --quiet --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Apply, generate and qualify the closure tree
        run: python .github/closure/processing_manifest_readme.py

      - name: Commit tested files without modifying temporary workflow paths
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree \
            .github/workflows/closure-processing-manifest-readme.yml \
            .github/closure/processing_manifest_readme.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No closure changes produced' >&2; exit 1; } || true
          git commit -m 'fix(provenance): reseal performance annotation and README boundary'
          git push origin HEAD:fix/processing-manifest-readme-20260831
