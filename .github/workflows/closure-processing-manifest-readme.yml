name: One-shot Processing manifest and README closure

on:
  push:
    branches:
      - fix/processing-manifest-readme-20260831
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: processing-manifest-readme-closure
  cancel-in-progress: false

jobs:
  qualify-and-reseal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact closure branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/processing-manifest-readme-20260831
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install exact locked validation stack
        run: |
          python scripts/verify_dependency_lock.py requirements.lock --pyproject pyproject.toml
          python -m pip install --quiet --require-hashes -r requirements.lock
          python -m pip install --quiet --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Remove one-shot workflow and update canonical READMEs
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/closure-processing-manifest-readme.yml
          python - <<'PY'
          from pathlib import Path

          updates = {
              Path('README.md'): '''

<!-- closure:qualification-boundary -->
## Qualification and controlled-distribution boundary

The performance gate now annotates repository-scale work units through a tested, fail-closed helper before comparing like-for-like runs. Missing, non-finite, zero, or mismatched work-unit metadata is rejected rather than converted into a favorable timing result.

Software qualification is evaluated from the exact source tree. A successful test, doctor, coverage, or performance result does **not** authorize a public wheel, sdist, or source snapshot. While controlled historical metadata remains classified as project-controlled, public artifacts must continue to fail with `BLOCKED_CONTROLLED_METADATA_CLASSIFICATION` and must leave no distributable artifact behind.
''',
              Path('README.zh-CN.md'): '''

<!-- closure:qualification-boundary -->
## 软件资格与受控分发边界

性能门现通过经过测试、失败封闭的注释器记录仓库尺度工作量，再比较同一工作合同下的结果。缺失、非有限、为零或身份不一致的工作量元数据会被拒绝，不能被转换成有利的性能结论。

软件资格绑定到精确源码树。测试、doctor、覆盖率或性能门通过，均不构成公开 wheel、sdist 或源码快照的授权。只要受控历史元数据仍被标记为项目受控，公共制品就必须继续以 `BLOCKED_CONTROLLED_METADATA_CLASSIFICATION` 失败封闭，并且不得留下可分发制品。
''',
          }
          marker = '<!-- closure:qualification-boundary -->'
          for path, section in updates.items():
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  prefix = text.split(marker, 1)[0].rstrip()
                  text = prefix + section
              else:
                  text = text.rstrip() + section
              path.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY
          python -m ruff check --fix tests/test_performance_work_unit_annotation.py
          python -m ruff format tests/test_performance_work_unit_annotation.py

      - name: Regenerate exact source manifest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_source_asset_manifest.py \
            --root . \
            --out reports/SOURCE_CORE_MANIFEST.tsv

      - name: Run full software qualification
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_readme_assets.py
          python scripts/generate_extended_readme_assets.py
          python scripts/generate_decision_readme_assets.py
          python scripts/generate_performance_readme_assets.py
          python scripts/generate_uiux_readme_assets.py
          python scripts/harden_readme_svg_accessibility.py
          python scripts/verify_readme_visual_accessibility.py
          python scripts/sync_readme_visuals.py --check
          python scripts/run_ci.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_performance_work_unit_annotation.py \
            tests/test_doctor_alpha5.py \
            tests/test_performance_contract.py \
            tests/test_performance_v2_numeric_parity.py
          python -m ruff check tsao tests scripts skills/process-general skills/epdm skills/poe skills/polymer-general
          python -m ruff format --check tsao tests scripts skills/process-general skills/epdm skills/poe skills/polymer-general
          python -m tsao.cli doctor --root . --profile core
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'closure-processing-manifest-readme.yml' -print -quit)"
          git diff --check

      - name: Commit tested source and generated provenance
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree .github/workflows/closure-processing-manifest-readme.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No closure changes produced' >&2; exit 1; } || true
          git commit -m 'fix(provenance): reseal performance annotation and README boundary'
          git push origin HEAD:fix/processing-manifest-readme-20260831
