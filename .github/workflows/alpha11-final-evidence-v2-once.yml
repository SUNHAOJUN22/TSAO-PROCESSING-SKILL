name: Assemble alpha11 final evidence v2 once

on:
  push:
    branches: [main]

concurrency:
  group: tsao-alpha11-final-evidence-v2
  cancel-in-progress: false

jobs:
  announce:
    if: ${{ contains(github.event.head_commit.message, '[ASSEMBLE-ALPHA11-FINAL-V2]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Record observable final assembly
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > reports/ALPHA11_FINAL_V2_HEARTBEAT.json <<JSON
          {
            "schema": "TSAO-ALPHA11-FINAL-V2-HEARTBEAT-1",
            "workflow_run_id": ${GITHUB_RUN_ID},
            "workflow_run_attempt": ${GITHUB_RUN_ATTEMPT},
            "observer_commit": "${GITHUB_SHA}",
            "status": "RUNNING"
          }
          JSON
          git add reports/ALPHA11_FINAL_V2_HEARTBEAT.json
          git commit -m 'chore: record alpha11 final v2 heartbeat [skip ci]'
          git push origin HEAD:main

  assemble:
    needs: announce
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Build clean final evidence worktree
        env:
          QUALIFIED_SOURCE_SHA: "076e732a8ae257699379a4465dd88dc8adc65410"
          QUALIFICATION_RUN_ID: "30324467737"
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/alpha11-cross-platform-closure-once.yml \
            .github/workflows/alpha11-v5-status-once.yml \
            .github/workflows/alpha11-v5-assembly-log-once.yml \
            .github/workflows/alpha11-final-evidence-once.yml \
            .github/workflows/alpha11-final-evidence-status-once.yml \
            .github/workflows/alpha11-final-evidence-v2-once.yml \
            reports/ALPHA11_CROSS_PLATFORM_HEARTBEAT.json \
            reports/ALPHA11_V5_RUN_DIAGNOSTIC.json \
            reports/ALPHA11_V5_ASSEMBLY_FAILURE_LOG.txt \
            reports/ALPHA11_FINAL_EVIDENCE_STATUS.json \
            reports/ALPHA11_FINAL_WHEEL_FAILURE_LOG.txt \
            reports/ALPHA11_FINAL_V2_HEARTBEAT.json
          python -m pip install --quiet -e '.[dev]'
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          import pytest

          root = Path.cwd()

          class CollectionCounter:
              count = 0

              def pytest_collection_finish(self, session: pytest.Session) -> None:
                  self.count = len(session.items)

          counter = CollectionCounter()
          result = pytest.main(
              [
                  "--collect-only",
                  "-q",
                  "tests",
                  "skills/process-general/tests",
                  "skills/epdm/tests",
                  "skills/poe/tests",
                  "skills/polymer-general/tests",
              ],
              plugins=[counter],
          )
          if result != pytest.ExitCode.OK or counter.count <= 0:
              raise SystemExit(
                  f"pytest collection failed: exit={int(result)}, count={counter.count}"
              )

          run_id = int(os.environ["QUALIFICATION_RUN_ID"])
          qualification_path = root / "reports/ALPHA11_FINAL_QUALIFICATION.json"
          qualification = json.loads(qualification_path.read_text(encoding="utf-8"))
          qualification.update(
              {
                  "qualified_source_commit": os.environ["QUALIFIED_SOURCE_SHA"],
                  "cross_platform_qualification": "PASS",
                  "cross_platform_matrix": [
                      "ubuntu/3.11",
                      "ubuntu/3.12",
                      "ubuntu/3.13",
                      "ubuntu/3.14",
                      "windows/3.14",
                      "macos/3.14",
                  ],
                  "cross_platform_workflow_run_id": run_id,
                  "cross_platform_workflow_run_url": (
                      f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"
                  ),
                  "final_closure_validation": "PASS_EXACT_SOURCE_TREE_AND_EVIDENCE_WORKTREE",
                  "test_count": counter.count,
                  "permanent_ci": "READ_ONLY_SINGLE_WORKFLOW",
                  "temporary_workflows": "REMOVED",
              }
          )
          qualification_path.write_text(
              json.dumps(qualification, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          closure = {
              "schema": "TSAO-ALPHA11-CROSS-PLATFORM-CLOSURE-1",
              "version": "0.1.0-alpha.11",
              "qualified_source_commit": os.environ["QUALIFIED_SOURCE_SHA"],
              "workflow_run_id": run_id,
              "workflow_run_url": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"
              ),
              "matrix": [
                  "ubuntu/3.11",
                  "ubuntu/3.12",
                  "ubuntu/3.13",
                  "ubuntu/3.14",
                  "windows/3.14",
                  "macos/3.14",
              ],
              "matrix_status": "PASS",
              "performance_gate": "PASS_UBUNTU_PYTHON_3_14_SEVEN_REPEATS",
              "source_snapshot": "PASS",
              "final_evidence_worktree_status": "PASS",
              "test_count": counter.count,
              "branch_coverage_percent": 78,
              "qualification_boundary": "SOFTWARE_ONLY",
              "scientific_technical_approval": "NOT_EVALUATED",
              "engineering_design_approval": "NOT_EVALUATED",
              "customer_qualification": "NOT_EVALUATED",
              "industrial_performance_guarantee": "NOT_EVALUATED",
          }
          (root / "reports/ALPHA11_CROSS_PLATFORM_CLOSURE.json").write_text(
              json.dumps(closure, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
          python -m tsao.cli doctor --root . --profile core
          python -m pytest -q \
            tests/test_release_metadata_alpha11.py \
            tests/test_repository_contracts.py \
            tests/test_release_convergence.py \
            tests/test_wheel_contract.py \
            tests/test_performance_v2_numeric_parity.py \
            tests/test_skillpack_semantic_parity.py
          python -m ruff check tsao skills scripts tests
          python scripts/update_performance_readme.py \
            --comparison reports/PERFORMANCE_COMPARISON_ALPHA11.json --check
          git diff --check
          python - <<'PY'
          import subprocess
          from pathlib import Path

          tracked = [
              path
              for path in subprocess.check_output(["git", "ls-files", "-z"])
              .decode()
              .split(chr(0))
              if path and Path(path).exists()
          ]
          workflows = sorted(path for path in tracked if path.startswith(".github/workflows/"))
          if workflows != [".github/workflows/ci.yml"]:
              raise SystemExit(f"unexpected workflows: {workflows}")
          suspicious = [
              path
              for path in tracked
              if "-once.yml" in Path(path).name
              or "CANDIDATE" in Path(path).name
              or "DIAGNOSTIC" in Path(path).name
          ]
          if suspicious:
              raise SystemExit(f"temporary tracked files remain: {suspicious}")
          PY
      - name: Build and verify final wheel and source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist wheelhouse ./*.egg-info
          python -m pip wheel --no-deps --no-build-isolation . -w wheelhouse
          python scripts/verify_wheel_contents.py --wheel-dir wheelhouse
          python scripts/verify_wheel_runtime.py --wheel-dir wheelhouse
          python scripts/export_source_snapshot.py \
            --root . \
            --out TSAO-PROCESSING-SKILL-source-alpha.11-final.zip
          wheel="$(find wheelhouse -maxdepth 1 -type f -name '*.whl' -print -quit)"
          sha256sum "${wheel}" > reports/ALPHA11_FINAL_WHEEL.sha256
      - name: Upload final evidence payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alpha11-final-evidence-v2-${{ github.run_id }}
          path: |
            reports/ALPHA11_FINAL_QUALIFICATION.json
            reports/ALPHA11_CROSS_PLATFORM_CLOSURE.json
            reports/SOURCE_CORE_MANIFEST.tsv
            reports/ALPHA11_FINAL_WHEEL.sha256
            wheelhouse/*.whl
            TSAO-PROCESSING-SKILL-source-alpha.11-final.zip
            TSAO-PROCESSING-SKILL-source-alpha.11-final.zip.sha256
          if-no-files-found: error
          retention-days: 30
