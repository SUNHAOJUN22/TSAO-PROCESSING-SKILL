name: Repair Windows hashed lock v2 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-windows-lock-v2-once.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: tsao-repair-windows-lock-v2-once
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Apply deterministic cross-platform lock repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"
          cp .github/workflows/repair-windows-lock-once.yml "$RUNNER_TEMP/repair-windows-lock-once.yml"
          cp .github/workflows/repair-windows-lock-v2-once.yml "$RUNNER_TEMP/repair-windows-lock-v2-once.yml"
          rm .github/workflows/repair-windows-lock-once.yml
          rm .github/workflows/repair-windows-lock-v2-once.yml
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          lock = Path("requirements.lock")
          text = lock.read_text(encoding="utf-8")
          anchor = (
              "attrs==26.1.0 \\\n"
              "    --hash=sha256:c647aa4a12dfbad9333ca4e71fe62ddc36f4e63b2d260a37a8b83d2f043ac309 \\\n"
              "    --hash=sha256:d03ceb89cb322a8fd706d4fb91940737b6642aa36998fe130a9bc96c985eff32\n"
              "    # via\n"
              "    #   jsonschema\n"
              "    #   referencing\n"
          )
          colorama = (
              "colorama==0.4.6 \\\n"
              "    --hash=sha256:08695f5cb7ed6e0531a20572697297273c47b8cae5a63ffc6d6ed5c201be6e44 \\\n"
              "    --hash=sha256:4f1d9991f5acc0ca119f9d443620b77f9d6b33703e51011c16baf57afb285fc6\n"
              "    # via pytest\n"
          )
          if colorama not in text:
              if text.count(anchor) != 1:
                  raise SystemExit("requirements.lock attrs anchor mismatch")
              text = text.replace(anchor, anchor + colorama, 1)
          lock.write_text(text, encoding="utf-8")

          supply = Path("docs/SUPPLY_CHAIN_REPRODUCIBILITY.md")
          text = supply.read_text(encoding="utf-8")
          sentence = (
              "The permanent qualification workflow validates the committed lock, installs it with "
              "`pip --require-hashes`, installs TSAO with `--no-deps --no-build-isolation`, runs "
              "`pip check`, and executes the complete repository, Wheel and source-snapshot Gates."
          )
          addition = (
              " The lock also carries platform-conditional transitive packages required by the "
              "supported Windows runners, so hash mode does not delegate dependency resolution "
              "back to the network."
          )
          if addition.strip() not in text:
              if text.count(sentence) != 1:
                  raise SystemExit("supply-chain documentation anchor mismatch")
              text = text.replace(sentence, sentence + addition, 1)
          supply.write_text(text, encoding="utf-8")

          policy = Path("tests/test_main_only_ci_policy.py")
          text = policy.read_text(encoding="utf-8")
          old = (
              "    assert text.count(\"python -m pip install --quiet --no-deps "
              "--no-build-isolation -e .\") == 2\n"
              "    assert \"--allow-missing\" not in text\n"
          )
          new = (
              "    assert text.count(\"python -m pip install --quiet --no-deps "
              "--no-build-isolation -e .\") == 2\n"
              "    assert text.count(\"- name: Install exact locked dependencies\") == 2\n"
              "    assert text.count(\"- name: Install TSAO without dependency resolution\") == 2\n"
              "    assert text.count(\"- name: Verify installed dependency graph\") == 2\n"
              "    assert \"Install locked qualification environment\" not in text\n"
              "    assert \"Install locked snapshot environment\" not in text\n"
              "    assert \"--allow-missing\" not in text\n"
          )
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit("CI policy test anchor mismatch")
              text = text.replace(old, new, 1)
          policy.write_text(text, encoding="utf-8")

          lock_test = Path("tests/test_dependency_lock.py")
          text = lock_test.read_text(encoding="utf-8")
          test = dedent('''

          def test_committed_lock_covers_windows_pytest_dependency() -> None:
              root = Path(__file__).resolve().parents[1]
              report = verify_lock(root / "requirements.lock", root / "pyproject.toml")
              assert report["status"] == "PASS", report["errors"]
              colorama = report["packages"].get("colorama")
              assert colorama == {
                  "version": "0.4.6",
                  "hashes": [
                      "08695f5cb7ed6e0531a20572697297273c47b8cae5a63ffc6d6ed5c201be6e44",
                      "4f1d9991f5acc0ca119f9d443620b77f9d6b33703e51011c16baf57afb285fc6",
                  ],
              }
          ''')
          if "test_committed_lock_covers_windows_pytest_dependency" not in text:
              text = text.rstrip() + test
          lock_test.write_text(text, encoding="utf-8")
          PY
          python scripts/verify_dependency_lock.py requirements.lock --pyproject pyproject.toml --json-out reports/DEPENDENCY_LOCK_QUALIFICATION_2026-08-05.json
          python scripts/update_source_overlay.py --root . \
            .github/workflows/ci.yml \
            requirements.lock \
            docs/SUPPLY_CHAIN_REPRODUCIBILITY.md \
            reports/DEPENDENCY_LOCK_QUALIFICATION_2026-08-05.json \
            tests/test_dependency_lock.py \
            tests/test_main_only_ci_policy.py
          git diff --check
      - name: Install exact repaired lock
        run: python -m pip install --quiet --require-hashes -r requirements.lock
      - name: Install TSAO without dependency resolution
        run: python -m pip install --quiet --no-deps --no-build-isolation -e .
      - name: Verify installed dependency graph
        run: python -m pip check
      - name: Run complete qualification
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/windows-lock-repair-v2-evidence"
          mkdir -p "$evidence"
          python scripts/generate_readme_assets.py
          python scripts/generate_extended_readme_assets.py
          python scripts/generate_decision_readme_assets.py
          python scripts/generate_performance_readme_assets.py
          python scripts/generate_uiux_readme_assets.py
          python scripts/harden_readme_svg_accessibility.py | tee "$evidence/svg-hardening.json"
          python scripts/verify_readme_visual_accessibility.py | tee "$evidence/svg-accessibility.json"
          python scripts/sync_readme_visuals.py --check
          python scripts/run_ci.py | tee "$evidence/run-ci.json"
          python scripts/audit_capabilities.py | tee "$evidence/capabilities.json"
          python skills/epdm/scripts/audit_epdm.py | tee "$evidence/epdm.json"
          python skills/poe/scripts/audit_p0.py --root . | tee "$evidence/poe-p0.json"
          python skills/poe/scripts/audit_p1.py --root . | tee "$evidence/poe-p1.json"
          python -m tsao.cli doctor --root . --profile core | tee "$evidence/doctor.json"
          python -m tsao.skillpacks --root . | tee "$evidence/skillpacks.json"
          rm -rf wheelhouse build dist
          find . -maxdepth 1 -type d -name '*.egg-info' -exec rm -rf {} +
          python -m pip wheel --quiet --no-deps --no-build-isolation . -w wheelhouse
          python scripts/verify_wheel_contents.py --wheel-dir wheelhouse | tee "$evidence/wheel-contents.json"
          python scripts/verify_wheel_runtime.py --wheel-dir wheelhouse | tee "$evidence/wheel-runtime.json"
          python scripts/export_source_snapshot.py --root . --out "$evidence/TSAO-PROCESSING-SKILL-source-windows-lock-repair-v2.zip" | tee "$evidence/source-snapshot.json"
      - name: Commit qualified non-workflow repair
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"
          cp "$RUNNER_TEMP/repair-windows-lock-once.yml" .github/workflows/repair-windows-lock-once.yml
          cp "$RUNNER_TEMP/repair-windows-lock-v2-once.yml" .github/workflows/repair-windows-lock-v2-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            requirements.lock \
            docs/SUPPLY_CHAIN_REPRODUCIBILITY.md \
            reports/DEPENDENCY_LOCK_QUALIFICATION_2026-08-05.json \
            reports/SOURCE_CORE_OVERLAY.tsv \
            tests/test_dependency_lock.py \
            tests/test_main_only_ci_policy.py
          python - <<'PY'
          import subprocess
          expected = {
              "requirements.lock",
              "docs/SUPPLY_CHAIN_REPRODUCIBILITY.md",
              "reports/DEPENDENCY_LOCK_QUALIFICATION_2026-08-05.json",
              "reports/SOURCE_CORE_OVERLAY.tsv",
              "tests/test_dependency_lock.py",
              "tests/test_main_only_ci_policy.py",
          }
          actual = set(subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f"qualified path mismatch: missing={sorted(expected-actual)} unexpected={sorted(actual-expected)}")
          PY
          git diff --cached --check
          git commit -m 'fix: complete cross-platform hashed dependency lock'
          final_sha="$(git rev-parse HEAD)"
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main
          gh issue comment 68 --repo "$GITHUB_REPOSITORY" --body "Windows hashed-lock repair v2 qualified and published in commit \`$final_sha\` from run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Both one-shot workflows still require explicit cleanup before permanent CI qualification."
      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-lock-repair-v2-${{ github.sha }}
          path: ${{ runner.temp }}/windows-lock-repair-v2-evidence/**
          if-no-files-found: warn
          retention-days: 30

  notify-failure:
    needs: repair
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh issue comment 68 --repo "$GITHUB_REPOSITORY"
          --body "Windows hashed-lock repair v2 failed closed in run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. No qualified repair commit was published."
