name: V4 strict fail-closed hardening once

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: v4-strict-hardening-once
  cancel-in-progress: false

jobs:
  harden:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '/run-v4-strict-hardening')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install exact qualification environment
        run: |
          set -euo pipefail
          python scripts/verify_dependency_lock.py requirements.lock --pyproject pyproject.toml
          python -m pip install --quiet --require-hashes -r requirements.lock
          python -m pip install --quiet --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Build controller-free provenance-bound candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/ci.yml')
          text = workflow.read_text(encoding='utf-8')
          old = "          trap 'git worktree remove --force \"$baseline_root\" 2>/dev/null || true' EXIT\n"
          new = (
              "          cleanup_baseline_worktree() {\n"
              "            if [[ -d \"$baseline_root\" ]]; then\n"
              "              git worktree remove --force \"$baseline_root\"\n"
              "            fi\n"
              "          }\n"
              "          trap cleanup_baseline_worktree EXIT\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one masked worktree cleanup, found {text.count(old)}')
          workflow.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          Path('.github/workflows/v4-strict-hardening-once.yml').unlink()
          PY
          python scripts/update_source_overlay.py --root . \
            --target reports/SOURCE_CORE_OVERLAY.tsv \
            .github/workflows/ci.yml
          python scripts/update_source_overlay.py --root . \
            --target reports/SOURCE_ACCEPTANCE_OVERLAY.tsv \
            .github/workflows/ci.yml
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            .github/workflows/ci.yml \
            .github/workflows/v4-strict-hardening-once.yml \
            reports/SOURCE_CORE_MANIFEST.tsv \
            reports/SOURCE_CORE_OVERLAY.tsv \
            reports/SOURCE_ACCEPTANCE_OVERLAY.tsv
          git commit -m 'ci: make performance worktree cleanup fail closed'
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run complete software, numerical, visual and provenance gates
        run: |
          set -euo pipefail
          node scripts/refresh-current-main-readme.mjs --check
          python scripts/run_ci.py
          python -m tsao.cli doctor --root . --profile core
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          forbidden = ('continue-on-error:', '|| true', 'pytest ... || exit 0')
          found = [token for token in forbidden if token in text]
          if found:
              raise SystemExit(f'forbidden fail-open workflow constructs remain: {found}')
          PY
          git diff --exit-code
          git diff --check
      - name: Prove sole remote main branch
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads origin > /tmp/branches.txt
          python - <<'PY'
          from pathlib import Path
          refs = [line.split()[1] for line in Path('/tmp/branches.txt').read_text().splitlines() if line.strip()]
          if refs != ['refs/heads/main']:
              raise SystemExit(f'unexpected remote branches: {refs}')
          PY
      - name: Publish exact qualified candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          expected_parent="$(git rev-parse HEAD^)"
          remote_main="$(git rev-parse origin/main)"
          if [[ "$expected_parent" != "$remote_main" ]]; then
            echo "STALE_MAIN expected_parent=$expected_parent remote_main=$remote_main" >&2
            exit 3
          fi
          git push origin HEAD:main
      - name: Publish machine result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ job.status }}
          CANDIDATE: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          gh issue comment "$ISSUE" --body "V4_STRICT_HARDENING outcome=${OUTCOME} candidate=${CANDIDATE:-UNPUBLISHED} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} controller=self_removed provenance=core+acceptance+manifest branch=main-only"
