name: One-shot Processing closure qualification

on:
  push:
    branches: [closure/20260828-controlled-artifact-ci]

permissions:
  contents: write

concurrency:
  group: processing-closure-20260828
  cancel-in-progress: false

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: closure/20260828-controlled-artifact-ci
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Apply reviewed source and expose final workflow view
        shell: bash
        run: |
          set -euo pipefail
          cp .github/closure/final-ci.yml /tmp/final-ci.yml
          gzip -dc .github/closure/nonworkflow.patch.gz > /tmp/nonworkflow.patch
          git apply --index --binary /tmp/nonworkflow.patch
          rm -rf .github/closure
          cp /tmp/final-ci.yml .github/workflows/ci.yml
          rm .github/workflows/closure-export.yml
          git add -A
      - name: Qualify controlled-distribution closure
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_dependency_lock.py requirements.lock --pyproject pyproject.toml
          python -m pip install --quiet --require-hashes -r requirements.lock
          python -m pip install --quiet --no-deps --no-build-isolation -e .
          python -m pip check
          python -m ruff format tsao tests scripts skills/process-general skills/epdm skills/poe skills/polymer-general
          python scripts/build_source_asset_manifest.py --root . --out reports/SOURCE_CORE_MANIFEST.tsv
          git add -A
          python -m pytest -q -p no:cacheprovider
          python -m ruff check tsao tests scripts skills/process-general skills/epdm skills/poe skills/polymer-general
          python -m ruff format --check tsao tests scripts skills/process-general skills/epdm skills/poe skills/polymer-general
          python -m tsao.cli doctor --root . --profile core
          python scripts/build_source_asset_manifest.py --root . --out /tmp/SOURCE_CORE_MANIFEST.tsv
          cmp /tmp/SOURCE_CORE_MANIFEST.tsv reports/SOURCE_CORE_MANIFEST.tsv
          python - <<'PY'
          from pathlib import Path
          import subprocess

          result = subprocess.run(
              ["python", "-m", "pip", "wheel", "--no-deps", "--no-build-isolation", ".", "-w", "wheelhouse"],
              text=True,
              capture_output=True,
          )
          message = result.stdout + result.stderr
          assert result.returncode != 0, message
          assert "BLOCKED_CONTROLLED_METADATA_CLASSIFICATION" in message, message
          assert not list(Path("wheelhouse").glob("*.whl"))
          PY
          git diff --check
      - name: Commit qualified non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree .github/workflows
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(closure): align controlled distribution CI and documentation"
          git push origin HEAD:closure/20260828-controlled-artifact-ci
