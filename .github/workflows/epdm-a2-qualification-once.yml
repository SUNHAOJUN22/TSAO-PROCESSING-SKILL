name: Qualify EPDM Phase A2 once

on:
  issues:
    types: [reopened]

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: tsao-epdm-phase-a2-qualification-once
  cancel-in-progress: false

env:
  PAYLOAD_SHA256: d3f03c572ac2666aea6f31c90530e86faf66adbac07a55c942881b25b95d9093
  PAYLOAD_BYTES: '43356'
  EXPECTED_PARTS: '10'
  EXPECTED_TEST_COUNT: '278'

jobs:
  qualification:
    if: ${{ github.event.issue.title == '[QUALIFY-EPDM-A2]' }}
    name: qualification (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: ubuntu/3.11, os: ubuntu-latest, python: '3.11'}
          - {label: ubuntu/3.12, os: ubuntu-latest, python: '3.12'}
          - {label: ubuntu/3.13, os: ubuntu-latest, python: '3.13'}
          - {label: ubuntu/3.14, os: ubuntu-latest, python: '3.14'}
          - {label: windows/3.14, os: windows-latest, python: '3.14'}
          - {label: macos/3.14, os: macos-latest, python: '3.14'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install qualification environment
        run: python -m pip install --quiet -e .[dev]
      - name: Materialize exact Phase A2 candidate
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          from __future__ import annotations
          import base64, hashlib, json, lzma, os, re, subprocess, tarfile
          from io import BytesIO
          from pathlib import Path
          raw = subprocess.check_output(['gh', 'api', f"/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['ISSUE_NUMBER']}/comments?per_page=100"], text=True)
          comments = json.loads(raw)
          parts: dict[int, str] = {}
          pattern = re.compile(r'^A2_PAYLOAD_(\d{2}):([A-Za-z0-9+/=]+)$')
          for comment in comments:
              match = pattern.fullmatch(str(comment.get('body', '')).strip())
              if match:
                  parts[int(match.group(1))] = match.group(2)
          expected_parts = int(os.environ['EXPECTED_PARTS'])
          if sorted(parts) != list(range(1, expected_parts + 1)):
              raise SystemExit(f'payload parts mismatch: {sorted(parts)}')
          compressed = base64.b64decode(''.join(parts[index] for index in range(1, expected_parts + 1)))
          if len(compressed) != int(os.environ['PAYLOAD_BYTES']):
              raise SystemExit(f'payload size mismatch: {len(compressed)}')
          observed = hashlib.sha256(compressed).hexdigest()
          if observed != os.environ['PAYLOAD_SHA256']:
              raise SystemExit(f'payload digest mismatch: {observed}')
          archive = lzma.decompress(compressed)
          with tarfile.open(fileobj=BytesIO(archive), mode='r:') as tar:
              members = tar.getmembers()
              for member in members:
                  path = Path(member.name)
                  if path.is_absolute() or '..' in path.parts or not member.isfile():
                      raise SystemExit(f'unsafe payload member: {member.name}')
              tar.extractall('.', members=members, filter='data')
          PY
          rm -f .github/workflows/epdm-a2-qualification-once.yml
          rm -rf build dist wheelhouse work
          find . -maxdepth 1 -type d -name '*.egg-info' -exec rm -rf {} +
          python -m ruff check --fix --select I scripts/verify_wheel_contents.py scripts/verify_wheel_runtime.py skills/epdm/state_generator.py skills/epdm/reaction_network.py skills/epdm/validation_v2.py skills/epdm/tests/test_epdm_phase_a2.py tests/test_wheel_contract.py
          git add -A
      - name: Rebuild and verify source identity
        run: |
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
          git add reports/SOURCE_CORE_MANIFEST.tsv
          python -m tsao.cli doctor --root . --profile core
      - name: Full software qualification
        run: python scripts/run_ci.py
      - name: Skillpack, wheel and installed-runtime closure
        run: |
          python -m tsao.skillpacks --root .
          python -m tsao.cli package template --family 'generic process'
          python -m pip wheel --no-deps --no-build-isolation . -w wheelhouse
          python scripts/verify_wheel_contents.py --wheel-dir wheelhouse
          python scripts/verify_wheel_runtime.py --wheel-dir wheelhouse
      - name: Phase A2 structural smoke
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from skills.epdm.reaction_network import A2NumericalExecutionError, audit_reaction_network, build_reaction_network, reaction_network_rhs
          from skills.epdm.state_generator import generate_state_definition
          from skills.epdm.validation_v2 import validate_v2_project
          state = generate_state_definition(source_state_definition_id='EPDM-V2-STATE-REFERENCE', model_level=2, site_family_ids=('SITE-A',))
          network = build_reaction_network(state)
          audit = audit_reaction_network(network, state)
          assert state.size == 20
          assert len(network.channels) == 41
          assert audit.decision.value == 'PASS'
          assert audit.metrics['propagation_channel_count'] == 9
          project = json.loads(Path('skills/epdm/fixtures/v2_phase_a2_reference_project.json').read_text(encoding='utf-8'))
          validation = validate_v2_project(project)
          assert validation.decision.value == 'PASS', validation.as_dict()
          try:
              reaction_network_rhs()
          except A2NumericalExecutionError:
              pass
          else:
              raise AssertionError('A2 numerical RHS must remain unavailable')
          PY
      - name: Extended performance regression gate
        if: matrix.label == 'ubuntu/3.14'
        run: |
          python scripts/benchmark_performance_v2.py --repeats 7 --wheel-dir wheelhouse --output reports/runtime/PERFORMANCE_RESULTS_V2.json
          python scripts/compare_performance_v2.py --baseline reports/PERFORMANCE_BASELINE_ALPHA10_EXTENDED.json --current reports/runtime/PERFORMANCE_RESULTS_V2.json --output reports/runtime/PERFORMANCE_COMPARISON_V2.json
          python scripts/update_performance_readme.py --comparison reports/PERFORMANCE_COMPARISON_ALPHA11.json --check
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: epdm-a2-${{ matrix.os }}-py${{ matrix.python }}-${{ github.run_id }}
          path: |
            reports/runtime/CI_RESULTS.json
            reports/runtime/PERFORMANCE_RESULTS_V2.json
            reports/runtime/PERFORMANCE_COMPARISON_V2.json
            wheelhouse/*.whl
          if-no-files-found: warn
          retention-days: 14

  finalize:
    if: ${{ github.event.issue.title == '[QUALIFY-EPDM-A2]' }}
    needs: qualification
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install qualification environment
        run: python -m pip install --quiet -e .[dev]
      - name: Reproduce exact qualified Phase A2 tree
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          from __future__ import annotations
          import base64, hashlib, json, lzma, os, re, subprocess, tarfile
          from io import BytesIO
          from pathlib import Path
          raw = subprocess.check_output(['gh', 'api', f"/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['ISSUE_NUMBER']}/comments?per_page=100"], text=True)
          comments = json.loads(raw)
          parts: dict[int, str] = {}
          pattern = re.compile(r'^A2_PAYLOAD_(\d{2}):([A-Za-z0-9+/=]+)$')
          for comment in comments:
              match = pattern.fullmatch(str(comment.get('body', '')).strip())
              if match:
                  parts[int(match.group(1))] = match.group(2)
          expected_parts = int(os.environ['EXPECTED_PARTS'])
          if sorted(parts) != list(range(1, expected_parts + 1)):
              raise SystemExit(f'payload parts mismatch: {sorted(parts)}')
          compressed = base64.b64decode(''.join(parts[index] for index in range(1, expected_parts + 1)))
          if len(compressed) != int(os.environ['PAYLOAD_BYTES']):
              raise SystemExit(f'payload size mismatch: {len(compressed)}')
          observed = hashlib.sha256(compressed).hexdigest()
          if observed != os.environ['PAYLOAD_SHA256']:
              raise SystemExit(f'payload digest mismatch: {observed}')
          archive = lzma.decompress(compressed)
          with tarfile.open(fileobj=BytesIO(archive), mode='r:') as tar:
              members = tar.getmembers()
              for member in members:
                  path = Path(member.name)
                  if path.is_absolute() or '..' in path.parts or not member.isfile():
                      raise SystemExit(f'unsafe payload member: {member.name}')
              tar.extractall('.', members=members, filter='data')
          PY
          rm -f .github/workflows/epdm-a2-qualification-once.yml
          rm -rf build dist wheelhouse work
          find . -maxdepth 1 -type d -name '*.egg-info' -exec rm -rf {} +
          python -m ruff check --fix --select I scripts/verify_wheel_contents.py scripts/verify_wheel_runtime.py skills/epdm/state_generator.py skills/epdm/reaction_network.py skills/epdm/validation_v2.py skills/epdm/tests/test_epdm_phase_a2.py tests/test_wheel_contract.py
          git add -A
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
          git add reports/SOURCE_CORE_MANIFEST.tsv
          python -m tsao.cli doctor --root . --profile core
          python scripts/run_ci.py
          python -m pip wheel --no-deps --no-build-isolation . -w wheelhouse
          python scripts/verify_wheel_contents.py --wheel-dir wheelhouse
          python scripts/verify_wheel_runtime.py --wheel-dir wheelhouse
      - name: Verify matrix and write qualification report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, os, re, shutil, subprocess, sys
          from pathlib import Path
          repository = os.environ['GITHUB_REPOSITORY']
          run_id = int(os.environ['GITHUB_RUN_ID'])
          jobs = json.loads(subprocess.check_output(['gh', 'api', f'/repos/{repository}/actions/runs/{run_id}/jobs?per_page=100'], text=True))['jobs']
          expected = {'qualification (ubuntu/3.11)', 'qualification (ubuntu/3.12)', 'qualification (ubuntu/3.13)', 'qualification (ubuntu/3.14)', 'qualification (windows/3.14)', 'qualification (macos/3.14)'}
          qualification_jobs = [job for job in jobs if str(job.get('name', '')).startswith('qualification (')]
          observed = {job['name'] for job in qualification_jobs}
          if observed != expected:
              raise SystemExit(f'matrix mismatch: {sorted(observed)}')
          if any(job.get('conclusion') != 'success' for job in qualification_jobs):
              raise SystemExit('one or more qualification jobs failed')
          mandatory = {'Materialize exact Phase A2 candidate', 'Rebuild and verify source identity', 'Full software qualification', 'Skillpack, wheel and installed-runtime closure', 'Phase A2 structural smoke'}
          matrix = []
          for job in sorted(qualification_jobs, key=lambda item: item['name']):
              steps = {step['name']: step.get('conclusion') for step in job.get('steps', [])}
              failed = sorted(name for name in mandatory if steps.get(name) != 'success')
              if failed:
                  raise SystemExit(f"{job['name']} missing/failed: {failed}")
              matrix.append({'name': job['name'], 'job_id': job['id'], 'conclusion': job['conclusion']})
          ubuntu_314 = next(job for job in qualification_jobs if job['name'] == 'qualification (ubuntu/3.14)')
          perf = {step['name']: step.get('conclusion') for step in ubuntu_314['steps']}.get('Extended performance regression gate')
          if perf != 'success':
              raise SystemExit('performance gate did not succeed')
          collected = subprocess.run([sys.executable, '-m', 'pytest', '--collect-only', '-q', 'tests', 'skills/process-general/tests', 'skills/epdm/tests', 'skills/poe/tests', 'skills/polymer-general/tests'], text=True, capture_output=True, check=True)
          file_counts = [int(match.group(1)) for line in collected.stdout.splitlines() if (match := re.fullmatch(r'.+\.py:\s*(\d+)\s*', line.strip()))]
          test_count = sum(file_counts)
          if test_count != int(os.environ['EXPECTED_TEST_COUNT']):
              raise SystemExit(f'test count mismatch: {test_count}')
          for name in ('build', 'dist', 'wheelhouse', 'work'):
              shutil.rmtree(name, ignore_errors=True)
          for path in Path('.').glob('*.egg-info'):
              shutil.rmtree(path, ignore_errors=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          qualified_code_tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          report = {
              'schema': 'TSAO-EPDM-PHASE-A2-QUALIFICATION-1',
              'phase': 'EPDM_PHASE_A2_REACTION_NETWORK_AND_STATE_GENERATOR',
              'status': 'PASS',
              'baseline_commit': '70c8aa46e16ba5c73e0305fc6426a0ef27937af3',
              'qualified_code_tree_sha': qualified_code_tree,
              'qualification_run_id': run_id,
              'qualification_run_url': f'https://github.com/{repository}/actions/runs/{run_id}',
              'cross_platform_matrix': matrix,
              'test_count': test_count,
              'coverage_gate': 'PASS_FAIL_UNDER_75',
              'ruff': 'PASS_ALL_MATRIX_JOBS',
              'wheel_build': 'PASS_ALL_MATRIX_JOBS',
              'wheel_content': 'PASS_A2_EXPLICIT_MEMBERS',
              'isolated_runtime': 'PASS_A2_STRUCTURAL_SMOKE_ALL_MATRIX_JOBS',
              'skillpack_delivery': 'PASS_ALL_MATRIX_JOBS',
              'performance_regression_gate': 'PASS_UBUNTU_PYTHON_3_14_UNCHANGED_THRESHOLD',
              'v1_public_api_lock': 'PASS_ZERO_REGRESSION',
              'v1_golden_numeric_lock': 'PASS_ZERO_REGRESSION',
              'phase_a1_contracts_and_schemas': 'PASS_ZERO_REGRESSION',
              'deterministic_generated_state_layout': 'SOFTWARE_VERIFIED_PHASE_A2',
              'terminal_incoming_propagation_topology': 'SOFTWARE_VERIFIED_PHASE_A2',
              'structural_stoichiometric_matrix': 'SOFTWARE_VERIFIED_PHASE_A2',
              'active_site_inventory_conservation': 'PASS',
              'tdb_structural_pathways': 'OPTIONAL_LEVEL3_SOFTWARE_VERIFIED',
              'requirements_count': 80,
              'numerical_execution': 'NOT_IMPLEMENTED_PHASE_A2',
              'rate_evaluation_rhs_integration': 'NOT_IMPLEMENTED',
              'thermodynamics_calibration_gpc_moments_reactors_dynamics': 'NOT_IMPLEMENTED',
              'temporary_workflows': 'REMOVED_IN_FINAL_COMMIT',
              'qualification_boundary': 'SOFTWARE_STRUCTURE_ONLY',
              'scientific_technical_approval': 'NOT_EVALUATED',
              'engineering_design_approval': 'NOT_EVALUATED',
              'hse_approval': 'NOT_EVALUATED',
              'customer_qualification': 'NOT_EVALUATED',
              'industrial_performance_guarantee': 'NOT_EVALUATED',
              'next_phase': 'EPDM_PHASE_A3_RATE_LAWS_PARAMETER_BINDING_AND_STRUCTURAL_RHS',
          }
          Path('reports/EPDM_PHASE_A2_QUALIFICATION.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
          git add reports/EPDM_PHASE_A2_QUALIFICATION.json reports/SOURCE_CORE_MANIFEST.tsv
          python -m tsao.cli doctor --root . --profile core
      - name: Commit qualified Phase A2 tree
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(epdm): implement Phase A2 reaction network and state generator'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh issue comment --repo "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" --body "EPDM Phase A2 qualification PASS. Final commit: \`$COMMIT_SHA\`. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue close --repo "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" --reason completed

  report-failure:
    if: ${{ always() && github.event.issue.title == '[QUALIFY-EPDM-A2]' && needs.qualification.result != 'success' }}
    needs: qualification
    runs-on: ubuntu-latest
    steps:
      - name: Report failure
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment --repo "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" --body "EPDM Phase A2 qualification FAILED. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
