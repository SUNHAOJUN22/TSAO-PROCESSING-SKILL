name: Qualify EPDM Phase A0 once

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tsao-epdm-a0-qualification-once
  cancel-in-progress: false

jobs:
  qualification:
    if: ${{ contains(github.event.head_commit.message, '[QUALIFY-EPDM-A0]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest]
        include:
          - os: windows-latest
            python-version: '3.14'
          - os: macos-latest
            python-version: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install development environment
        run: python -m pip install --quiet -e .[dev]
      - name: Dependency integrity
        run: python -m pip check
      - name: Core, specialist, Ruff and coverage qualification
        run: python scripts/run_ci.py
      - name: Skillpack closure
        run: |
          python -m tsao.skillpacks --root .
          python -m tsao.cli package template --family "generic process"
      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation . -w wheelhouse
      - name: Verify wheel contents and isolated runtime
        run: |
          python scripts/verify_wheel_contents.py --wheel-dir wheelhouse
          python scripts/verify_wheel_runtime.py --wheel-dir wheelhouse
      - name: Extended performance regression gate
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: |
          python scripts/benchmark_performance_v2.py --repeats 7 --wheel-dir wheelhouse --output reports/runtime/PERFORMANCE_RESULTS_V2.json
          python scripts/compare_performance_v2.py --baseline reports/PERFORMANCE_BASELINE_ALPHA10_EXTENDED.json --current reports/runtime/PERFORMANCE_RESULTS_V2.json --output reports/runtime/PERFORMANCE_COMPARISON_V2.json
          python scripts/update_performance_readme.py --comparison reports/PERFORMANCE_COMPARISON_ALPHA11.json --check
      - name: CLI smoke
        run: |
          python -m tsao.cli doctor --root . --profile core
          python -m tsao.skillpacks --root .
          python -m tsao.cli epdm status
          python -m tsao.cli epdm audit
          python -m tsao.cli epdm reference-demo
          python -m tsao.cli epdm model-suite --temperature-k 323.15 --residence-s 300
          python -m tsao.cli poe status --root .
          python -m tsao.cli poe audit-p0 --root .
          python -m tsao.cli poe audit-p1 --root .
          python -m tsao.cli poe reference-demo
      - name: Upload matrix evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: epdm-a0-${{ matrix.os }}-py${{ matrix.python-version }}-${{ github.run_id }}
          path: |
            reports/runtime/CI_RESULTS.json
            reports/runtime/PERFORMANCE_RESULTS_V2.json
            reports/runtime/PERFORMANCE_COMPARISON_V2.json
            wheelhouse/*.whl
          if-no-files-found: warn
          retention-days: 30

  finalize:
    needs: qualification
    if: ${{ needs.qualification.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --quiet -e .[dev]
      - name: Write permanent qualification evidence and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/epdm-a0-qualification-once.yml
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          collected = subprocess.run(
              [
                  sys.executable,
                  '-m',
                  'pytest',
                  '--collect-only',
                  '-q',
                  'tests',
                  'skills/process-general/tests',
                  'skills/epdm/tests',
                  'skills/poe/tests',
                  'skills/polymer-general/tests',
              ],
              cwd=root,
              text=True,
              capture_output=True,
              check=True,
          )
          summary = collected.stdout + '\n' + collected.stderr
          matches = [int(value) for value in re.findall(r'(\d+) tests? collected', summary)]
          if not matches:
              raise SystemExit('could not determine collected test count')
          run_id = int(os.environ['GITHUB_RUN_ID'])
          report = {
              'schema': 'TSAO-EPDM-PHASE-A0-QUALIFICATION-1',
              'phase': 'EPDM_PHASE_A0_BASELINE_AND_SAFETY_CLOSURE',
              'status': 'PASS',
              'qualified_source_commit': os.environ['GITHUB_SHA'],
              'workflow_run_id': run_id,
              'workflow_run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}",
              'cross_platform_matrix': [
                  'ubuntu/3.11',
                  'ubuntu/3.12',
                  'ubuntu/3.13',
                  'ubuntu/3.14',
                  'windows/3.14',
                  'macos/3.14',
              ],
              'cross_platform_status': 'PASS',
              'test_count': max(matches),
              'coverage_gate': 'PASS_FAIL_UNDER_75',
              'ruff': 'PASS',
              'wheel_build': 'PASS',
              'wheel_content': 'PASS',
              'isolated_runtime': 'PASS',
              'performance_regression_gate': 'PASS',
              'cli_smoke': 'PASS',
              'v1_public_api_lock': 'PASS',
              'v1_golden_numeric_lock': 'PASS',
              'malformed_input_fail_closed': 'PASS',
              'parameter_provenance_gate': 'PASS',
              'schema_instance_validation': 'PASS',
              'evidence_reference_closure': 'PASS',
              'temporary_workflow': 'REMOVED_IN_FINAL_EVIDENCE_COMMIT',
              'qualification_boundary': 'SOFTWARE_ONLY',
              'scientific_technical_approval': 'NOT_EVALUATED',
              'engineering_design_approval': 'NOT_EVALUATED',
              'customer_qualification': 'NOT_EVALUATED',
              'industrial_performance_guarantee': 'NOT_EVALUATED',
              'next_phase': 'EPDM_PHASE_A1_SCIENTIFIC_CONTRACTS_AND_SCHEMAS',
          }
          (root / 'reports/EPDM_PHASE_A0_QUALIFICATION.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
          python -m tsao.cli doctor --root . --profile core
      - name: Commit final evidence and source identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/EPDM_PHASE_A0_QUALIFICATION.json reports/SOURCE_CORE_MANIFEST.tsv .github/workflows/epdm-a0-qualification-once.yml
          git commit -m 'chore: close EPDM Phase A0 qualification'
          git push origin HEAD:main
