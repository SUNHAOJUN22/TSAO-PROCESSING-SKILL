name: V19 source manifest repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tsao-v19-manifest-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Rebuild clean-tree manifest without this controller
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from tsao.provenance import build_manifest, iter_source_files

          root = Path('.')
          controller = '.github/workflows/v19-manifest-repair.yml'
          allowed = {relative for _, relative in iter_source_files(root) if relative != controller}
          count = build_manifest(
              root,
              Path('reports/SOURCE_CORE_MANIFEST.tsv'),
              allowed_paths=allowed,
          )
          if controller in Path('reports/SOURCE_CORE_MANIFEST.tsv').read_text(encoding='utf-8'):
              raise SystemExit('controller leaked into source manifest')
          print(f'manifest_records={count}')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/SOURCE_CORE_MANIFEST.tsv
          git diff --cached --exit-code && exit 0
          git commit -m "ci: refresh V19 source manifest"
          git push origin HEAD:main
