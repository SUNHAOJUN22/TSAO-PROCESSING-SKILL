name: Generate performance README assets once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ contains(github.event.head_commit.message, '[GENERATE-PERFORMANCE-ASSETS]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Generate and commit assets
        run: |
          python scripts/generate_performance_readme_assets.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/readme/batch-parameter-scan.svg docs/assets/readme/performance-regression-gate.svg
          git commit -m 'docs: add batch and performance-gate diagrams [skip ci]'
          git push origin HEAD:main
