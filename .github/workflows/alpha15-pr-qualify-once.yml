name: Finalize Alpha15 exact release once

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tsao-alpha15-final-release
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: alpha15-qualification
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Execute audited finalization recipe
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'PyYAML>=6.0,<7'
          python - <<'PY'
          from pathlib import Path
          import yaml

          source = Path('.github/workflows/alpha15-finalize-once.yml')
          data = yaml.safe_load(source.read_text(encoding='utf-8'))
          expected = [
              'Reconstruct qualified tree and close release metadata',
              'Requalify metadata-closed final commit',
              'Fast-forward final Alpha15 to main',
          ]
          scripts = []
          for step in data['jobs']['finalize']['steps']:
              if step.get('name') in expected:
                  scripts.append((step['name'], step['run']))
          if [name for name, _ in scripts] != expected:
              raise SystemExit(f'finalization recipe mismatch: {[name for name, _ in scripts]}')
          root = Path('/tmp/alpha15-finalization-recipes')
          root.mkdir(parents=True, exist_ok=True)
          for index, (name, script) in enumerate(scripts, start=1):
              path = root / f'{index:02d}.sh'
              path.write_text('set -euo pipefail\n' + script + '\n', encoding='utf-8')
              path.chmod(0o755)
          PY
          for recipe in /tmp/alpha15-finalization-recipes/*.sh; do
            echo "Executing $recipe"
            bash "$recipe"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: alpha15-finalization-evidence
          path: |
            ${{ runner.temp }}/alpha15-final.commit
            ${{ runner.temp }}/alpha15-final.parent
            ${{ runner.temp }}/alpha15-final.tree
            ${{ runner.temp }}/alpha15-final-doctor.json
            ${{ runner.temp }}/alpha15-final-targeted.txt
            ${{ runner.temp }}/alpha15-final-ci.json
            ${{ runner.temp }}/alpha15-final-coverage.txt
            ${{ runner.temp }}/alpha15-final-wheel-contents.json
            ${{ runner.temp }}/alpha15-final-wheel-runtime.json
            ${{ runner.temp }}/alpha15-final-source-snapshot.json
            ${{ runner.temp }}/alpha15-final-wheel.sha256
            ${{ runner.temp }}/tsao_processing_skill-0.1.0a15-py3-none-any.whl
            ${{ runner.temp }}/TSAO-PROCESSING-SKILL-source-alpha.15.zip
            ${{ runner.temp }}/TSAO-PROCESSING-SKILL-source-alpha.15.zip.sha256
            ${{ runner.temp }}/alpha15-final-status.txt
          if-no-files-found: warn
          retention-days: 30
