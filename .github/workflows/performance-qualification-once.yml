name: Qualify optimized computational paths once
# Rerun after provenance fast-path and benchmark Ruff cleanup.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  qualify:
    if: ${{ contains(github.event.head_commit.message, '[PERF-QUALIFY]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install qualification environment
        run: |
          python -m pip install --quiet -e .[dev]
          python -m pip check
          python -c "import pathlib, shutil; [shutil.rmtree(path) for path in pathlib.Path('.').glob('*.egg-info') if path.is_dir()]"
      - name: Build temporary exact source identity
        run: |
          rm .github/workflows/performance-baseline-once.yml
          rm .github/workflows/performance-qualification-once.yml
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
      - name: Full repository qualification
        run: |
          python scripts/run_ci.py
          python -m tsao.skillpacks --root .
          python skills/epdm/scripts/audit_epdm.py
          python skills/poe/scripts/audit_p0.py --root .
          python skills/poe/scripts/audit_p1.py --root .
      - name: Build and verify Wheel
        run: |
          python -m pip wheel --no-deps --no-build-isolation . -w wheelhouse
          python scripts/verify_wheel_contents.py --wheel-dir wheelhouse
          python scripts/verify_wheel_runtime.py --wheel-dir wheelhouse
      - name: Measure and compare optimized paths
        run: |
          python scripts/benchmark_performance.py --repeats 7 --output reports/PERFORMANCE_OPTIMIZED_ALPHA9.json
          python scripts/compare_performance.py \
            --baseline reports/PERFORMANCE_BASELINE_ALPHA9.json \
            --current reports/PERFORMANCE_OPTIMIZED_ALPHA9.json \
            --output reports/PERFORMANCE_COMPARISON_ALPHA9.json
      - name: Commit benchmark evidence only
        run: |
          git checkout -- .github/workflows/performance-baseline-once.yml
          git checkout -- .github/workflows/performance-qualification-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/PERFORMANCE_OPTIMIZED_ALPHA9.json reports/PERFORMANCE_COMPARISON_ALPHA9.json
          git commit -m "perf: record optimized benchmark evidence [skip ci]"
          git push origin HEAD:main
