name: Observe EPDM Phase A2 once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  observe:
    if: ${{ github.event.issue.title == '[OBSERVE-EPDM-A2]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --quiet -e .
      - name: Remove observer before inspection
        run: |
          rm -f .github/workflows/epdm-a2-observe-once.yml
          git add -A .github/workflows/epdm-a2-observe-once.yml
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
          git add reports/SOURCE_CORE_MANIFEST.tsv
          python -m tsao.cli doctor --root . --profile core
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove EPDM A2 observer'
          git push origin HEAD:main
      - name: Inspect qualification run
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, os, subprocess
          repository = os.environ['GITHUB_REPOSITORY']
          raw = subprocess.check_output(
              ['gh', 'api', f'/repos/{repository}/actions/workflows/epdm-a2-qualification-once.yml/runs?per_page=20'],
              text=True,
          )
          runs = json.loads(raw).get('workflow_runs', [])
          issue_runs = [run for run in runs if run.get('event') in {'issues', 'issue_comment'}]
          summary = {'found': bool(issue_runs), 'runs': []}
          for run in issue_runs[:5]:
              entry = {
                  'id': run.get('id'),
                  'event': run.get('event'),
                  'head_sha': run.get('head_sha'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'url': run.get('html_url'),
                  'created_at': run.get('created_at'),
                  'updated_at': run.get('updated_at'),
              }
              jobs_raw = subprocess.check_output(
                  ['gh', 'api', f"/repos/{repository}/actions/runs/{run['id']}/jobs?per_page=100"],
                  text=True,
              )
              entry['jobs'] = [
                  {
                      'id': job.get('id'),
                      'name': job.get('name'),
                      'status': job.get('status'),
                      'conclusion': job.get('conclusion'),
                  }
                  for job in json.loads(jobs_raw).get('jobs', [])
              ]
              summary['runs'].append(entry)
          body = 'EPDM A2 observer result:\n```json\n' + json.dumps(summary, ensure_ascii=False, indent=2) + '\n```'
          subprocess.run(
              ['gh', 'issue', 'comment', '--repo', repository, os.environ['ISSUE_NUMBER'], '--body', body],
              check=True,
          )
          subprocess.run(
              ['gh', 'issue', 'close', '--repo', repository, os.environ['ISSUE_NUMBER'], '--reason', 'completed'],
              check=True,
          )
          PY
