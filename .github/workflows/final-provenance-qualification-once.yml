name: Final Processing provenance qualification once

on:
  push:
    branches:
      - fix/20260831-final-provenance-ci

permissions:
  contents: write

concurrency:
  group: processing-final-provenance-qualification
  cancel-in-progress: false

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/20260831-final-provenance-ci
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install exact locked qualification stack
        run: |
          python scripts/verify_dependency_lock.py requirements.lock --pyproject pyproject.toml
          python -m pip install --quiet --require-hashes -r requirements.lock
          python -m pip install --quiet --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Repair formatting and regenerate exact source identity
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/final-provenance-qualification-once.yml
          python -m ruff check --fix tests/test_performance_work_unit_annotation.py
          python -m ruff format tests/test_performance_work_unit_annotation.py
          python scripts/build_source_asset_manifest.py \
            --root . \
            --out reports/SOURCE_CORE_MANIFEST.tsv
          python -m ruff check tests/test_performance_work_unit_annotation.py scripts/annotate_performance_work_units.py
          python -m ruff format --check tests/test_performance_work_unit_annotation.py scripts/annotate_performance_work_units.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_performance_work_unit_annotation.py \
            tests/test_doctor_alpha5.py \
            tests/test_performance_contract.py \
            tests/test_performance_v2_numeric_parity.py
          python -m tsao.cli doctor --root . --profile core
          git diff --check

      - name: Run full repository qualification
        run: python scripts/run_ci.py

      - name: Commit only tested production changes
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD --worktree .github/workflows/final-provenance-qualification-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_performance_work_unit_annotation.py reports/SOURCE_CORE_MANIFEST.tsv
          git diff --cached --check
          git commit -m "fix(provenance): reseal performance helper source identity"
          git push origin HEAD:fix/20260831-final-provenance-ci
