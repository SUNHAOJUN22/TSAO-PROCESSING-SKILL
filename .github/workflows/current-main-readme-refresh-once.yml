name: Current-main README refresh once

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: current-main-readme-refresh-once
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '/refresh-current-main-readme-v2')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install exact repository dependencies
        run: |
          python scripts/verify_dependency_lock.py requirements.lock --pyproject pyproject.toml
          python -m pip install --quiet --require-hashes -r requirements.lock
          python -m pip install --quiet --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Generate code-bound bilingual README assets
        run: |
          node scripts/refresh-current-main-readme.mjs --write
          node scripts/refresh-current-main-readme.mjs --check
      - name: Restore single-workflow contract and rebuild exact source identity
        run: |
          set -euo pipefail
          rm .github/workflows/current-main-readme-refresh-once.yml
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
          node scripts/refresh-current-main-readme.mjs --check
          git diff --check
      - name: Create exact-tree candidate before qualification
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            .github/workflows/current-main-readme-refresh-once.yml \
            README.md \
            README.zh-CN.md \
            docs/CURRENT_MAIN_ACCEPTANCE.md \
            docs/current-main \
            reports/SOURCE_CORE_MANIFEST.tsv
          git commit -m 'docs: publish current-main bilingual acceptance design'
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Run software, numerical and publication gates on candidate
        run: |
          set -euo pipefail
          node scripts/refresh-current-main-readme.mjs --check
          python scripts/run_ci.py
          python -m tsao.cli doctor --root . --profile core
          git diff --check
      - name: Rebase and publish qualified candidate
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Publish machine result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ job.status }}
          CHANGED: ${{ steps.candidate.outputs.changed }}
        run: |
          gh issue comment "$ISSUE" --body "CURRENT_MAIN_README_REFRESH_V2 outcome=${OUTCOME} changed=${CHANGED:-unknown} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} source=${GITHUB_SHA} controller=self_removed"
