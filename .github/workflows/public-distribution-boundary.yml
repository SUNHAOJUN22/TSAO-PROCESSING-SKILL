name: Public distribution boundary

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-distribution-boundary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controlled-registry-remains-fail-closed:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install exact dependencies and package
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Verify controlled registry blocks public artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from tsao.distribution_policy import assert_public_distribution_allowed

          for artifact_kind in ('public source distribution', 'public wheel'):
              try:
                  assert_public_distribution_allowed(Path.cwd(), artifact_kind=artifact_kind)
              except Exception as exc:
                  message = str(exc)
                  if 'CONTROLLED' not in message.upper() and 'BLOCK' not in message.upper():
                      raise SystemExit(
                          f'{artifact_kind} failed for an unrelated reason: {message}'
                      ) from exc
              else:
                  raise SystemExit(
                      f'{artifact_kind} was permitted while the registry remains controlled'
                  )
          PY

      - name: Run permanent containment regressions
        run: |
          python -m pytest -q \
            tests/test_distribution_containment_v20.py \
            tests/test_release_integrity_alpha6.py \
            tests/test_main_only_ci_policy.py

      - name: Reject accidental public build output
        shell: bash
        run: |
          set -euo pipefail
          test ! -d dist || test -z "$(find dist -type f -print -quit)"
          git diff --check
          test -z "$(git status --porcelain=v1)"
