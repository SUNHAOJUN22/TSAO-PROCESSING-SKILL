name: Install EPDM V2 full once

on:
  push:
    branches: [feature/epdm-scientific-kernel-v2]

permissions:
  contents: write

concurrency:
  group: epdm-v2-full-install
  cancel-in-progress: false

jobs:
  install:
    if: ${{ contains(github.event.head_commit.message, '[INSTALL-EPDM-V2-FULL]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/epdm-scientific-kernel-v2
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install, qualify and commit clean EPDM V2 tree
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD=.github/epdm-v2-full-payload
          WORKFLOW=.github/workflows/epdm-v2-install-once.yml
          cat "$PAYLOAD"/part-* >/tmp/epdm-v2.b64
          base64 --decode /tmp/epdm-v2.b64 >/tmp/epdm-v2.tar.gz
          echo 'c26090ae778d5db6154702af584abc8c206cb7b15aa6d4644adafa9e416e5283  /tmp/epdm-v2.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/epdm-v2.tar.gz
          rm -rf "$PAYLOAD" "$WORKFLOW"
          python - <<'PY'
          import json
          from pathlib import Path
          def rep(path, old, new):
              p=Path(path); t=p.read_text();
              if old not in t: raise SystemExit(f'missing token in {path}: {old}')
              p.write_text(t.replace(old,new,1))
          rep('pyproject.toml','version = "0.1.0a11"','version = "0.1.0a12"')
          rep('SKILL.md','version: 0.1.0-alpha.11','version: 0.1.0-alpha.12')
          rep('manifest.yaml','version: 0.1.0-alpha.11','version: 0.1.0-alpha.12')
          rep('CITATION.cff','version: 0.1.0-alpha.11','version: 0.1.0-alpha.12')
          rep('CITATION.cff','date-released: 2026-07-27','date-released: 2026-07-29')
          rep('skills/epdm/SKILL.md','version: 9.1.0-tsao.2','version: 9.2.0-tsao.3')
          p=Path('pyproject.toml'); t=p.read_text(); anchor='  "reports/ALPHA11_SOURCE_CORE_STATUS.json",\n'
          add=anchor+'  "reports/ALPHA12_SOURCE_CORE_STATUS.json",\n  "reports/EPDM_V2_IMPLEMENTATION_REPORT.json",\n  "reports/EPDM_V2_SCHEMA_VALIDATION_REPORT.json",\n  "reports/EPDM_V2_MIGRATION_BASELINE.json",\n'
          if anchor not in t: raise SystemExit('missing report anchor')
          p.write_text(t.replace(anchor,add,1))
          p=Path('reports/RELEASE_IDENTITY.json'); d=json.loads(p.read_text()); d['version']='0.1.0-alpha.12'; d['source_core']['status']='reports/ALPHA12_SOURCE_CORE_STATUS.json'; p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          python -m pip install --quiet -e '.[dev]'
          python -m pip check
          python -m compileall -q skills/epdm
          python -m ruff check skills/epdm scripts/audit_epdm_v2.py
          python -m coverage erase
          python -m coverage run --branch -m pytest -q skills/epdm/tests/test_epdm_v2_*.py
          mkdir -p reports/runtime
          python -m coverage json -o reports/runtime/EPDM_V2_ALPHA12_COVERAGE.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=json.loads(Path('reports/runtime/EPDM_V2_ALPHA12_COVERAGE.json').read_text())
          critical={'contracts','state','reaction_network','qualification_v2','migration'}
          for name in ['api_v2','calibration','contracts','design_spec','dynamics','enums','gpc','integrators','migration','moments','qualification_v2','reaction_network','reactors','sensitivity','state','thermodynamics','units']:
              s=r['files'][f'skills/epdm/{name}.py']['summary']; sp=float(s['percent_covered']); bp=100.0 if not s['num_branches'] else 100*s['covered_branches']/s['num_branches']
              assert sp >= (100 if name in critical else 95),(name,sp); assert bp>=90,(name,bp)
          spec=Path('skills/epdm/docs/TSAO_EPDM_SCIENTIFIC_KERNEL_V2_DESIGN_SPEC.md')
          assert hashlib.sha256(spec.read_bytes()).hexdigest()=='901c5b222ff88f0e80cfbb132b5cc08ed14be5be34d891e459153946ce2bf18e'
          PY
          python skills/epdm/scripts/audit_epdm_v2.py skills/epdm/fixtures/v2_reference_project.json
          python - <<'PY'
          import json
          from pathlib import Path
          from tsao.provenance import canonical_identity
          b=json.loads(Path('reports/EPDM_V2_MIGRATION_BASELINE.json').read_text())
          for p,e in b['v1_numerical_files'].items():
              a,_=canonical_identity(Path(p)); assert a==e,(p,e,a)
          PY
          rm -rf build dist wheelhouse ./*.egg-info
          find reports/runtime -maxdepth 1 -type f ! -name README.md -delete || true
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
          python scripts/run_ci.py
          python -m pip wheel --no-deps --no-build-isolation . -w wheelhouse
          python scripts/verify_wheel_contents.py --wheel-dir wheelhouse
          python scripts/verify_wheel_runtime.py --wheel-dir wheelhouse
          python - <<'PY'
          import json,os
          from pathlib import Path
          for n in ['EPDM_V2_IMPLEMENTATION_REPORT.json','EPDM_V2_SCHEMA_VALIDATION_REPORT.json','EPDM_V2_MIGRATION_BASELINE.json']:
              p=Path('reports')/n; d=json.loads(p.read_text()); d['status']='PASS'; d['full_repository_ci']='PASS'; d['wheel_content_and_runtime']='PASS'; d['qualified_source_commit']=os.environ['GITHUB_SHA']; p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          p=Path('reports/ALPHA12_SOURCE_CORE_STATUS.json'); d=json.loads(p.read_text()); d.update({'status':'SOFTWARE_QUALIFIED_REFERENCE_KERNEL','full_repository_ci':'PASS','wheel_content':'PASS','wheel_runtime':'PASS','qualification_boundary':'SOFTWARE_REFERENCE_KERNEL_ONLY'}); p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          rm -rf build dist wheelhouse ./*.egg-info
          find reports/runtime -maxdepth 1 -type f ! -name README.md -delete || true
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
          python scripts/run_ci.py
          git diff --check
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l)" -eq 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(epdm): implement Scientific Kernel V2 reference platform'
          git push origin HEAD:feature/epdm-scientific-kernel-v2
