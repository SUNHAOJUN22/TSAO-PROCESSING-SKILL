name: Finalize main AI visual upgrade once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-main-ai-upgrade-once.yml
      - .github/upgrade/**
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: tsao-finalize-main-ai-visual-upgrade
  cancel-in-progress: false

jobs:
  finalize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements.lock
      - name: Reconstruct verified candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"
          sha256sum -c .github/upgrade/PARTS.sha256
          cat .github/upgrade/parts/part-* > "$RUNNER_TEMP/upgrade.patch.gz.b64"
          echo "7d0e8b075335e83fef0cc34bc0488e59b7ee156859b12c7881e06b99a2c459a7  $RUNNER_TEMP/upgrade.patch.gz.b64" | sha256sum -c --strict
          base64 --decode "$RUNNER_TEMP/upgrade.patch.gz.b64" > "$RUNNER_TEMP/upgrade.patch.gz"
          echo "0b9dccabf19ca2ff1a549f15fccaa5d9507707b959613b6f0232fba638d205a4  $RUNNER_TEMP/upgrade.patch.gz" | sha256sum -c --strict
          gzip -dc "$RUNNER_TEMP/upgrade.patch.gz" > "$RUNNER_TEMP/upgrade.patch"
          echo "aa1096d84f30ad1f5d22748cf6b7d4e1ea3a915467e746b452cc8b76479ed3ae  $RUNNER_TEMP/upgrade.patch" | sha256sum -c --strict
          git apply --check "$RUNNER_TEMP/upgrade.patch"
          git apply "$RUNNER_TEMP/upgrade.patch"
          rm -f .github/workflows/main-repair-once.yml
          rm -f .github/workflows/main-repair-finalize-once.yml
          rm -f .github/workflows/finalize-main-ai-upgrade-once.yml
          rm -rf .github/upgrade
          git diff --check
          git add -A
          git diff --cached --check
      - name: Install candidate
        run: |
          python -m pip install --quiet -e .[dev]
          python -m pip check
      - name: Qualify source, visuals and Wheel
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/main-ai-upgrade-evidence"
          mkdir -p "$evidence"
          python scripts/generate_readme_assets.py
          python scripts/generate_extended_readme_assets.py
          python scripts/generate_decision_readme_assets.py
          python scripts/generate_performance_readme_assets.py
          python scripts/generate_uiux_readme_assets.py
          python scripts/harden_readme_svg_accessibility.py | tee "$evidence/svg-hardening.json"
          python scripts/verify_readme_visual_accessibility.py | tee "$evidence/svg-accessibility.json"
          python scripts/sync_readme_visuals.py --check
          test "$(find docs/assets/readme -maxdepth 1 -name '*.svg' | wc -l)" -eq 29
          python scripts/run_ci.py | tee "$evidence/run-ci.log"
          python -m tsao.skillpacks --root . | tee "$evidence/skillpacks.json"
          python -m tsao.cli doctor --root . --profile core | tee "$evidence/doctor.json"
          rm -rf wheelhouse build dist
          find . -maxdepth 1 -type d -name '*.egg-info' -exec rm -rf {} +
          python -m pip wheel --quiet --no-deps --no-build-isolation . -w wheelhouse
          python scripts/verify_wheel_contents.py --wheel-dir wheelhouse | tee "$evidence/wheel-contents.json"
          python scripts/verify_wheel_runtime.py --wheel-dir wheelhouse | tee "$evidence/wheel-runtime.json"
          cp wheelhouse/*.whl "$evidence/"
          python scripts/export_source_snapshot.py --root . --out "$evidence/TSAO-PROCESSING-SKILL-source-main-ai-upgrade.zip" | tee "$evidence/source-snapshot.json"
      - name: Publish exact qualified tree
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/main-ai-upgrade-evidence"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"
          rm -rf wheelhouse build dist .pytest_cache htmlcov .mypy_cache .ruff_cache
          find . -maxdepth 1 -type d -name '*.egg-info' -exec rm -rf {} +
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          rm -f .coverage coverage.xml reports/runtime/*.json reports/runtime/*.tmp
          python -m tsao.cli doctor --root . --profile core > "$evidence/final-doctor.json"
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' -printf '%f\n')" = ci.yml
          test ! -e .github/upgrade
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: harden main CI and expand AI visual system'
          final_sha="$(git rev-parse HEAD)"
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$final_sha" | tee "$evidence/final-commit.txt"
          git push origin HEAD:main
          test "$(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' | sort)" = main
      - name: Dispatch and await permanent CI
        shell: bash
        run: |
          set -euo pipefail
          final_sha="${{ steps.publish.outputs.final_sha }}"
          gh workflow run ci.yml --ref main
          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(gh run list --workflow ci.yml --branch main --event workflow_dispatch --limit 30 --json databaseId,headSha --jq ".[] | select(.headSha == \"$final_sha\") | .databaseId" | head -n 1)"
            test -n "$run_id" && break
            sleep 5
          done
          test -n "$run_id"
          printf '%s\n' "$run_id" | tee "$RUNNER_TEMP/main-ai-upgrade-evidence/permanent-ci-run.txt"
          gh run watch "$run_id" --exit-status
          gh issue comment 68 --repo "$GITHUB_REPOSITORY" --body "Main-only AI visual upgrade completed in commit \`$final_sha\`. Permanent CI run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id passed. The repository retains only the \`main\` branch and the permanent \`ci.yml\` workflow."
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-ai-upgrade-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/main-ai-upgrade-evidence/**
          if-no-files-found: warn
          retention-days: 30

  notify-failure:
    needs: finalize
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report fail-closed result
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh issue comment 68 --repo "$GITHUB_REPOSITORY"
          --body "Main-only AI visual upgrade did not complete in run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. No success claim was recorded; inspect the failed Gate before retrying."
