name: Remediate alpha11 semibatch single-step overhead once

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tsao-alpha11-semibatch-remediation
  cancel-in-progress: true

jobs:
  remediate:
    if: ${{ contains(github.event.head_commit.message, '[FIX-ALPHA11-SEMIBATCH]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Record observable remediation run
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > reports/ALPHA11_SEMIBATCH_REMEDIATION_HEARTBEAT.json <<JSON
          {
            "schema": "TSAO-ALPHA11-SEMIBATCH-REMEDIATION-HEARTBEAT-1",
            "workflow_run_id": ${GITHUB_RUN_ID},
            "workflow_run_attempt": ${GITHUB_RUN_ATTEMPT},
            "source_commit": "${GITHUB_SHA}",
            "status": "RUNNING"
          }
          JSON
          git add reports/ALPHA11_SEMIBATCH_REMEDIATION_HEARTBEAT.json
          git commit -m 'chore: record semibatch remediation heartbeat [skip ci]'
          git push origin HEAD:main
      - name: Remove single-step operating dataclass overhead
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('skills/epdm/process.py')
          text = path.read_text(encoding='utf-8')
          old_class = '''@dataclass(frozen=True)
          class _SemibatchOperatingInputs:
              active_site_mol_L: float
              poison_mol_L: float
              step_s: float
              reaction_enthalpy_kJ_mol: float
              heat_removal_kW: float
          '''
          new_alias = '''_SemibatchOperatingInputs = tuple[float, float, float, float, float]
          '''
          old_class = old_class.replace('          ', '')
          new_alias = new_alias.replace('          ', '')
          if new_alias not in text:
              if text.count(old_class) != 1:
                  raise SystemExit('operating dataclass anchor changed')
              text = text.replace(old_class, new_alias, 1)
          old_return = '    return _SemibatchOperatingInputs(*values)\n'
          new_return = '    return values\n'
          if new_return not in text:
              if text.count(old_return) != 1:
                  raise SystemExit('validated operating return anchor changed')
              text = text.replace(old_return, new_return, 1)
          old_duration = '    duration = operating.step_s\n'
          new_duration = (
              '    active_site, poison, duration, reaction_enthalpy, heat_removal = operating\n'
          )
          if new_duration not in text:
              if text.count(old_duration) != 1:
                  raise SystemExit('kernel operating unpack anchor changed')
              text = text.replace(old_duration, new_duration, 1)
          replacements = {
              'operating.active_site_mol_L': 'active_site',
              'operating.poison_mol_L': 'poison',
              'operating.reaction_enthalpy_kJ_mol': 'reaction_enthalpy',
              'operating.heat_removal_kW': 'heat_removal',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          if 'operating.' in text:
              raise SystemExit('unconverted operating attribute access remains')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify numerical identity and microbenchmark margin
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet -e '.[dev]'
          python -m pytest -q \
            tests/test_performance_contract.py::test_epdm_semibatch_preserves_baseline_result_without_state_revalidation \
            tests/test_performance_v2_numeric_parity.py
          python - <<'PY'
          import hashlib
          import json
          import os
          import statistics
          import timeit
          from pathlib import Path

          from scripts.benchmark_performance import _epdm_semibatch_step_case

          expected = 'aec440641c2b9c2de5572e7df51e9258d6f30344e22dde0c63ef5a020ca142f7'
          result = _epdm_semibatch_step_case()
          payload = json.dumps(result, sort_keys=True, separators=(',', ':'), default=str)
          digest = hashlib.sha256(payload.encode('utf-8')).hexdigest()
          if digest != expected:
              raise SystemExit(f'semibatch digest changed: {digest}')

          number = 1_000
          samples = [
              value / number
              for value in timeit.repeat(_epdm_semibatch_step_case, number=number, repeat=9)
          ]
          median = statistics.median(samples)
          baseline = 1.324074799998698e-05
          minimum_ratio = 0.90
          ratio = baseline / median
          evidence = {
              'schema': 'TSAO-ALPHA11-SEMIBATCH-MICROBENCHMARK-1',
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'python': os.sys.version,
              'number_per_repeat': number,
              'repeats': len(samples),
              'samples_s_per_call': samples,
              'median_s_per_call': median,
              'baseline_s_per_call': baseline,
              'performance_ratio': ratio,
              'minimum_ratio': minimum_ratio,
              'result_sha256': digest,
              'pass': ratio >= minimum_ratio,
          }
          Path('/tmp/semibatch-remediation-evidence.json').write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(evidence, indent=2))
          if ratio < minimum_ratio:
              raise SystemExit(
                  f'semibatch performance ratio {ratio:.3f}x is below {minimum_ratio:.3f}x'
              )
          PY
      - name: Commit verified semibatch optimization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f reports/ALPHA11_SEMIBATCH_REMEDIATION_HEARTBEAT.json
          git add skills/epdm/process.py reports/ALPHA11_SEMIBATCH_REMEDIATION_HEARTBEAT.json
          git diff --cached --check
          git commit -m 'perf(epdm): remove single-step operating object overhead [skip ci]'
          git push origin HEAD:main
      - name: Record remediation failure
        if: failure()
        shell: bash
        run: |
          set +e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          rm -f reports/ALPHA11_SEMIBATCH_REMEDIATION_HEARTBEAT.json
          if [[ -f /tmp/semibatch-remediation-evidence.json ]]; then
            cp /tmp/semibatch-remediation-evidence.json reports/ALPHA11_SEMIBATCH_REMEDIATION_FAILURE.json
          else
            cat > reports/ALPHA11_SEMIBATCH_REMEDIATION_FAILURE.json <<JSON
          {
            "schema": "TSAO-ALPHA11-SEMIBATCH-REMEDIATION-FAILURE-1",
            "workflow_run_id": ${GITHUB_RUN_ID},
            "workflow_run_attempt": ${GITHUB_RUN_ATTEMPT},
            "status": "FAIL_BEFORE_MICROBENCHMARK_EVIDENCE"
          }
          JSON
          fi
          git add reports/ALPHA11_SEMIBATCH_REMEDIATION_HEARTBEAT.json reports/ALPHA11_SEMIBATCH_REMEDIATION_FAILURE.json
          git commit -m 'diagnostic: capture semibatch remediation failure [skip ci]'
          git push origin HEAD:main
