name: Finalize main AI repair once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/main-repair-finalize-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tsao-main-ai-repair-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements.lock
      - name: Reconstruct and apply verified upgrade
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          git merge-base --is-ancestor 925b54f2b454dd6a35595987820c9d65c672b0dc HEAD
          payload=.github/upgrade/tsao-main-ai-upgrade.patch.gz.b64
          test -f "$payload"
          patch_gz="${RUNNER_TEMP}/tsao-main-ai-upgrade.patch.gz"
          patch="${RUNNER_TEMP}/tsao-main-ai-upgrade.patch"
          base64 --decode "$payload" > "$patch_gz"
          echo "e02b4a13b5e3508391f2572fb7423ae2a8c562fe504df7f07bcfacd9ece0b095  $patch_gz" | sha256sum --check --strict
          gzip --decompress --stdout "$patch_gz" > "$patch"
          echo "2dc54b7b674d0d1e061302d2e25e60ac1b8b60f9ac283cdb3451bcd757cef3b5  $patch" | sha256sum --check --strict
          git apply --check "$patch"
          git apply "$patch"
          rm -f .github/workflows/main-repair-once.yml
          rm -f .github/workflows/main-repair-finalize-once.yml
          rm -rf .github/upgrade
          git diff --check
      - name: Install qualification environment
        run: |
          python -m pip install --quiet -e .[dev]
          python -m pip check
      - name: Verify deterministic visual system
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/main-ai-repair-evidence"
          mkdir -p "$evidence"
          python scripts/generate_readme_assets.py
          python scripts/generate_extended_readme_assets.py
          python scripts/generate_decision_readme_assets.py
          python scripts/generate_performance_readme_assets.py
          python scripts/generate_uiux_readme_assets.py
          python scripts/harden_readme_svg_accessibility.py | tee "$evidence/svg-hardening.json"
          python scripts/verify_readme_visual_accessibility.py | tee "$evidence/svg-accessibility.json"
          python scripts/sync_readme_visuals.py --check
          find docs/assets/readme -maxdepth 1 -name '*.svg' -print0 | sort -z | xargs -0 sha256sum > "$evidence/svg-before.sha256"
          python scripts/generate_readme_assets.py
          python scripts/generate_extended_readme_assets.py
          python scripts/generate_decision_readme_assets.py
          python scripts/generate_performance_readme_assets.py
          python scripts/generate_uiux_readme_assets.py
          python scripts/harden_readme_svg_accessibility.py --check
          find docs/assets/readme -maxdepth 1 -name '*.svg' -print0 | sort -z | xargs -0 sha256sum > "$evidence/svg-after.sha256"
          diff -u "$evidence/svg-before.sha256" "$evidence/svg-after.sha256"
          test "$(find docs/assets/readme -maxdepth 1 -name '*.svg' | wc -l)" -eq 25
      - name: Run complete software qualification
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/main-ai-repair-evidence"
          python scripts/run_ci.py | tee "$evidence/run-ci.log"
          python skills/epdm/scripts/audit_epdm.py | tee "$evidence/epdm-audit.json"
          python skills/poe/scripts/audit_p0.py --root . | tee "$evidence/poe-p0-audit.json"
          python skills/poe/scripts/audit_p1.py --root . | tee "$evidence/poe-p1-audit.json"
          python -m tsao.cli doctor --root . --profile core | tee "$evidence/doctor.json"
          python -m tsao.skillpacks --root . | tee "$evidence/skillpacks.json"
      - name: Build and verify release wheel
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/main-ai-repair-evidence"
          rm -rf wheelhouse build dist
          find . -maxdepth 1 -type d -name '*.egg-info' -exec rm -rf {} +
          python -m pip wheel --quiet --no-deps --no-build-isolation . -w wheelhouse
          python scripts/verify_wheel_contents.py --wheel-dir wheelhouse | tee "$evidence/wheel-contents.json"
          python scripts/verify_wheel_runtime.py --wheel-dir wheelhouse | tee "$evidence/wheel-runtime.json"
          cp wheelhouse/*.whl "$evidence/"
      - name: Run explicit performance baseline gate
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/main-ai-repair-evidence"
          baseline_commit=8719e59140202aae53cdfb80239b80dedad6767a
          baseline_root="${RUNNER_TEMP}/alpha14-performance-baseline"
          baseline_report="${RUNNER_TEMP}/PERFORMANCE_BASELINE_ALPHA14_SAME_RUN.json"
          cleanup() { git worktree remove --force "$baseline_root" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          git cat-file -e "${baseline_commit}^{commit}"
          git merge-base --is-ancestor "$baseline_commit" HEAD
          git worktree add --detach "$baseline_root" "$baseline_commit"
          (
            cd "$baseline_root"
            rm -rf wheelhouse build dist *.egg-info
            python -m pip wheel --quiet --no-deps --no-build-isolation . -w wheelhouse
            python scripts/benchmark_performance_v2.py --repeats 7 --wheel-dir wheelhouse --output "$baseline_report"
          )
          python scripts/benchmark_performance_v2.py --repeats 7 --wheel-dir wheelhouse --output reports/runtime/PERFORMANCE_RESULTS_V2.json
          BASELINE_ROOT="$baseline_root" BASELINE_REPORT="$baseline_report" python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          baseline_root = Path(os.environ["BASELINE_ROOT"])
          baseline_report = Path(os.environ["BASELINE_REPORT"])
          current_report = root / "reports/runtime/PERFORMANCE_RESULTS_V2.json"

          def schema_units(worktree: Path) -> float:
              code = (
                  "from pathlib import Path; "
                  "from tsao.doctor import diagnose; "
                  "print(diagnose(Path('.'), profile='core')['metrics']['schemas'])"
              )
              output = subprocess.check_output([sys.executable, "-c", code], cwd=worktree, text=True)
              return float(output.strip().splitlines()[-1])

          for path, worktree in ((baseline_report, baseline_root), (current_report, root)):
              report = json.loads(path.read_text(encoding="utf-8"))
              doctor = next(row for row in report["benchmarks"] if row["name"] == "doctor_core_repository")
              doctor["work_units"] = schema_units(worktree)
              doctor["work_unit"] = "schema_count"
              path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          python scripts/compare_performance_v2.py --baseline "$baseline_report" --current reports/runtime/PERFORMANCE_RESULTS_V2.json --output reports/runtime/PERFORMANCE_COMPARISON_V2.json
          python scripts/update_performance_readme.py --comparison reports/PERFORMANCE_COMPARISON_ALPHA11.json --check
          cp "$baseline_report" "$evidence/PERFORMANCE_BASELINE_ALPHA14_SAME_RUN.json"
          cp reports/runtime/PERFORMANCE_RESULTS_V2.json "$evidence/"
          cp reports/runtime/PERFORMANCE_COMPARISON_V2.json "$evidence/"
          cleanup
          trap - EXIT
      - name: Build self-validating source snapshot
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/main-ai-repair-evidence"
          python scripts/export_source_snapshot.py --root . --out "$evidence/TSAO-PROCESSING-SKILL-source-main-ai-repair.zip" | tee "$evidence/source-snapshot.json"
      - name: Commit qualified main-only tree
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/main-ai-repair-evidence"
          remote_head="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          rm -rf wheelhouse build dist .pytest_cache htmlcov .mypy_cache .ruff_cache
          find . -maxdepth 1 -type d -name '*.egg-info' -exec rm -rf {} +
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          rm -f .coverage coverage.xml
          rm -f reports/runtime/*.json reports/runtime/*.tmp
          python -m tsao.cli doctor --root . --profile core > "$evidence/final-doctor.json"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          python - <<'PY'
          import subprocess

          expected = {
              ".github/upgrade/tsao-main-ai-upgrade.patch.gz.b64",
              ".github/workflows/ci.yml",
              ".github/workflows/main-repair-finalize-once.yml",
              ".github/workflows/main-repair-once.yml",
              "README.md",
              "README.zh-CN.md",
              "docs/README_VISUAL_SYSTEM.md",
              "docs/assets/readme/agentic-qualification-orchestrator.svg",
              "docs/assets/readme/ai-scientific-reasoning-loop.svg",
              "docs/assets/readme/multiscale-digital-thread.svg",
              "docs/assets/readme/uncertainty-decision-landscape.svg",
              "reports/SOURCE_CORE_OVERLAY.tsv",
              "scripts/generate_uiux_readme_assets.py",
              "scripts/sync_readme_visuals.py",
              "scripts/verify_wheel_contents.py",
              "tests/test_ci_performance_policy.py",
              "tests/test_readme_assets.py",
              "tests/test_readme_visual_accessibility.py",
              "tests/test_release_convergence.py",
              "tests/test_skillpack_delivery.py",
              "tsao/skillpacks.py",
          }
          actual = set(subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f"qualified path set mismatch: missing={sorted(expected-actual)} unexpected={sorted(actual-expected)}")
          print(f"qualified_path_count={len(actual)}")
          PY
          git diff --cached --check
          git commit -m "fix: harden main CI and expand AI visual system"
          final_sha="$(git rev-parse HEAD)"
          echo "$final_sha" > "$evidence/final-commit.txt"
          git push origin HEAD:main
          branches="$(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' | sort)"
          test "$branches" = "main"
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-ai-repair-evidence
          path: ${{ runner.temp }}/main-ai-repair-evidence/**
          if-no-files-found: warn
          retention-days: 30
