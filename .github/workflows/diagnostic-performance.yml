name: Diagnostic performance gate

on:
  push:
    branches: [diagnostic/20260831-performance-gate]
  workflow_dispatch:

permissions:
  contents: read

env:
  PERFORMANCE_BASELINE_COMMIT: "8719e59140202aae53cdfb80239b80dedad6767a"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install exact locked environment
        run: |
          python scripts/verify_dependency_lock.py requirements.lock --pyproject pyproject.toml
          python -m pip install --quiet --require-hashes -r requirements.lock
          python -m pip install --quiet --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Capture every performance-gate stage
        shell: bash
        run: |
          set -u
          mkdir -p reports/runtime
          baseline_root="$RUNNER_TEMP/alpha14-performance-baseline"
          baseline_report="$RUNNER_TEMP/PERFORMANCE_BASELINE_ALPHA14_SAME_RUN.json"
          baseline_commit="${PERFORMANCE_BASELINE_COMMIT}"
          diagnostic=reports/runtime/PERFORMANCE_GATE_DIAGNOSTIC.txt
          : > "$diagnostic"
          echo "head=$GITHUB_SHA" >> "$diagnostic"
          echo "baseline_commit=$baseline_commit" >> "$diagnostic"
          git cat-file -e "${baseline_commit}^{commit}" >> "$diagnostic" 2>&1
          echo "cat_file_rc=$?" >> "$diagnostic"
          git merge-base --is-ancestor "$baseline_commit" HEAD >> "$diagnostic" 2>&1
          echo "ancestor_rc=$?" >> "$diagnostic"
          git worktree add --detach "$baseline_root" "$baseline_commit" >> "$diagnostic" 2>&1
          echo "worktree_add_rc=$?" >> "$diagnostic"

          set +e
          (
            cd "$baseline_root" || exit 90
            rm -rf wheelhouse build dist *.egg-info
            python scripts/benchmark_performance_v2.py --repeats 7 --output "$baseline_report"
          ) > reports/runtime/BASELINE_BENCHMARK_STDOUT.txt 2>&1
          baseline_rc=$?
          echo "baseline_benchmark_rc=$baseline_rc" >> "$diagnostic"

          python scripts/benchmark_performance_v2.py \
            --repeats 7 \
            --output reports/runtime/PERFORMANCE_RESULTS_V2.json \
            > reports/runtime/CURRENT_BENCHMARK_STDOUT.txt 2>&1
          current_rc=$?
          echo "current_benchmark_rc=$current_rc" >> "$diagnostic"

          if [[ -f "$baseline_report" ]]; then
            cp "$baseline_report" reports/runtime/PERFORMANCE_BASELINE_ALPHA14_RAW.json
          fi

          BASELINE_ROOT="$baseline_root" BASELINE_REPORT="$baseline_report" python - <<'PY' \
            > reports/runtime/WORK_UNIT_ENRICHMENT_STDOUT.txt 2>&1
          import json
          import os
          import subprocess
          import sys
          import traceback
          from pathlib import Path

          root = Path.cwd()
          baseline_root = Path(os.environ["BASELINE_ROOT"])
          baseline_report = Path(os.environ["BASELINE_REPORT"])
          current_report = root / "reports/runtime/PERFORMANCE_RESULTS_V2.json"
          diagnostic_path = root / "reports/runtime/WORK_UNIT_ENRICHMENT.json"
          diagnostic: dict[str, object] = {
              "baseline_root": str(baseline_root),
              "baseline_report_exists": baseline_report.is_file(),
              "current_report_exists": current_report.is_file(),
              "results": [],
              "errors": [],
          }

          def schema_units(worktree: Path) -> float:
              code = (
                  "from pathlib import Path; "
                  "from tsao.doctor import diagnose; "
                  "print(diagnose(Path('.'), profile='core')['metrics']['schemas'])"
              )
              completed = subprocess.run(
                  [sys.executable, "-c", code],
                  cwd=worktree,
                  text=True,
                  capture_output=True,
                  check=False,
              )
              record = {
                  "worktree": str(worktree),
                  "returncode": completed.returncode,
                  "stdout": completed.stdout,
                  "stderr": completed.stderr,
              }
              cast_results = diagnostic["results"]
              assert isinstance(cast_results, list)
              cast_results.append(record)
              if completed.returncode != 0:
                  raise RuntimeError(f"schema-unit command failed for {worktree}")
              return float(completed.stdout.strip().splitlines()[-1])

          exit_code = 0
          try:
              for path, worktree in ((baseline_report, baseline_root), (current_report, root)):
                  report = json.loads(path.read_text(encoding="utf-8"))
                  doctor = next(
                      row for row in report["benchmarks"] if row["name"] == "doctor_core_repository"
                  )
                  doctor["work_units"] = schema_units(worktree)
                  doctor["work_unit"] = "schema_count"
                  path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          except Exception as exc:
              cast_errors = diagnostic["errors"]
              assert isinstance(cast_errors, list)
              cast_errors.append({
                  "type": type(exc).__name__,
                  "message": str(exc),
                  "traceback": traceback.format_exc(),
              })
              exit_code = 1
          diagnostic_path.write_text(json.dumps(diagnostic, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          raise SystemExit(exit_code)
          PY
          enrichment_rc=$?
          echo "work_unit_enrichment_rc=$enrichment_rc" >> "$diagnostic"

          if [[ -f "$baseline_report" ]]; then
            cp "$baseline_report" reports/runtime/PERFORMANCE_BASELINE_ALPHA14_SAME_RUN.json
          fi

          python scripts/compare_performance_v2.py \
            --baseline "$baseline_report" \
            --current reports/runtime/PERFORMANCE_RESULTS_V2.json \
            --output reports/runtime/PERFORMANCE_COMPARISON_V2.json \
            > reports/runtime/QUALIFICATION_COMPARE_STDOUT.txt 2>&1
          qualification_compare_rc=$?
          echo "qualification_compare_rc=$qualification_compare_rc" >> "$diagnostic"

          python scripts/compare_performance_v2.py \
            --baseline reports/PERFORMANCE_BASELINE_ALPHA10_EXTENDED.json \
            --current reports/runtime/PERFORMANCE_RESULTS_V2.json \
            --output reports/runtime/PERFORMANCE_COMPARISON_ALPHA10_HISTORICAL.json \
            > reports/runtime/HISTORICAL_COMPARE_STDOUT.txt 2>&1
          historical_compare_rc=$?
          echo "historical_compare_rc=$historical_compare_rc" >> "$diagnostic"

          python scripts/update_performance_readme.py \
            --comparison reports/PERFORMANCE_COMPARISON_ALPHA11.json \
            --check \
            > reports/runtime/README_CHECK_STDOUT.txt 2>&1
          readme_check_rc=$?
          echo "readme_check_rc=$readme_check_rc" >> "$diagnostic"

          git worktree remove --force "$baseline_root" >> "$diagnostic" 2>&1
          echo "worktree_remove_rc=$?" >> "$diagnostic"
          exit 0
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: processing-performance-gate-diagnostic-${{ github.sha }}
          path: reports/runtime/
          if-no-files-found: error
          retention-days: 3
