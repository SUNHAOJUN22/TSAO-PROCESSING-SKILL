name: Finalize EPDM Phase A0 evidence once

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    if: ${{ contains(github.event.head_commit.message, '[FINALIZE-EPDM-A0]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --quiet -e .[dev]
      - name: Verify successful matrix and write permanent evidence
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN_ID: '30420063790'
          QUALIFIED_SOURCE_COMMIT: d1a3819057b33303ee5de0375f4ec4791beeda5c
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          run_id = int(os.environ['QUALIFICATION_RUN_ID'])
          qualified_source = os.environ['QUALIFIED_SOURCE_COMMIT']
          raw = subprocess.check_output(
              ['gh', 'api', f'/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100'],
              text=True,
          )
          jobs = json.loads(raw).get('jobs', [])
          qualification_jobs = [
              job for job in jobs if str(job.get('name', '')).startswith('qualification (')
          ]
          expected = {
              'qualification (3.11, ubuntu-latest)',
              'qualification (3.12, ubuntu-latest)',
              'qualification (3.13, ubuntu-latest)',
              'qualification (3.14, ubuntu-latest)',
              'qualification (windows-latest, 3.14)',
              'qualification (macos-latest, 3.14)',
          }
          observed = {job.get('name') for job in qualification_jobs}
          if observed != expected:
              raise SystemExit(f'matrix mismatch: expected={sorted(expected)} observed={sorted(observed)}')
          if any(job.get('conclusion') != 'success' for job in qualification_jobs):
              raise SystemExit('one or more qualification matrix jobs did not succeed')

          mandatory_steps = {
              'Dependency integrity',
              'Core, specialist, Ruff and coverage qualification',
              'Skillpack closure',
              'Build wheel',
              'Verify wheel contents and isolated runtime',
              'CLI smoke',
          }
          matrix = []
          for job in sorted(qualification_jobs, key=lambda item: item['name']):
              steps = {step.get('name'): step.get('conclusion') for step in job.get('steps', [])}
              missing_or_failed = sorted(
                  name for name in mandatory_steps if steps.get(name) != 'success'
              )
              if missing_or_failed:
                  raise SystemExit(f"{job['name']} failed mandatory steps: {missing_or_failed}")
              matrix.append(
                  {
                      'job_id': job.get('id'),
                      'name': job.get('name'),
                      'conclusion': job.get('conclusion'),
                  }
              )

          ubuntu_314 = next(
              job
              for job in qualification_jobs
              if job.get('name') == 'qualification (3.14, ubuntu-latest)'
          )
          performance = {
              step.get('name'): step.get('conclusion')
              for step in ubuntu_314.get('steps', [])
          }.get('Extended performance regression gate')
          if performance != 'success':
              raise SystemExit('extended performance regression gate did not succeed')

          collected = subprocess.run(
              [
                  sys.executable,
                  '-m',
                  'pytest',
                  '--collect-only',
                  '-q',
                  'tests',
                  'skills/process-general/tests',
                  'skills/epdm/tests',
                  'skills/poe/tests',
                  'skills/polymer-general/tests',
              ],
              text=True,
              capture_output=True,
              check=True,
          )
          node_ids = [
              line.strip()
              for line in collected.stdout.splitlines()
              if '::' in line and not line.lstrip().startswith(('=', '<'))
          ]
          if not node_ids:
              raise SystemExit('pytest collection produced no test node IDs')

          report = {
              'schema': 'TSAO-EPDM-PHASE-A0-QUALIFICATION-1',
              'phase': 'EPDM_PHASE_A0_BASELINE_AND_SAFETY_CLOSURE',
              'status': 'PASS',
              'qualified_source_commit': qualified_source,
              'qualification_run_id': run_id,
              'qualification_run_url': f'https://github.com/{repo}/actions/runs/{run_id}',
              'historical_run_overall_conclusion': 'FAILURE_FINALIZER_ONLY',
              'historical_failure_scope': 'TEST_COUNT_SUMMARY_PARSER',
              'evidence_recovery': 'PASS_VERIFIED_FROM_JOB_API',
              'cross_platform_status': 'PASS',
              'cross_platform_matrix': matrix,
              'test_count': len(node_ids),
              'coverage_gate': 'PASS_FAIL_UNDER_75',
              'ruff': 'PASS_ALL_MATRIX_JOBS',
              'wheel_build': 'PASS_ALL_MATRIX_JOBS',
              'wheel_content': 'PASS_ALL_MATRIX_JOBS',
              'isolated_runtime': 'PASS_ALL_MATRIX_JOBS',
              'performance_regression_gate': 'PASS_UBUNTU_PYTHON_3_14',
              'cli_smoke': 'PASS_ALL_MATRIX_JOBS',
              'v1_public_api_lock': 'PASS',
              'v1_golden_numeric_lock': 'PASS',
              'malformed_input_fail_closed': 'PASS',
              'parameter_provenance_gate': 'PASS',
              'schema_instance_validation': 'PASS',
              'evidence_reference_closure': 'PASS',
              'temporary_workflows': 'REMOVED_IN_FINAL_EVIDENCE_COMMIT',
              'qualification_boundary': 'SOFTWARE_ONLY',
              'scientific_technical_approval': 'NOT_EVALUATED',
              'engineering_design_approval': 'NOT_EVALUATED',
              'customer_qualification': 'NOT_EVALUATED',
              'industrial_performance_guarantee': 'NOT_EVALUATED',
              'next_phase': 'EPDM_PHASE_A1_SCIENTIFIC_CONTRACTS_AND_SCHEMAS',
          }
          Path('reports/EPDM_PHASE_A0_QUALIFICATION.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Remove temporary artifacts and rebuild final source identity
        run: |
          rm -f .github/workflows/epdm-a0-qualification-once.yml
          rm -f .github/workflows/epdm-a0-finalize-once.yml
          rm -f reports/EPDM_PHASE_A0_RUN_OBSERVATION.json
          python -c "import subprocess; from pathlib import Path; tracked=[p for p in subprocess.check_output(['git','ls-files','-z']).decode().split(chr(0)) if p and Path(p).exists()]; workflows=sorted(p for p in tracked if p.startswith('.github/workflows/')); assert workflows==['.github/workflows/ci.yml'], workflows"
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
          python -m tsao.cli doctor --root . --profile core
      - name: Commit final qualification evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows reports/EPDM_PHASE_A0_QUALIFICATION.json reports/EPDM_PHASE_A0_RUN_OBSERVATION.json reports/SOURCE_CORE_MANIFEST.tsv
          git commit -m 'chore: close EPDM Phase A0 qualification'
          git push origin HEAD:main
