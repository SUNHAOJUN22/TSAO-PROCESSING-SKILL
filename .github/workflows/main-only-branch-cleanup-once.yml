name: Remove obsolete branches once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/main-only-branch-cleanup-once.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: tsao-main-only-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every non-main branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=(
            alpha15-issue57-final-staging
            alpha15-issue57-qualification
            alpha15-issue57-squash-base
            alpha15-qualification
            alpha15-source-snapshot
            beta1-lock-generation
            epdm-v2-scientific-kernel
            feature/epdm-scientific-kernel-v2
            pdf-translation-20260802
          )
          for branch in "${branches[@]}"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done
          remaining="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches" --jq '.[].name')"
          test "${remaining}" = "main"
          gh issue comment 68 --repo "${GITHUB_REPOSITORY}" \
            --body "Main-only branch cleanup passed in run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}; the only remaining branch is main."
