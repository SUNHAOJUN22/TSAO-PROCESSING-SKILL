name: Probe final performance thresholds once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  probe:
    if: ${{ contains(github.event.head_commit.message, '[PERF-PROBE]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - run: python -m pip install --quiet -e .
      - name: Measure current implementation
        shell: bash
        run: |
          set +e
          python scripts/benchmark_performance.py --repeats 7 --output reports/PERFORMANCE_OPTIMIZED_ALPHA9.json
          python scripts/compare_performance.py \
            --baseline reports/PERFORMANCE_BASELINE_ALPHA9.json \
            --current reports/PERFORMANCE_OPTIMIZED_ALPHA9.json \
            --output reports/PERFORMANCE_COMPARISON_ALPHA9.json
          echo "comparison_exit=$?"
      - name: Commit probe evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/PERFORMANCE_OPTIMIZED_ALPHA9.json reports/PERFORMANCE_COMPARISON_ALPHA9.json
          git commit -m "perf: record final threshold probe [skip ci]"
          git push origin HEAD:main
