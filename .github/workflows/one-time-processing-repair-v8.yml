name: One-time Processing root-cause repair v8

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  repair-and-publish:
    if: contains(github.event.head_commit.message || '', '[run-processing-repair-v8]')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install exact locked environment
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_dependency_lock.py requirements.lock --pyproject pyproject.toml
          python -m pip install --quiet --require-hashes -r requirements.lock
          python -m pip install --quiet --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Extract audited V6 scripts
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/one-time-diagnose-six-hour-matrix.yml /tmp/processing-v6.yml
          python - <<'PY'
          from pathlib import Path

          source = Path('/tmp/processing-v6.yml').read_text(encoding='utf-8').splitlines()

          def extract(step_name: str, target: str) -> None:
              marker = f'- name: {step_name}'
              index = next(i for i, line in enumerate(source) if line.strip() == marker)
              run_index = next(i for i in range(index + 1, len(source)) if source[i].strip() == 'run: |')
              run_indent = len(source[run_index]) - len(source[run_index].lstrip())
              body: list[str] = []
              for line in source[run_index + 1:]:
                  indent = len(line) - len(line.lstrip())
                  if line.strip() and indent <= run_indent:
                      break
                  body.append(line[run_indent + 2:] if len(line) >= run_indent + 2 else '')
              if not body:
                  raise SystemExit(f'empty run script for {step_name!r}')
              Path(target).write_text('\n'.join(body) + '\n', encoding='utf-8')

          extract('Apply root-cause code, regression, README and provenance fixes', '/tmp/processing-apply.sh')
          extract('Validate candidate before publication', '/tmp/processing-validate.sh')
          extract('Dispatch permanent eight-matrix qualification', '/tmp/processing-dispatch.sh')
          PY
          chmod +x /tmp/processing-apply.sh /tmp/processing-validate.sh /tmp/processing-dispatch.sh

      - name: Apply root-cause repair and validate
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/processing-apply.sh
          rm -f .github/workflows/one-time-launch-main-acceptance-v7.yml
          rm -f .github/workflows/one-time-processing-repair-v8.yml
          bash /tmp/processing-validate.sh

      - name: Publish clean repaired source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: isolate EPDM acceptance timing from memory tracing"
          git push origin HEAD:main
          echo "clean_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch permanent eight-matrix qualification
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash /tmp/processing-dispatch.sh

      - name: Record repair result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN_SHA: ${{ steps.source.outputs.clean_sha }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          RUN_URL: ${{ steps.dispatch.outputs.run_url }}
        run: |
          set -euo pipefail
          gh issue comment 68 --repo "$GITHUB_REPOSITORY" --body "PROCESSING_REPAIR_V8 status=${{ job.status }} clean_sha=${CLEAN_SHA:-UNPUBLISHED} matrix_run_id=${RUN_ID:-UNRESOLVED} matrix_url=${RUN_URL:-UNRESOLVED} next=BIND_SIX_HOUR_GATE previous_active_ns=0"
