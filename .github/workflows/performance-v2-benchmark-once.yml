name: Capture performance v2 benchmark evidence once
# Triggered once after focused paths and parity checks passed.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  benchmark:
    if: ${{ contains(github.event.head_commit.message, '[PERF-V2-BENCHMARK]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Measure all extended workloads
        shell: bash
        run: |
          set +e
          LOG=/tmp/performance-v2-benchmark.txt
          : > "$LOG"
          python -m pip install --quiet -e .[dev] >> "$LOG" 2>&1
          echo "install=$?" >> "$LOG"
          rm -rf wheelhouse build dist
          python -m pip wheel --no-deps --no-build-isolation . -w wheelhouse >> "$LOG" 2>&1
          echo "wheel=$?" >> "$LOG"
          python scripts/benchmark_performance_v2.py --repeats 5 --wheel-dir wheelhouse --output /tmp/PERFORMANCE_OPTIMIZED_ALPHA11_CANDIDATE.json >> "$LOG" 2>&1
          echo "benchmark=$?" >> "$LOG"
          python scripts/compare_performance_v2.py --baseline reports/PERFORMANCE_BASELINE_ALPHA10_EXTENDED.json --current /tmp/PERFORMANCE_OPTIMIZED_ALPHA11_CANDIDATE.json --output /tmp/PERFORMANCE_COMPARISON_ALPHA11_CANDIDATE.json >> "$LOG" 2>&1
          echo "compare=$?" >> "$LOG"
          cp "$LOG" reports/PERFORMANCE_V2_BENCHMARK_LOG.txt
          cp /tmp/PERFORMANCE_OPTIMIZED_ALPHA11_CANDIDATE.json reports/PERFORMANCE_OPTIMIZED_ALPHA11_CANDIDATE.json 2>/dev/null || true
          cp /tmp/PERFORMANCE_COMPARISON_ALPHA11_CANDIDATE.json reports/PERFORMANCE_COMPARISON_ALPHA11_CANDIDATE.json 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/PERFORMANCE_V2_BENCHMARK_LOG.txt
          test -f reports/PERFORMANCE_OPTIMIZED_ALPHA11_CANDIDATE.json && git add reports/PERFORMANCE_OPTIMIZED_ALPHA11_CANDIDATE.json
          test -f reports/PERFORMANCE_COMPARISON_ALPHA11_CANDIDATE.json && git add reports/PERFORMANCE_COMPARISON_ALPHA11_CANDIDATE.json
          git commit -m 'perf: capture performance v2 benchmark evidence [skip ci]'
          git push origin HEAD:main
