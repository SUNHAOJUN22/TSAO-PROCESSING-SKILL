name: One-time canonical overlay repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Recompute canonical acceptance-overlay identities
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_source_overlay.py \
            --target reports/SOURCE_ACCEPTANCE_OVERLAY.tsv \
            scripts/compare_performance_v2.py \
            tsao/provenance.py
          python - <<'PY'
          import csv
          from pathlib import Path
          from tsao.provenance import canonical_identity

          overlay = Path("reports/SOURCE_ACCEPTANCE_OVERLAY.tsv")
          with overlay.open(encoding="utf-8", newline="") as stream:
              rows = {row["path"]: row for row in csv.DictReader(stream, delimiter="\t")}
          for relative in ("scripts/compare_performance_v2.py", "tsao/provenance.py"):
              digest, size = canonical_identity(Path(relative))
              row = rows[relative]
              assert row["sha256"] == digest, (relative, row["sha256"], digest)
              assert int(row["bytes"]) == size, (relative, row["bytes"], size)
          PY

      - name: Self-delete and exact-parent publish
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-provenance-once.yml
          git add reports/SOURCE_ACCEPTANCE_OVERLAY.tsv
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(provenance): recompute canonical overlay"
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git push origin HEAD:main
