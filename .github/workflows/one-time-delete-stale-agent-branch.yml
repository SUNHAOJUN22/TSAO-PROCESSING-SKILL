name: One-time delete stale agent branch

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    if: >-
      github.event.issue.number == 68 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/delete-stale-agent-branch-final'
    runs-on: ubuntu-24.04
    steps:
      - name: Delete fully absorbed stale branch ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/six-hour-soak-hardening-20260809"
      - name: Record cleanup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment 68 --repo "$GITHUB_REPOSITORY" --body "FINAL_BRANCH_CLEANUP status=success deleted=agent/six-hour-soak-hardening-20260809 retained=main"
