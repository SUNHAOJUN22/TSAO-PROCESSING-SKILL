name: Diagnose performance v2 optimization once
# Triggered once for the alpha11 candidate diagnostic.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ contains(github.event.head_commit.message, '[PERF-V2-DIAG]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Run exact diagnostic chain
        shell: bash
        run: |
          set +e
          LOG=/tmp/performance-v2-diagnostic.txt
          : > "$LOG"
          step() {
            echo "" >> "$LOG"
            echo "== $1 ==" >> "$LOG"
            shift
            "$@" >> "$LOG" 2>&1
            echo "exit=$?" >> "$LOG"
          }
          step install python -m pip install --quiet -e '.[dev]'
          step pip_check python -m pip check
          python -c "import pathlib, shutil; [shutil.rmtree(path) for path in pathlib.Path('.').glob('*.egg-info') if path.is_dir()]"
          rm .github/workflows/performance-v2-baseline-once.yml
          rm .github/workflows/performance-v2-diagnostic-once.yml
          step refresh_manifest python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
          step run_ci python scripts/run_ci.py
          step targeted_tests python -m pytest -q tests/test_performance_v2_contract.py tests/test_performance_v2_reports.py
          step ruff python -m ruff check tsao scripts skills tests
          rm -rf wheelhouse build dist
          step wheel_build python -m pip wheel --no-deps --no-build-isolation . -w wheelhouse
          step wheel_contents python scripts/verify_wheel_contents.py --wheel-dir wheelhouse
          step wheel_runtime python scripts/verify_wheel_runtime.py --wheel-dir wheelhouse
          step benchmark python scripts/benchmark_performance_v2.py --repeats 5 --wheel-dir wheelhouse --output /tmp/PERFORMANCE_OPTIMIZED_ALPHA11_CANDIDATE.json
          step compare python scripts/compare_performance_v2.py --baseline reports/PERFORMANCE_BASELINE_ALPHA10_EXTENDED.json --current /tmp/PERFORMANCE_OPTIMIZED_ALPHA11_CANDIDATE.json --output /tmp/PERFORMANCE_COMPARISON_ALPHA11_CANDIDATE.json
          cp "$LOG" reports/PERFORMANCE_V2_DIAGNOSTIC.txt
          cp /tmp/PERFORMANCE_OPTIMIZED_ALPHA11_CANDIDATE.json reports/PERFORMANCE_OPTIMIZED_ALPHA11_CANDIDATE.json 2>/dev/null || true
          cp /tmp/PERFORMANCE_COMPARISON_ALPHA11_CANDIDATE.json reports/PERFORMANCE_COMPARISON_ALPHA11_CANDIDATE.json 2>/dev/null || true
          git checkout -- .github/workflows/performance-v2-baseline-once.yml
          git checkout -- .github/workflows/performance-v2-diagnostic-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/PERFORMANCE_V2_DIAGNOSTIC.txt reports/PERFORMANCE_OPTIMIZED_ALPHA11_CANDIDATE.json reports/PERFORMANCE_COMPARISON_ALPHA11_CANDIDATE.json
          git commit -m 'diagnostic: capture performance v2 results [skip ci]'
          git push origin HEAD:main
