name: Capture alpha11 v5 assembly failure once

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  capture:
    if: ${{ contains(github.event.head_commit.message, '[CAPTURE-ALPHA11-ASSEMBLY]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Capture masked log tail
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_JOB_ID: "90167092032"
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${TARGET_JOB_ID}/logs" > /tmp/job.log
          python - <<'PY'
          from pathlib import Path

          raw = Path('/tmp/job.log').read_text(encoding='utf-8', errors='replace').splitlines()
          selected = raw[-180:]
          Path('reports/ALPHA11_V5_ASSEMBLY_FAILURE_LOG.txt').write_text(
              '\n'.join(selected) + '\n',
              encoding='utf-8',
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/ALPHA11_V5_ASSEMBLY_FAILURE_LOG.txt
          git commit -m 'diagnostic: capture alpha11 v5 assembly failure [skip ci]'
          git push origin HEAD:main
