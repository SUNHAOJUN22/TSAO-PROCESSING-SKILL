name: Diagnose alpha9 finalizer once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ contains(github.event.head_commit.message, '[DIAG-ALPHA9]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Run diagnostic chain
        shell: bash
        run: |
          set +e
          mkdir -p reports
          DIAG=reports/ALPHA9_FINALIZER_DIAGNOSTIC.txt
          : > "$DIAG"
          echo "alpha9 finalizer diagnostic" >> "$DIAG"
          echo "trigger_sha=${GITHUB_SHA}" >> "$DIAG"
          echo "python=$(python --version 2>&1)" >> "$DIAG"

          echo "\n== install development environment ==" >> "$DIAG"
          python -m pip install --quiet -e .[dev] >> "$DIAG" 2>&1
          echo "exit=$?" >> "$DIAG"
          python -m pip check >> "$DIAG" 2>&1
          echo "pip_check_exit=$?" >> "$DIAG"
          python -c "import pathlib, shutil; [shutil.rmtree(path) for path in pathlib.Path('.').glob('*.egg-info') if path.is_dir()]" >> "$DIAG" 2>&1

          echo "\n== compile release scripts ==" >> "$DIAG"
          python -m py_compile .github/apply_alpha9_release.py .github/fix_alpha9_release_residuals.py >> "$DIAG" 2>&1
          echo "exit=$?" >> "$DIAG"

          echo "\n== apply alpha9 identity ==" >> "$DIAG"
          python .github/apply_alpha9_release.py >> "$DIAG" 2>&1
          echo "exit=$?" >> "$DIAG"

          echo "\n== clean residuals ==" >> "$DIAG"
          python .github/fix_alpha9_release_residuals.py >> "$DIAG" 2>&1
          echo "exit=$?" >> "$DIAG"

          echo "\n== graphics ==" >> "$DIAG"
          python scripts/generate_readme_assets.py >> "$DIAG" 2>&1
          echo "base_graphics_exit=$?" >> "$DIAG"
          python scripts/generate_extended_readme_assets.py >> "$DIAG" 2>&1
          echo "extended_graphics_exit=$?" >> "$DIAG"
          python scripts/generate_decision_readme_assets.py >> "$DIAG" 2>&1
          echo "decision_graphics_exit=$?" >> "$DIAG"
          git diff --exit-code -- docs/assets/readme >> "$DIAG" 2>&1
          echo "graphics_diff_exit=$?" >> "$DIAG"

          echo "\n== source identity ==" >> "$DIAG"
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest >> "$DIAG" 2>&1
          echo "refresh_exit=$?" >> "$DIAG"

          echo "\n== full repository qualification ==" >> "$DIAG"
          python scripts/run_ci.py >> "$DIAG" 2>&1
          echo "run_ci_exit=$?" >> "$DIAG"

          echo "\n== specialist closure ==" >> "$DIAG"
          python -m tsao.skillpacks --root . >> "$DIAG" 2>&1
          echo "skillpacks_exit=$?" >> "$DIAG"
          python skills/epdm/scripts/audit_epdm.py >> "$DIAG" 2>&1
          echo "epdm_exit=$?" >> "$DIAG"
          python skills/poe/scripts/audit_p0.py --root . >> "$DIAG" 2>&1
          echo "poe_p0_exit=$?" >> "$DIAG"
          python skills/poe/scripts/audit_p1.py --root . >> "$DIAG" 2>&1
          echo "poe_p1_exit=$?" >> "$DIAG"

          echo "\n== wheel build and contents ==" >> "$DIAG"
          rm -rf wheelhouse build dist
          python -m pip wheel --no-deps --no-build-isolation . -w wheelhouse >> "$DIAG" 2>&1
          echo "wheel_build_exit=$?" >> "$DIAG"
          python scripts/verify_wheel_contents.py --wheel-dir wheelhouse >> "$DIAG" 2>&1
          echo "wheel_contents_exit=$?" >> "$DIAG"

          echo "\n== wheel installed runtime ==" >> "$DIAG"
          python scripts/verify_wheel_runtime.py --wheel-dir wheelhouse >> "$DIAG" 2>&1
          echo "wheel_runtime_exit=$?" >> "$DIAG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIAG"
          git commit -m "diagnostic: capture alpha9 finalizer failure [skip ci]"
          git push origin HEAD:main
