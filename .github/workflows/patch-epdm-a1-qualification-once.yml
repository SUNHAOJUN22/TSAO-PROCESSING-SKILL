name: Patch EPDM Phase A1 qualification once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: ${{ github.event.issue.title == '[PATCH-EPDM-A1-QUALIFICATION]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Patch deterministic Ruff normalization and reporting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/epdm-a1-qualification-once.yml')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('    types: [opened]\n', '    types: [opened, reopened]\n'),
              (
                  "      - name: Install\n        shell: bash\n        run: |\n          python -m pip install --quiet -e '.[dev]'\n          python -m pip check\n      - name: Rebuild and verify source identity\n",
                  "      - name: Install\n        shell: bash\n        run: |\n          python -m pip install --quiet -e '.[dev]'\n          python -m pip check\n      - name: Normalize deterministic import ordering\n        shell: bash\n        run: |\n          python -m ruff check --fix --select I skills/epdm/contracts.py skills/epdm/registry.py skills/epdm/tests/test_epdm_phase_a1.py skills/epdm/validation_v2.py\n          python -m ruff check skills/epdm/contracts.py skills/epdm/registry.py skills/epdm/tests/test_epdm_phase_a1.py skills/epdm/validation_v2.py\n          git add -A\n      - name: Rebuild and verify source identity\n",
              ),
              (
                  "      - name: Install and rebuild source identity\n        run: |\n          python -m pip install --quiet -e '.[dev]'\n          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest\n",
                  "      - name: Install and rebuild source identity\n        run: |\n          python -m pip install --quiet -e '.[dev]'\n          python -m ruff check --fix --select I skills/epdm/contracts.py skills/epdm/registry.py skills/epdm/tests/test_epdm_phase_a1.py skills/epdm/validation_v2.py\n          python -m ruff check skills/epdm/contracts.py skills/epdm/registry.py skills/epdm/tests/test_epdm_phase_a1.py skills/epdm/validation_v2.py\n          git add -A\n          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest\n",
              ),
              ("              'Install',\n", "              'Install',\n              'Normalize deterministic import ordering',\n"),
              ('gh issue comment "$ISSUE_NUMBER" --body "EPDM Phase A1 qualification PASS.', 'gh issue comment --repo "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" --body "EPDM Phase A1 qualification PASS.'),
              ('gh issue comment "$ISSUE_NUMBER" --body "EPDM Phase A1 qualification FAILED.', 'gh issue comment --repo "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" --body "EPDM Phase A1 qualification FAILED.'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one replacement, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/patch-epdm-a1-qualification-once.yml
      - name: Commit patched workflow and cleanup
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows
          git diff --cached --check
          git commit -m 'fix(ci): normalize EPDM A1 Ruff imports before qualification'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Report patch result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh issue comment --repo "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" --body "EPDM Phase A1 qualification workflow patched. Commit: \`$COMMIT_SHA\`."
