name: Finalize isolated installed-runtime origins once

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tsao-finalize-isolated-install-once
  cancel-in-progress: false

jobs:
  matrix-qualification:
    if: ${{ contains(github.event.head_commit.message, '[FINALIZE-ALPHA8]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development environment
        run: |
          python -m pip install --quiet -e .[dev]
          python -m pip check
          python -c "import pathlib, shutil; [shutil.rmtree(path) for path in pathlib.Path('.').glob('*.egg-info') if path.is_dir()]"
      - name: Apply final documentation and source identity
        run: |
          python .github/apply_isolated_install_docs.py
          python -c "from pathlib import Path; Path('.github/apply_isolated_install_docs.py').unlink(); Path('.github/workflows/finalize-isolated-install-once.yml').unlink()"
          python scripts/generate_readme_assets.py
          python scripts/generate_extended_readme_assets.py
          python scripts/generate_decision_readme_assets.py
          git diff --exit-code -- docs/assets/readme
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
      - name: Full repository qualification
        run: python scripts/run_ci.py
      - name: Specialist closure
        run: |
          python -m tsao.skillpacks --root .
          python skills/epdm/scripts/audit_epdm.py
          python skills/poe/scripts/audit_p0.py --root .
          python skills/poe/scripts/audit_p1.py --root .
      - name: Verify isolated installed-runtime origins
        run: |
          python -c "import shutil; shutil.rmtree('wheelhouse', ignore_errors=True)"
          python -m pip wheel --no-deps --no-build-isolation . -w wheelhouse
          python scripts/verify_wheel_contents.py --wheel-dir wheelhouse
          python scripts/verify_wheel_runtime.py --wheel-dir wheelhouse

  seal-main:
    needs: matrix-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development environment
        run: |
          python -m pip install --quiet -e .[dev]
          python -m pip check
          python -c "import pathlib, shutil; [shutil.rmtree(path) for path in pathlib.Path('.').glob('*.egg-info') if path.is_dir()]"
      - name: Apply final documentation and seal source identity
        run: |
          python .github/apply_isolated_install_docs.py
          python -c "from pathlib import Path; Path('.github/apply_isolated_install_docs.py').unlink(); Path('.github/workflows/finalize-isolated-install-once.yml').unlink()"
          python scripts/generate_readme_assets.py
          python scripts/generate_extended_readme_assets.py
          python scripts/generate_decision_readme_assets.py
          git diff --exit-code -- docs/assets/readme
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
      - name: Re-run full qualification
        run: |
          python scripts/run_ci.py
          python -m tsao.skillpacks --root .
          python skills/epdm/scripts/audit_epdm.py
          python skills/poe/scripts/audit_p0.py --root .
          python skills/poe/scripts/audit_p1.py --root .
      - name: Rebuild and verify final Wheel
        run: |
          python -c "import shutil; shutil.rmtree('wheelhouse', ignore_errors=True)"
          python -m pip wheel --no-deps --no-build-isolation . -w wheelhouse
          python scripts/verify_wheel_contents.py --wheel-dir wheelhouse
          python scripts/verify_wheel_runtime.py --wheel-dir wheelhouse
      - name: Final command checks
        run: |
          python -m tsao.cli doctor --root . --profile core
          python -m tsao.skillpacks --root .
          python -m tsao.cli package template --family "continuous chemical process"
          python -m tsao.cli epdm model-suite --temperature-k 323.15 --residence-s 300
      - name: Commit finalized main
        run: |
          python -c "import shutil; [shutil.rmtree(path, ignore_errors=True) for path in ('wheelhouse', 'build', 'dist')]"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "final: seal isolated installed-runtime origins"
          git push origin HEAD:main
