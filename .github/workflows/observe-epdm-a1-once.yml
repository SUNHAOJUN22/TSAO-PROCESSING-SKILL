name: Observe EPDM Phase A1 once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  observe:
    if: ${{ github.event.issue.title == '[OBSERVE-EPDM-A1]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Restore repository tree immediately
        run: |
          rm -f .github/workflows/observe-epdm-a1-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows
          git commit -m 'chore: remove EPDM A1 observer workflow'
          git push origin HEAD:main
      - name: Report current qualification state
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' > /tmp/observation.md
          import json
          import os
          import subprocess

          repo = os.environ['GITHUB_REPOSITORY']
          raw = subprocess.check_output([
              'gh', 'api', f'/repos/{repo}/actions/workflows/epdm-a1-qualification-once.yml/runs?event=issues&per_page=10'
          ], text=True)
          runs = json.loads(raw).get('workflow_runs', [])
          print('EPDM Phase A1 qualification observation:')
          for run in runs[:5]:
              print(f"- run {run['id']}: status={run['status']}, conclusion={run.get('conclusion')}, head={run['head_sha']}, created={run['created_at']}, url={run['html_url']}")
              jobs_raw = subprocess.check_output(['gh', 'api', f"/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100"], text=True)
              jobs = json.loads(jobs_raw).get('jobs', [])
              for job in jobs:
                  print(f"  - {job['name']}: status={job['status']}, conclusion={job.get('conclusion')}, job_id={job['id']}")
              break
          PY
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/observation.md
