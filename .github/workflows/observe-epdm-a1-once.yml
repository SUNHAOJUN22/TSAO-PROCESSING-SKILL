name: Observe target EPDM Phase A1 run once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  observe:
    if: ${{ github.event.issue.title == '[OBSERVE-EPDM-A1-TARGET]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Restore repository tree immediately
        run: |
          rm -f .github/workflows/observe-epdm-a1-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows
          git commit -m 'chore: remove target EPDM A1 observer'
          git push origin HEAD:main
      - name: Report target run and jobs
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TARGET_SHA: ce6d404c7bec8c3d2c2d988a3177718a63f766cc
        run: |
          python - <<'PY' > /tmp/target.md
          import json
          import os
          import subprocess

          repo = os.environ['GITHUB_REPOSITORY']
          target = os.environ['TARGET_SHA']
          raw = subprocess.check_output(['gh','api',f'/repos/{repo}/actions/workflows/epdm-a1-qualification-once.yml/runs?event=issues&per_page=30'], text=True)
          runs = [run for run in json.loads(raw).get('workflow_runs', []) if run.get('head_sha') == target]
          print(f'Target head: {target}')
          if not runs:
              print('- no matching issue-event run found')
          for run in runs:
              print(f"- run {run['id']}: status={run['status']}, conclusion={run.get('conclusion')}, created={run['created_at']}, url={run['html_url']}")
              jobs_raw = subprocess.check_output(['gh','api',f"/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100"], text=True)
              for job in json.loads(jobs_raw).get('jobs', []):
                  print(f"  - {job['name']}: status={job['status']}, conclusion={job.get('conclusion')}, job_id={job['id']}")
          PY
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/target.md
