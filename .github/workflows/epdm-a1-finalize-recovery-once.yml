name: Finalize verified EPDM Phase A1 performance fix once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: tsao-epdm-phase-a1-finalize-recovery-once
  cancel-in-progress: false

env:
  PAYLOAD_SHA256: 54b5bc616755163c5632770c098aaee43739a447cb38b4524bf3f7284b9e103e
  PAYLOAD_BYTES: '38958'
  EXPECTED_TEST_COUNT: '260'
  MATERIALIZER_SHA: f8cc0c2e691332ed35b4ce9740e3074f86e914df
  QUALIFICATION_RUN_ID: '30520639664'
  QUALIFICATION_TRIGGER_COMMIT: 9fd26a49800a7d06a710a11774a4bee4b1eb6aa6
  CHUNK_SHAS: |
    09627938dcf4b1ac08fb1a83fdd671ddf67a9f88
    68a39cb9fd4005b59ce180e01a8ef498b9797925
    1c7d9729b427458ebec6a8dd2031c35817eaf524
    7bbd5edfd4e20749f54ec9cfaf4fb3530e1885d4
    60479e997ea42beb47d1038d9e8547d8dbb1929a
    ba5dcae0e69b44a71af858b1293f12d59ae47055
    8f9b86e70c663d4b77591a11920be55117250276
    4bb22d3e34c8b187be24a14645a9a562682a83d1
    e529d375456eadf997b30ee1541e5c694f464b5d
    df1f8d936e73f11847379ab27cfa69ed6a77ee63
    a20102bba335191496db8678efca46ca6214d25d
    4f958745cdf49674f851dc67c5ffb7171578f1c5
    101049ec195de1988f6ca957c7fe6790f84b97a0
    ae1b7803f9c1f8f9643a9a223052af7f5fd8b3d5
    7e2850b41d2ed34801b7b647ec481914e48cee3b
    bdccfaf7d424237b800b84ac23cdd872912e2c8f
    e5ea3fe5c8a257358587c6b4259618ea19b8654e
    7754b6eca9fc4d87c68fcd139940b47956cecb72

jobs:
  finalize:
    if: ${{ github.event.issue.title == '[FINALIZE-EPDM-A1-PERF-FIX]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Materialize exact qualified tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          sha = os.environ['MATERIALIZER_SHA']
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{sha}",
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)
          data = base64.b64decode(payload['content'])
          observed = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          if observed != sha:
              raise SystemExit(f'materializer identity mismatch: {observed}')
          destination = Path(os.environ['RUNNER_TEMP']) / 'materialize_epdm_a1_perf.py'
          destination.write_bytes(data)
          PY
          python "$RUNNER_TEMP/materialize_epdm_a1_perf.py"
      - name: Install, normalize and verify final tree
        run: |
          python -m pip install --quiet -e '.[dev]'
          python -m pip check
          python -m ruff check --fix --select I skills/epdm/contracts.py skills/epdm/registry.py skills/epdm/tests/test_epdm_phase_a1.py skills/epdm/validation_v2.py scripts/verify_wheel_contents.py tests/test_wheel_contract.py
          python -m ruff check skills/epdm/contracts.py skills/epdm/registry.py skills/epdm/tests/test_epdm_phase_a1.py skills/epdm/validation_v2.py scripts/verify_wheel_contents.py tests/test_wheel_contract.py
          rm -rf build dist wheelhouse work
          find . -maxdepth 1 -type d -name '*.egg-info' -exec rm -rf {} +
          git add -A
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
          git add reports/SOURCE_CORE_MANIFEST.tsv
          python -m tsao.cli doctor --root . --profile core
          python scripts/run_ci.py
      - name: Verify qualified matrix and write permanent evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, os, re, subprocess, sys
          from pathlib import Path

          repository = os.environ['GITHUB_REPOSITORY']
          qualification_run_id = int(os.environ['QUALIFICATION_RUN_ID'])
          raw = subprocess.check_output(
              ['gh', 'api', f'/repos/{repository}/actions/runs/{qualification_run_id}/jobs?per_page=100'],
              text=True,
          )
          jobs = json.loads(raw)['jobs']
          expected = {
              'qualification (ubuntu/3.11)', 'qualification (ubuntu/3.12)',
              'qualification (ubuntu/3.13)', 'qualification (ubuntu/3.14)',
              'qualification (windows/3.14)', 'qualification (macos/3.14)',
          }
          qualification_jobs = [job for job in jobs if str(job.get('name', '')).startswith('qualification (')]
          observed = {job['name'] for job in qualification_jobs}
          if observed != expected:
              raise SystemExit(f'matrix mismatch: {sorted(observed)}')
          if any(job.get('conclusion') != 'success' for job in qualification_jobs):
              raise SystemExit('one or more qualification jobs failed')
          mandatory = {
              'Materialize Phase A1 and optimize wheel verification', 'Install',
              'Normalize and verify deterministic imports', 'Rebuild and verify source identity',
              'Full software qualification', 'Skillpack, wheel and installed-runtime closure',
              'CLI and Phase A1 smoke',
          }
          matrix = []
          for job in sorted(qualification_jobs, key=lambda item: item['name']):
              steps = {step['name']: step.get('conclusion') for step in job.get('steps', [])}
              failed = sorted(name for name in mandatory if steps.get(name) != 'success')
              if failed:
                  raise SystemExit(f"{job['name']} missing/failed steps: {failed}")
              matrix.append({'name': job['name'], 'job_id': job['id'], 'conclusion': job['conclusion']})
          ubuntu_314 = next(job for job in qualification_jobs if job['name'] == 'qualification (ubuntu/3.14)')
          performance = {step['name']: step.get('conclusion') for step in ubuntu_314['steps']}.get('Extended performance regression gate')
          if performance != 'success':
              raise SystemExit('performance gate did not succeed')

          collected = subprocess.run(
              [sys.executable, '-m', 'pytest', '--collect-only', '-q', 'tests', 'skills/process-general/tests', 'skills/epdm/tests', 'skills/poe/tests', 'skills/polymer-general/tests'],
              text=True, capture_output=True, check=True,
          )
          collection_text = collected.stdout + '\n' + collected.stderr
          summaries = [int(value) for value in re.findall(r'(\d+)\s+tests?\s+collected', collection_text)]
          if summaries:
              test_count = summaries[-1]
          else:
              node_ids = [line.strip() for line in collected.stdout.splitlines() if '::' in line and not line.lstrip().startswith(('=', '<'))]
              test_count = len(node_ids)
          if test_count != int(os.environ['EXPECTED_TEST_COUNT']):
              raise SystemExit(f'test count mismatch: {test_count}; output={collection_text[-500:]}')

          project = json.loads(Path('skills/epdm/fixtures/v2_phase_a1_reference_project.json').read_text(encoding='utf-8'))
          from skills.epdm.validation_v2 import validate_v2_project
          validation = validate_v2_project(project)
          if validation.decision.value != 'PASS':
              raise SystemExit(validation.as_dict())
          requirements = json.loads(Path('skills/epdm/data/requirements_v2.json').read_text(encoding='utf-8'))
          if len(requirements['items']) != 80:
              raise SystemExit('requirement traceability count mismatch')

          subprocess.run(['git', 'add', '-A'], check=True)
          qualified_code_tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          report = {
              'schema': 'TSAO-EPDM-PHASE-A1-QUALIFICATION-2',
              'phase': 'EPDM_PHASE_A1_SCIENTIFIC_CONTRACTS_AND_SCHEMAS',
              'status': 'PASS',
              'baseline_commit': 'f9984c6416fadc62680c35a4134aed03dbb57257',
              'qualification_trigger_commit': os.environ['QUALIFICATION_TRIGGER_COMMIT'],
              'qualified_code_tree_sha': qualified_code_tree,
              'qualification_run_id': qualification_run_id,
              'qualification_run_url': f'https://github.com/{repository}/actions/runs/{qualification_run_id}',
              'evidence_recovery_finalizer_run_id': int(os.environ['GITHUB_RUN_ID']),
              'evidence_recovery_finalizer_run_url': f"https://github.com/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'cross_platform_matrix': matrix,
              'test_count': test_count,
              'coverage_gate': 'PASS_FAIL_UNDER_75',
              'ruff': 'PASS_ALL_MATRIX_JOBS',
              'wheel_build': 'PASS_ALL_MATRIX_JOBS',
              'wheel_content': 'PASS_ALL_MATRIX_JOBS',
              'wheel_content_verifier_index_optimization': 'PASS_SEMANTICS_PRESERVED',
              'isolated_runtime': 'PASS_ALL_MATRIX_JOBS',
              'skillpack_delivery': 'PASS_ALL_MATRIX_JOBS',
              'performance_regression_gate': 'PASS_UBUNTU_PYTHON_3_14_UNCHANGED_THRESHOLD',
              'performance_baseline': 'ALPHA10_EXTENDED_UNCHANGED',
              'v1_public_api_lock': 'PASS_ZERO_REGRESSION',
              'v1_golden_numeric_lock': 'PASS_ZERO_REGRESSION',
              'frozen_enumerations_and_contracts': 'SOFTWARE_VERIFIED_PHASE_A1',
              'json_schemas': 'DRAFT_2020_12_STRICT_SOFTWARE_VERIFIED',
              'semantic_cross_reference_validator': 'PASS',
              'si_unit_and_evidence_gates': 'PASS',
              'layered_qualification_derivation': 'PASS',
              'v1_to_v2_migration': 'METADATA_ONLY_NO_EVIDENCE_FABRICATION',
              'requirements_count': 80,
              'v2_numerical_execution': 'NOT_IMPLEMENTED_PHASE_A1',
              'reaction_network_rhs': 'NOT_IMPLEMENTED',
              'thermodynamics_calibration_gpc_moments_reactors_dynamics': 'NOT_IMPLEMENTED',
              'temporary_workflows': 'REMOVED_IN_FINAL_COMMIT',
              'qualification_boundary': 'SOFTWARE_CONTRACTS_ONLY',
              'scientific_technical_approval': 'NOT_EVALUATED',
              'engineering_design_approval': 'NOT_EVALUATED',
              'hse_approval': 'NOT_EVALUATED',
              'customer_qualification': 'NOT_EVALUATED',
              'industrial_performance_guarantee': 'NOT_EVALUATED',
              'next_phase': 'EPDM_PHASE_A2_REACTION_NETWORK_AND_STATE_GENERATOR',
          }
          Path('reports/EPDM_PHASE_A1_QUALIFICATION.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
          git add reports/EPDM_PHASE_A1_QUALIFICATION.json reports/SOURCE_CORE_MANIFEST.tsv
          python -m tsao.cli doctor --root . --profile core
      - name: Commit qualified Phase A1 tree
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(epdm): implement Phase A1 contracts and optimize wheel verification'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh issue comment --repo "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" --body "EPDM Phase A1 qualification PASS. Final commit: \`$COMMIT_SHA\`. Matrix run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID. Recovery run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  report-failure:
    if: ${{ always() && github.event.issue.title == '[FINALIZE-EPDM-A1-PERF-FIX]' && needs.finalize.result == 'failure' }}
    needs: finalize
    runs-on: ubuntu-latest
    steps:
      - name: Report failure
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment --repo "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" --body "EPDM Phase A1 evidence recovery FAILED. Inspect: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
