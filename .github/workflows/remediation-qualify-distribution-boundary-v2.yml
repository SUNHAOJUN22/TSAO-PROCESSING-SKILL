name: One-shot distribution boundary qualification v2

on:
  push:
    branches:
      - remediation/pep517-setup-bootstrap
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: processing-distribution-boundary-convergence-v2
  cancel-in-progress: false

jobs:
  qualify-and-freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact Draft PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: remediation/pep517-setup-bootstrap
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install exact dependencies and package
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Remove transport and regenerate tracked source manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/remediation-qualify-distribution-boundary.yml \
            .github/workflows/remediation-qualify-distribution-boundary-v2.yml
          python -m ruff format tests/test_public_distribution_boundary_workflow.py
          python -m ruff check --fix tests/test_public_distribution_boundary_workflow.py
          python - <<'PY'
          from pathlib import Path
          import subprocess

          script = Path('scripts/build_source_asset_manifest.py')
          probe = subprocess.run(
              ['python', str(script), '--help'],
              text=True,
              capture_output=True,
              check=True,
          )
          help_text = probe.stdout + probe.stderr
          if '--write' in help_text:
              command = ['python', str(script), '--write']
          elif '--out' in help_text:
              command = [
                  'python',
                  str(script),
                  '--out',
                  'reports/SOURCE_CORE_MANIFEST.tsv',
              ]
          elif '--output' in help_text:
              command = [
                  'python',
                  str(script),
                  '--output',
                  'reports/SOURCE_CORE_MANIFEST.tsv',
              ]
          else:
              raise SystemExit('source-manifest builder exposes no supported output option')
          subprocess.run(command, check=True)
          PY
          git add -A

      - name: Execute full repository qualification
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q
          python -m ruff format --check .
          python -m ruff check .
          python -m tsao doctor --profile core
          git diff --check

      - name: Verify permanent boundary is provenance-covered
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/public-distribution-boundary.yml
          test -f tests/test_public_distribution_boundary_workflow.py
          test -z "$(find .github/workflows -maxdepth 1 -name 'remediation-qualify-distribution-boundary*' -print -quit)"
          rg -n 'public-distribution-boundary.yml' reports/SOURCE_CORE_MANIFEST.tsv
          rg -n 'test_public_distribution_boundary_workflow.py' reports/SOURCE_CORE_MANIFEST.tsv

      - name: Commit exact review tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci(distribution): enforce permanent controlled-registry boundary"
          git push origin HEAD:remediation/pep517-setup-bootstrap
