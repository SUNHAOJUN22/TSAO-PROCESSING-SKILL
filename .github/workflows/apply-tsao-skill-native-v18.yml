name: Apply comprehensive skill-native V18

on:
  push:
    branches: [main]
    paths:
      - .tsao-skill-native-v18/**
      - scripts/apply_tsao_skill_native_v18.py
      - .github/workflows/apply-tsao-skill-native-v18.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: tsao-processing-skill-native-v18
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Apply verified V18 scientific-core payload
        run: python scripts/apply_tsao_skill_native_v18.py
      - name: Repair and syntax-check the exact material-balance payload
        shell: bash
        run: |
          set -euo pipefail
          python .tsao-skill-native-v18/repair_material_balance.py
          python - <<'PY'
          from pathlib import Path

          path = Path("skills/poe/material_balance.py")
          text = path.read_text(encoding="utf-8")
          old = "def term(name: str, *, non_negative: bool) -> float:"
          new = (
              "def term(\n"
              "                name: str,\n"
              "                *,\n"
              "                non_negative: bool,\n"
              "                current_row: Mapping[str, object] = row,\n"
              "                row_number: int = index,\n"
              "                unit_factor: float = factor,\n"
              "            ) -> float:"
          )
          if old not in text:
              raise SystemExit("expected nested term helper was not found")
          text = text.replace(old, new, 1)
          text = text.replace(
              'row.get(name), f"row {index} {name}", allow_string=True',
              'current_row.get(name), f"row {row_number} {name}", allow_string=True',
              1,
          )
          text = text.replace(
              'f"row {index} {name} must be non-negative"',
              'f"row {row_number} {name} must be non-negative"',
              1,
          )
          text = text.replace("converted = value * factor", "converted = value * unit_factor", 1)
          text = text.replace(
              'f"row {index} {name} conversion is non-finite"',
              'f"row {row_number} {name} conversion is non-finite"',
              1,
          )
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          python -m py_compile skills/poe/material_balance.py
      - name: Capture exact applied V18 surfaces for deterministic repair audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: processing-v18-applied-${{ github.run_id }}
          path: |
            skills/poe/material_balance.py
            skills/poe/acceptance_status.py
            skills/poe/numeric_contracts.py
            skills/poe/polymer_metrics_v5.py
            skills/poe/tests/test_acceptance_status_v2.py
            skills/poe/tests/test_material_balance_v2.py
            skills/poe/tests/test_numeric_contracts_v2.py
            skills/poe/tests/test_polymer_metrics_v5.py
            skills/polymer-general/scripts/check_balance.py
            scripts/check_public_distribution_policy.py
          if-no-files-found: error
          retention-days: 3
      - name: Remove one-shot and obsolete workflow surfaces before validation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tsao-skill-native-v18
          rm -f scripts/apply_tsao_skill_native_v18.py
          rm -f scripts/apply_skill_native_v15_fix2.py
          rm -f .github/workflows/apply-tsao-skill-native-v18.yml
          rm -f .github/workflows/contracts-v17.yml
          rm -f .github/workflows/branch-hygiene-v15.yml
          rm -f .github/workflows/apply-skill-native-v15-fix1.yml
          rm -f .github/workflows/apply-skill-native-v15-fix2.yml
          rm -f .github/V15_FINAL_QUALIFICATION.md
          rm -f .github/V17_FINAL_QUALIFICATION_2026-08-19.md
          rm -f V15_RELEASE_NOTES.md
      - name: Install exact locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_dependency_lock.py requirements.lock --pyproject pyproject.toml
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Normalize V18 Python surfaces
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t surfaces < <(python - <<'PY'
          from pathlib import Path

          roots = [Path("tsao"), Path("skills/poe"), Path("skills/polymer-general"), Path("tests")]
          for root in roots:
              if root.is_file() and root.suffix == ".py":
                  print(root.as_posix())
              elif root.is_dir():
                  for path in sorted(root.rglob("*.py")):
                      print(path.as_posix())
          PY
          )
          test "${#surfaces[@]}" -gt 0
          python -m ruff check "${surfaces[@]}" --fix --unsafe-fixes --exit-zero
          python -m ruff format "${surfaces[@]}"
          python -m compileall -q tsao skills tests
          git diff --check
      - name: Rebuild exact-tree provenance before native qualification
        shell: bash
        run: |
          set -euo pipefail
          header=$'path\tsha256\tbytes\tspecialist\tartifact_class\tlicense_scope\n'
          printf '%s' "$header" > reports/SOURCE_CORE_OVERLAY.tsv
          printf '%s' "$header" > reports/SOURCE_ACCEPTANCE_OVERLAY.tsv
          python scripts/build_source_asset_manifest.py \
            --root . \
            --out reports/SOURCE_CORE_MANIFEST.tsv
          python -m tsao.cli doctor --root . --profile core
          git diff --check
      - name: Run authoritative repository CI driver
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_ci.py 2>&1 | tee /tmp/v18-run-ci.log
      - name: Run V18 focused contracts explicitly
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            skills/poe/tests/test_acceptance_status_v2.py \
            skills/poe/tests/test_material_balance_v2.py \
            skills/poe/tests/test_numeric_contracts_v2.py \
            skills/poe/tests/test_polymer_metrics_v5.py 2>&1 | tee /tmp/v18-focused.log
      - name: Verify expected public-distribution containment
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python scripts/check_public_distribution_policy.py \
            --registry-root skills/poe/data \
            --surface wheel \
            --surface source-snapshot \
            --surface actions-artifact \
            --inventory-out reports/runtime/PUBLIC_DISTRIBUTION_INVENTORY.json \
            > /tmp/v18-containment.log 2>&1
          rc=$?
          set -e
          cat /tmp/v18-containment.log
          test "$rc" -eq 2
          grep -q 'BLOCKED_CONTROLLED_METADATA_CLASSIFICATION' /tmp/v18-containment.log
      - name: Compile source tree
        run: python -m compileall -q tsao skills scripts
      - name: Clean ignored runtime outputs
        shell: bash
        run: git clean -fdX
      - name: Commit verified V18 source to main
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Expected V18 source changes were not produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: close Processing containment, state, and material-balance contracts V18'
          git push origin HEAD:main
      - name: Open diagnostic issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          printf 'Workflow run: %s/actions/runs/%s\nCommit: %s\n' '${{ github.server_url }}/${{ github.repository }}' '${{ github.run_id }}' '${{ github.sha }}' > /tmp/v18-failure.txt
          for log in /tmp/v18-*.log; do
            if [[ -f "$log" ]]; then
              printf '\n===== %s =====\n' "$(basename "$log")" >> /tmp/v18-failure.txt
              tail -n 260 "$log" >> /tmp/v18-failure.txt
            fi
          done
          gh issue create --title 'V18 remediation failed (run ${{ github.run_id }})' --body-file /tmp/v18-failure.txt
