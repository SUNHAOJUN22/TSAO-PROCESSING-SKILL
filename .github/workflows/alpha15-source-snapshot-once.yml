name: Alpha15 source snapshot once

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    if: ${{ github.head_ref == 'alpha15-source-snapshot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8719e59140202aae53cdfb80239b80dedad6767a
          fetch-depth: 0
      - name: Verify exact Alpha14 and export complete tracked tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8719e59140202aae53cdfb80239b80dedad6767a"
          git archive --format=zip --output=TSAO-PROCESSING-SKILL-alpha14-complete-tree.zip HEAD
          sha256sum TSAO-PROCESSING-SKILL-alpha14-complete-tree.zip > TSAO-PROCESSING-SKILL-alpha14-complete-tree.zip.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tsao-alpha14-complete-tree
          path: |
            TSAO-PROCESSING-SKILL-alpha14-complete-tree.zip
            TSAO-PROCESSING-SKILL-alpha14-complete-tree.zip.sha256
          if-no-files-found: error
          retention-days: 2
