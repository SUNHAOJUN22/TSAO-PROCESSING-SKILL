name: Alpha15 source snapshot once

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    if: ${{ github.head_ref == 'alpha15-source-snapshot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8719e59140202aae53cdfb80239b80dedad6767a
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Install source exporter
        run: python -m pip install --quiet -e .
      - name: Verify and export exact Alpha14 source
        run: |
          python -m tsao.cli doctor --root . --profile core
          python scripts/export_source_snapshot.py --root . --out TSAO-PROCESSING-SKILL-source-alpha.14-exact.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tsao-alpha14-exact-source
          path: |
            TSAO-PROCESSING-SKILL-source-alpha.14-exact.zip
            TSAO-PROCESSING-SKILL-source-alpha.14-exact.zip.sha256
          if-no-files-found: error
          retention-days: 2
