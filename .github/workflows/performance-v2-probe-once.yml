name: Probe performance v2 optimized paths once
# Rerun after restoring alpha10 compensated semibatch closure summation.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  probe:
    if: ${{ contains(github.event.head_commit.message, '[PERF-V2-PROBE]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install and probe
        shell: bash
        run: |
          python -m pip install --quiet -e .[dev]
          python - <<'PY'
          import gc
          import hashlib
          import json
          import statistics
          import timeit
          import tracemalloc
          from pathlib import Path
          from scripts.benchmark_performance_v2 import (
              _epdm_parameter_scan_batch,
              _epdm_semibatch_trajectory_compiled,
              _poe_rk4_terminal_10000,
          )

          baseline = json.loads(Path('reports/PERFORMANCE_BASELINE_ALPHA10_EXTENDED.json').read_text())
          rows = {row['name']: row for row in baseline['benchmarks']}

          def digest(value):
              return hashlib.sha256(json.dumps(value, sort_keys=True, separators=(',', ':')).encode()).hexdigest()

          def measure(name, function, reference, number, repeats):
              for _ in range(2):
                  function()
              result = function()
              samples = [value / number for value in timeit.repeat(function, number=number, repeat=repeats)]
              gc.collect()
              tracemalloc.start()
              function()
              _, peak = tracemalloc.get_traced_memory()
              tracemalloc.stop()
              before = rows[reference]
              return {
                  'name': name,
                  'reference': reference,
                  'median_s': statistics.median(samples),
                  'minimum_s': min(samples),
                  'maximum_s': max(samples),
                  'speedup': float(before['median_s_per_call']) / statistics.median(samples),
                  'peak_memory_bytes': peak,
                  'reference_peak_memory_bytes': int(before['peak_memory_bytes']),
                  'memory_ratio': peak / max(int(before['peak_memory_bytes']), 1),
                  'result_sha256': digest(result),
                  'reference_result_sha256': before['result_sha256'],
              }

          results = [
              measure('epdm_parameter_scan_1000_batch', _epdm_parameter_scan_batch, 'epdm_parameter_scan_1000_scalar', 5, 7),
              measure('epdm_semibatch_10000_steps_compiled', _epdm_semibatch_trajectory_compiled, 'epdm_semibatch_10000_steps', 1, 5),
              measure('poe_rk4_10000_steps_terminal', _poe_rk4_terminal_10000, 'poe_rk4_10000_steps', 1, 5),
          ]
          report = {
              'schema': 'TSAO-PERFORMANCE-V2-PROBE-1',
              'baseline_version': baseline['version'],
              'candidate_version': __import__('tsao').__version__,
              'results': results,
              'qualification_scope': 'SOFTWARE_PERFORMANCE_ONLY',
              'scientific_technical_approval': 'NOT_EVALUATED',
              'engineering_design_approval': 'NOT_EVALUATED',
              'industrial_performance_guarantee': 'NOT_EVALUATED',
          }
          Path('reports/PERFORMANCE_V2_PROBE.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/PERFORMANCE_V2_PROBE.json
          git commit -m 'diagnostic: capture performance v2 focused probe [skip ci]'
          git push origin HEAD:main
