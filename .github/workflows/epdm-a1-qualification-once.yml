name: Qualify EPDM Phase A1 once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: tsao-epdm-phase-a1-qualification-once
  cancel-in-progress: false

env:
  PAYLOAD_SHA256: 54b5bc616755163c5632770c098aaee43739a447cb38b4524bf3f7284b9e103e
  PAYLOAD_BYTES: '38958'
  EXPECTED_TEST_COUNT: '259'
  CHUNK_SHAS: |
    09627938dcf4b1ac08fb1a83fdd671ddf67a9f88
    68a39cb9fd4005b59ce180e01a8ef498b9797925
    1c7d9729b427458ebec6a8dd2031c35817eaf524
    7bbd5edfd4e20749f54ec9cfaf4fb3530e1885d4
    60479e997ea42beb47d1038d9e8547d8dbb1929a
    ba5dcae0e69b44a71af858b1293f12d59ae47055
    8f9b86e70c663d4b77591a11920be55117250276
    4bb22d3e34c8b187be24a14645a9a562682a83d1
    e529d375456eadf997b30ee1541e5c694f464b5d
    df1f8d936e73f11847379ab27cfa69ed6a77ee63
    a20102bba335191496db8678efca46ca6214d25d
    4f958745cdf49674f851dc67c5ffb7171578f1c5
    101049ec195de1988f6ca957c7fe6790f84b97a0
    ae1b7803f9c1f8f9643a9a223052af7f5fd8b3d5
    7e2850b41d2ed34801b7b647ec481914e48cee3b
    bdccfaf7d424237b800b84ac23cdd872912e2c8f
    e5ea3fe5c8a257358587c6b4259618ea19b8654e
    7754b6eca9fc4d87c68fcd139940b47956cecb72

jobs:
  qualification:
    if: ${{ github.event.issue.title == '[QUALIFY-EPDM-A1]' }}
    name: qualification (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu/3.11
            os: ubuntu-latest
            python: '3.11'
          - id: ubuntu/3.12
            os: ubuntu-latest
            python: '3.12'
          - id: ubuntu/3.13
            os: ubuntu-latest
            python: '3.13'
          - id: ubuntu/3.14
            os: ubuntu-latest
            python: '3.14'
          - id: windows/3.14
            os: windows-latest
            python: '3.14'
          - id: macos/3.14
            os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Materialize and verify Phase A1 payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import json
          import os
          import subprocess
          import tarfile
          import urllib.request
          from pathlib import Path, PurePosixPath

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          chunks = []
          for sha in os.environ['CHUNK_SHAS'].split():
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/git/blobs/{sha}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)
              raw = base64.b64decode(payload['content']).decode('ascii')
              observed = hashlib.sha1(f'blob {len(raw.encode())}\0'.encode() + raw.encode()).hexdigest()
              if observed != sha:
                  raise SystemExit(f'chunk identity mismatch: {sha} != {observed}')
              chunks.append(raw)

          archive = base64.b64decode(''.join(chunks), validate=True)
          observed_sha = hashlib.sha256(archive).hexdigest()
          if observed_sha != os.environ['PAYLOAD_SHA256']:
              raise SystemExit(f'payload SHA mismatch: {observed_sha}')
          if len(archive) != int(os.environ['PAYLOAD_BYTES']):
              raise SystemExit(f'payload byte mismatch: {len(archive)}')

          root = Path.cwd().resolve()
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as bundle:
              for member in bundle.getmembers():
                  relative = PurePosixPath(member.name)
                  if relative.is_absolute() or '..' in relative.parts:
                      raise SystemExit(f'unsafe payload member: {member.name}')
                  destination = root.joinpath(*relative.parts)
                  if member.isdir():
                      destination.mkdir(parents=True, exist_ok=True)
                  elif member.isfile():
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      source = bundle.extractfile(member)
                      if source is None:
                          raise SystemExit(f'unreadable payload member: {member.name}')
                      destination.write_bytes(source.read())
                  else:
                      raise SystemExit(f'unsupported payload member: {member.name}')

          manifest_path = root / 'PAYLOAD_MANIFEST.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          expected_paths = set(manifest['files'])
          for name, record in manifest['files'].items():
              data = (root / name).read_bytes()
              if len(data) != record['bytes'] or hashlib.sha256(data).hexdigest() != record['sha256']:
                  raise SystemExit(f'payload member identity mismatch: {name}')
          manifest_path.unlink()

          workflow = root / '.github/workflows/epdm-a1-qualification-once.yml'
          workflow.unlink()
          subprocess.run(['git', 'add', '-A'], check=True)
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          workflows = sorted(path for path in tracked if path.startswith('.github/workflows/'))
          if workflows != ['.github/workflows/ci.yml']:
              raise SystemExit(f'workflow hygiene mismatch: {workflows}')
          print(f'materialized {len(expected_paths)} Phase A1 files')
          PY
      - name: Install
        shell: bash
        run: |
          python -m pip install --quiet -e '.[dev]'
          python -m pip check
      - name: Rebuild and verify source identity
        shell: bash
        run: |
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
          git add reports/SOURCE_CORE_MANIFEST.tsv
          python -m tsao.cli doctor --root . --profile core
      - name: Full software qualification
        shell: bash
        run: python scripts/run_ci.py
      - name: Skillpack, wheel and installed-runtime closure
        shell: bash
        run: |
          python -m tsao.skillpacks --root .
          python -m tsao.cli package template --family 'generic process'
          python -m pip wheel --no-deps --no-build-isolation . -w wheelhouse
          python scripts/verify_wheel_contents.py --wheel-dir wheelhouse
          python scripts/verify_wheel_runtime.py --wheel-dir wheelhouse
      - name: CLI and Phase A1 smoke
        shell: bash
        run: |
          python -m tsao.cli epdm status
          python -m tsao.cli epdm audit
          python -m tsao.cli epdm reference-demo
          python - <<'PY'
          import json
          from pathlib import Path
          from skills.epdm.validation_v2 import validate_v2_project

          project = json.loads(Path('skills/epdm/fixtures/v2_phase_a1_reference_project.json').read_text(encoding='utf-8'))
          result = validate_v2_project(project)
          assert result.decision.value == 'PASS', result.as_dict()
          assert result.as_dict()['v2_numerical_execution'] == 'NOT_IMPLEMENTED_PHASE_A1'
          PY
      - name: Extended performance regression gate
        if: ${{ matrix.id == 'ubuntu/3.14' }}
        shell: bash
        run: |
          python scripts/benchmark_performance_v2.py --repeats 7 --wheel-dir wheelhouse --output reports/runtime/PERFORMANCE_RESULTS_V2.json
          python scripts/compare_performance_v2.py --baseline reports/PERFORMANCE_BASELINE_ALPHA10_EXTENDED.json --current reports/runtime/PERFORMANCE_RESULTS_V2.json --output reports/runtime/PERFORMANCE_COMPARISON_V2.json
          python scripts/update_performance_readme.py --comparison reports/PERFORMANCE_COMPARISON_ALPHA11.json --check

  finalize:
    if: ${{ github.event.issue.title == '[QUALIFY-EPDM-A1]' }}
    needs: qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Materialize exact qualified tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import json
          import os
          import subprocess
          import tarfile
          import urllib.request
          from pathlib import Path, PurePosixPath

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          text = ''
          for sha in os.environ['CHUNK_SHAS'].split():
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/git/blobs/{sha}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)
              chunk = base64.b64decode(payload['content']).decode('ascii')
              observed = hashlib.sha1(f'blob {len(chunk.encode())}\0'.encode() + chunk.encode()).hexdigest()
              if observed != sha:
                  raise SystemExit(f'chunk identity mismatch: {sha} != {observed}')
              text += chunk
          archive = base64.b64decode(text, validate=True)
          if hashlib.sha256(archive).hexdigest() != os.environ['PAYLOAD_SHA256']:
              raise SystemExit('payload SHA mismatch')
          if len(archive) != int(os.environ['PAYLOAD_BYTES']):
              raise SystemExit('payload byte mismatch')

          root = Path.cwd().resolve()
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as bundle:
              for member in bundle.getmembers():
                  relative = PurePosixPath(member.name)
                  if relative.is_absolute() or '..' in relative.parts:
                      raise SystemExit(f'unsafe payload member: {member.name}')
                  destination = root.joinpath(*relative.parts)
                  if member.isdir():
                      destination.mkdir(parents=True, exist_ok=True)
                  elif member.isfile():
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      source = bundle.extractfile(member)
                      if source is None:
                          raise SystemExit(f'unreadable payload member: {member.name}')
                      destination.write_bytes(source.read())
                  else:
                      raise SystemExit(f'unsupported payload member: {member.name}')
          manifest_path = root / 'PAYLOAD_MANIFEST.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for name, record in manifest['files'].items():
              data = (root / name).read_bytes()
              if len(data) != record['bytes'] or hashlib.sha256(data).hexdigest() != record['sha256']:
                  raise SystemExit(f'payload member identity mismatch: {name}')
          manifest_path.unlink()
          (root / '.github/workflows/epdm-a1-qualification-once.yml').unlink()
          subprocess.run(['git', 'add', '-A'], check=True)
          PY
      - name: Install and rebuild source identity
        run: |
          python -m pip install --quiet -e '.[dev]'
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
          git add reports/SOURCE_CORE_MANIFEST.tsv
          python -m tsao.cli doctor --root . --profile core
      - name: Verify matrix evidence and Phase A1 contracts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          repository = os.environ['GITHUB_REPOSITORY']
          run_id = int(os.environ['GITHUB_RUN_ID'])
          raw = subprocess.check_output(['gh', 'api', f'/repos/{repository}/actions/runs/{run_id}/jobs?per_page=100'], text=True)
          jobs = json.loads(raw)['jobs']
          expected = {
              'qualification (ubuntu/3.11)',
              'qualification (ubuntu/3.12)',
              'qualification (ubuntu/3.13)',
              'qualification (ubuntu/3.14)',
              'qualification (windows/3.14)',
              'qualification (macos/3.14)',
          }
          qualification_jobs = [job for job in jobs if str(job.get('name', '')).startswith('qualification (')]
          observed = {job['name'] for job in qualification_jobs}
          if observed != expected:
              raise SystemExit(f'matrix mismatch: {sorted(observed)}')
          if any(job.get('conclusion') != 'success' for job in qualification_jobs):
              raise SystemExit('one or more qualification jobs failed')
          mandatory = {
              'Materialize and verify Phase A1 payload',
              'Install',
              'Rebuild and verify source identity',
              'Full software qualification',
              'Skillpack, wheel and installed-runtime closure',
              'CLI and Phase A1 smoke',
          }
          matrix = []
          for job in sorted(qualification_jobs, key=lambda item: item['name']):
              steps = {step['name']: step.get('conclusion') for step in job.get('steps', [])}
              failed = sorted(name for name in mandatory if steps.get(name) != 'success')
              if failed:
                  raise SystemExit(f"{job['name']} missing/failed steps: {failed}")
              matrix.append({'name': job['name'], 'job_id': job['id'], 'conclusion': job['conclusion']})
          ubuntu_314 = next(job for job in qualification_jobs if job['name'] == 'qualification (ubuntu/3.14)')
          performance = {step['name']: step.get('conclusion') for step in ubuntu_314['steps']}.get('Extended performance regression gate')
          if performance != 'success':
              raise SystemExit('performance gate did not succeed')

          collected = subprocess.run(
              [sys.executable, '-m', 'pytest', '--collect-only', '-q', 'tests', 'skills/process-general/tests', 'skills/epdm/tests', 'skills/poe/tests', 'skills/polymer-general/tests'],
              text=True,
              capture_output=True,
              check=True,
          )
          node_ids = [line.strip() for line in collected.stdout.splitlines() if '::' in line and not line.lstrip().startswith(('=', '<'))]
          test_count = len(node_ids)
          if test_count != int(os.environ['EXPECTED_TEST_COUNT']):
              raise SystemExit(f'test count mismatch: {test_count}')

          project = json.loads(Path('skills/epdm/fixtures/v2_phase_a1_reference_project.json').read_text(encoding='utf-8'))
          from skills.epdm.validation_v2 import validate_v2_project
          validation = validate_v2_project(project)
          if validation.decision.value != 'PASS':
              raise SystemExit(validation.as_dict())
          requirements = json.loads(Path('skills/epdm/data/requirements_v2.json').read_text(encoding='utf-8'))
          if len(requirements['items']) != 80:
              raise SystemExit('requirement traceability count mismatch')

          subprocess.run(['git', 'add', '-A'], check=True)
          qualified_code_tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          report = {
              'schema': 'TSAO-EPDM-PHASE-A1-QUALIFICATION-1',
              'phase': 'EPDM_PHASE_A1_SCIENTIFIC_CONTRACTS_AND_SCHEMAS',
              'status': 'PASS',
              'baseline_commit': 'f9984c6416fadc62680c35a4134aed03dbb57257',
              'qualification_trigger_commit': os.environ['GITHUB_SHA'],
              'qualified_code_tree_sha': qualified_code_tree,
              'qualification_run_id': run_id,
              'qualification_run_url': f'https://github.com/{repository}/actions/runs/{run_id}',
              'cross_platform_matrix': matrix,
              'test_count': test_count,
              'coverage_gate': 'PASS_FAIL_UNDER_75',
              'ruff': 'PASS_ALL_MATRIX_JOBS',
              'wheel_build': 'PASS_ALL_MATRIX_JOBS',
              'wheel_content': 'PASS_ALL_MATRIX_JOBS',
              'isolated_runtime': 'PASS_ALL_MATRIX_JOBS',
              'skillpack_delivery': 'PASS_ALL_MATRIX_JOBS',
              'performance_regression_gate': 'PASS_UBUNTU_PYTHON_3_14',
              'v1_public_api_lock': 'PASS_ZERO_REGRESSION',
              'v1_golden_numeric_lock': 'PASS_ZERO_REGRESSION',
              'frozen_enumerations_and_contracts': 'SOFTWARE_VERIFIED_PHASE_A1',
              'json_schemas': 'DRAFT_2020_12_STRICT_SOFTWARE_VERIFIED',
              'semantic_cross_reference_validator': 'PASS',
              'si_unit_and_evidence_gates': 'PASS',
              'layered_qualification_derivation': 'PASS',
              'v1_to_v2_migration': 'METADATA_ONLY_NO_EVIDENCE_FABRICATION',
              'requirements_count': 80,
              'v2_numerical_execution': 'NOT_IMPLEMENTED_PHASE_A1',
              'reaction_network_rhs': 'NOT_IMPLEMENTED',
              'thermodynamics_calibration_gpc_moments_reactors_dynamics': 'NOT_IMPLEMENTED',
              'temporary_workflows': 'REMOVED_IN_FINAL_COMMIT',
              'qualification_boundary': 'SOFTWARE_CONTRACTS_ONLY',
              'scientific_technical_approval': 'NOT_EVALUATED',
              'engineering_design_approval': 'NOT_EVALUATED',
              'hse_approval': 'NOT_EVALUATED',
              'customer_qualification': 'NOT_EVALUATED',
              'industrial_performance_guarantee': 'NOT_EVALUATED',
              'next_phase': 'EPDM_PHASE_A2_REACTION_NETWORK_AND_STATE_GENERATOR',
          }
          Path('reports/EPDM_PHASE_A1_QUALIFICATION.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
          git add reports/EPDM_PHASE_A1_QUALIFICATION.json reports/SOURCE_CORE_MANIFEST.tsv
          python -m tsao.cli doctor --root . --profile core
      - name: Commit qualified Phase A1 tree
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(epdm): implement Phase A1 scientific contracts and schemas'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "EPDM Phase A1 qualification PASS. Final commit: \`$COMMIT_SHA\`. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  report-failure:
    if: ${{ always() && github.event.issue.title == '[QUALIFY-EPDM-A1]' && (needs.qualification.result == 'failure' || needs.qualification.result == 'cancelled' || needs.finalize.result == 'failure' || needs.finalize.result == 'cancelled') }}
    needs: [qualification, finalize]
    runs-on: ubuntu-latest
    steps:
      - name: Report failure
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "EPDM Phase A1 qualification FAILED. Inspect: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
