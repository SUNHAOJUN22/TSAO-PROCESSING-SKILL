name: TSAO acceptance provenance export

on:
  push:
    branches: [agent/final-acceptance-20260807]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Generate exact current source overlay
        run: >-
          python scripts/update_source_overlay.py
          --root .
          --output SOURCE_ACCEPTANCE_OVERLAY.generated.tsv
      - name: Upload exact current source overlay
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsao-source-acceptance-overlay-${{ github.sha }}
          path: SOURCE_ACCEPTANCE_OVERLAY.generated.tsv
          if-no-files-found: error
          retention-days: 1
