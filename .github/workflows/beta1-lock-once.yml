name: Generate Beta1 hashed dependency lock

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install lock tooling
        run: python -m pip install --quiet pip-tools==7.6.0 pip-audit==2.10.1
      - name: Build isolated Beta1 dependency specification
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/beta1-lock"
          cat > "$RUNNER_TEMP/beta1-lock/pyproject.toml" <<'EOF'
          [build-system]
          requires = ["setuptools>=68,<84", "wheel>=0.41,<1"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "tsao-processing-skill"
          version = "0.1.0b1"
          requires-python = ">=3.11"
          dependencies = [
            "PyYAML>=6.0,<7",
            "jsonschema[format]>=4.20,<5",
            "numpy>=1.26,<3",
          ]

          [project.optional-dependencies]
          dev = [
            "pytest>=8.0,<10",
            "coverage>=7.0,<8",
            "ruff>=0.5,<1",
            "mypy>=2.3,<3",
            "pip-audit>=2.10.1,<3",
            "setuptools>=68,<84",
            "wheel>=0.41,<1",
          ]
          EOF
      - name: Compile exact hashed lock
        shell: bash
        run: |
          python -m piptools compile \
            --extra dev \
            --generate-hashes \
            --strip-extras \
            --resolver backtracking \
            --allow-unsafe \
            --output-file requirements.lock \
            "$RUNNER_TEMP/beta1-lock/pyproject.toml"
      - name: Verify lock structure and vulnerability state
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          path = Path('requirements.lock')
          text = path.read_text(encoding='utf-8')
          logical = []
          pending = ''
          for raw in text.splitlines():
              line = raw.strip()
              if not line or line.startswith('#') or line.startswith('--index-url'):
                  continue
              pending = f'{pending} {line}'.strip()
              if pending.endswith('\\'):
                  pending = pending[:-1].rstrip()
                  continue
              logical.append(pending)
              pending = ''
          if pending:
              logical.append(pending)
          pin = re.compile(r'^([A-Za-z0-9_.-]+)(?:\[[^\]]+\])?==([^\s;\\]+)')
          sha = re.compile(r'--hash=sha256:[0-9a-f]{64}(?=\s|$)')
          packages = {}
          errors = []
          for index, line in enumerate(logical, 1):
              match = pin.match(line)
              if match is None:
                  errors.append(f'row {index}: not exactly pinned')
                  continue
              name, version = match.groups()
              normalized = re.sub(r'[-_.]+', '-', name).lower()
              if not sha.search(line):
                  errors.append(f'row {index}: {normalized} lacks sha256')
              packages[normalized] = version
          required = {'pyyaml','jsonschema','numpy','pytest','coverage','ruff','mypy','pip-audit','setuptools','wheel'}
          missing = sorted(required - set(packages))
          if missing:
              errors.append('missing direct dependencies: ' + ', '.join(missing))
          report = {
              'status': 'PASS' if not errors else 'FAIL',
              'python': '3.11',
              'package_count': len(packages),
              'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              'missing': missing,
              'errors': errors,
          }
          Path('BETA1_LOCK_GENERATION.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2))
          if errors:
              raise SystemExit(1)
          PY
          pip-audit --require-hashes -r requirements.lock --format json --output BETA1_PIP_AUDIT.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: beta1-hashed-lock
          path: |
            requirements.lock
            BETA1_LOCK_GENERATION.json
            BETA1_PIP_AUDIT.json
          if-no-files-found: error
          retention-days: 14
