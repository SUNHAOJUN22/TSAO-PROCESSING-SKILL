name: Export EPDM A1 source once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  export:
    if: ${{ github.event.issue.title == '[EXPORT-EPDM-A1-SOURCE]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --quiet -e .
      - name: Prepare clean source tree
        run: |
          rm -f .github/workflows/export-epdm-a1-source-once.yml
          git add -A
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
          git add reports/SOURCE_CORE_MANIFEST.tsv
          python -m tsao.cli doctor --root . --profile core
      - name: Export deterministic source snapshot
        run: python scripts/export_source_snapshot.py --root . --out TSAO-PROCESSING-SKILL-source-a0-hardened.zip
      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tsao-source-a0-hardened-${{ github.sha }}
          path: |
            TSAO-PROCESSING-SKILL-source-a0-hardened.zip
            TSAO-PROCESSING-SKILL-source-a0-hardened.zip.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Commit workflow cleanup
        id: cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows reports/SOURCE_CORE_MANIFEST.tsv
          git commit -m 'chore: remove EPDM A1 source export workflow'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Report result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CLEANUP_SHA: ${{ steps.cleanup.outputs.sha }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "EPDM A1 source export PASS. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Cleanup commit: \`$CLEANUP_SHA\`. Artifact: \`tsao-source-a0-hardened-${GITHUB_SHA}\`."
