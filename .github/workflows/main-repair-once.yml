              "tests/test_skillpack_delivery.py",
              "tsao/skillpacks.py",
          }
          actual = set(
              subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines()
          )
          missing = required - actual
          if missing:
              raise SystemExit(f"required repair paths not staged: {sorted(missing)}")
          allowed_exact = required
          unexpected = sorted(
              path
              for path in actual
              if path not in allowed_exact and not path.startswith("docs/assets/readme/")
          )
          if unexpected:
              raise SystemExit(f"unexpected staged paths: {unexpected}")
          for path in actual:
              if path.startswith("docs/assets/readme/") and Path(path).suffix != ".svg":
                  raise SystemExit(f"unexpected README asset type: {path}")
          print(f"validated {len(actual)} staged repair paths")
