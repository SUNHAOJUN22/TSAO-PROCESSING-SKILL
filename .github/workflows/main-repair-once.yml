          from __future__ import annotations

          import subprocess
          from pathlib import Path

          required = {
              ".github/workflows/ci.yml",
              ".github/workflows/main-repair-once.yml",
              "README.md",
              "README.zh-CN.md",
              "docs/README_VISUAL_SYSTEM.md",
