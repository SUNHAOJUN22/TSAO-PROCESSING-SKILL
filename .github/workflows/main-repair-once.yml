name: Main repair and AI visual upgrade once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/main-repair-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tsao-main-repair-once
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install qualification dependencies
        run: |
          python -m pip install --quiet -e .[dev]
          python -m pip check
      - name: Apply CI repair and governed visual upgrade
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          ROOT = Path.cwd()
          AI_RENDERERS = 'def render_ai_scientific_reasoning_loop() -> str:\n    parts = svg_start(\n        "Scientific AI reasoning loop",\n        "A closed-loop scientific workflow connecting evidence, mechanisms, simulation, falsification and governed decisions.",\n    )\n    header(\n        parts,\n        "Scientific AI reasoning loop",\n        "AI proposes; evidence, invariants and falsification decide",\n        eyebrow="AI FOR PROCESS SCIENCE",\n        accent=CYAN,\n    )\n    nodes = [\n        (76, 236, 190, 116, "OBSERVE", "plant, lab and literature evidence", BLUE, "database"),\n        (316, 196, 190, 116, "HYPOTHESIZE", "mechanisms, states and closure terms", PURPLE, "molecule"),\n        (696, 196, 190, 116, "SIMULATE", "reference kernels and scale bridges", CYAN, "cpu"),\n        (936, 236, 190, 116, "FALSIFY", "balances, residuals and conflicts", RED, "shield"),\n        (696, 474, 190, 116, "QUALIFY", "uncertainty, applicability and Gate", AMBER, "chart"),\n        (316, 474, 190, 116, "DECIDE", "experiment, model or package action", GREEN, "flow"),\n    ]\n    centers = []\n    for x, y, width, height, title_value, detail, color, icon in nodes:\n        node_card(\n            parts,\n            x,\n            y,\n            width,\n            height,\n            title_value,\n            detail,\n            color,\n            icon=icon,\n            tag="TRACEABLE",\n            title_size=15,\n        )\n        centers.append((x + width / 2, y + height / 2))\n    sequence = centers + [centers[0]]\n    for (x1, y1), (x2, y2) in zip(sequence, sequence[1:]):\n        parts.append(line(x1, y1, x2, y2, stroke=DIM, width=2.2, arrow=True, opacity=0.9))\n    parts.extend(\n        [\n            circle(601, 387, 88, fill="#0C1A2C", stroke=f"{CYAN}AA", width=2),\n            text(601, 369, "TSAO", size=26, fill=TEXT, weight=800, anchor="middle"),\n            text(601, 397, "reasoning core", size=15, fill=CYAN, weight=700, anchor="middle"),\n            multiline(\n                601,\n                426,\n                "No silent promotion\\nHOLD is a valid result",\n                width_chars=22,\n                size=13,\n                fill=MUTED,\n                weight=600,\n                anchor="middle",\n                line_height=19,\n            ),\n            pill(464, 646, "EVIDENCE \u2192 MODEL \u2192 TEST \u2192 DECISION", TEAL, width=274, height=30, mono=True),\n        ]\n    )\n    return finish(parts)\n\n\ndef render_multiscale_digital_thread() -> str:\n    parts = svg_start(\n        "Multiscale digital thread",\n        "A governed data and model thread from molecular evidence through reactors to process-package decisions.",\n    )\n    header(\n        parts,\n        "Multiscale digital thread",\n        "Every scale carries units, provenance, assumptions and uncertainty",\n        eyebrow="MECHANISM TO PROCESS PACKAGE",\n        accent=PURPLE,\n    )\n    stages = [\n        (56, "MOLECULE", "electronic structure\\nand active sites", PURPLE, "molecule"),\n        (278, "CHAIN", "kinetics, sequence\\nand distributions", BLUE, "flow"),\n        (500, "MESOSCALE", "phase, rheology\\nand transport", CYAN, "chart"),\n        (722, "REACTOR", "balances, mixing\\nand heat removal", ORANGE, "cpu"),\n        (944, "PACKAGE", "controls, HSE\\nand acceptance", GREEN, "shield"),\n    ]\n    for index, (x, title_value, detail, color, icon) in enumerate(stages):\n        node_card(\n            parts,\n            x,\n            248,\n            196,\n            174,\n            title_value,\n            detail,\n            color,\n            icon=icon,\n            tag=f"L{index}",\n            title_size=16,\n        )\n        if index < len(stages) - 1:\n            parts.append(\n                line(\n                    x + 196,\n                    335,\n                    stages[index + 1][0] - 12,\n                    335,\n                    stroke=color,\n                    width=2.5,\n                    arrow=True,\n                    opacity=0.9,\n                )\n            )\n    parts.append(rect(86, 486, 1028, 122, fill="#0B182A", stroke=f"{TEAL}66", radius=24))\n    parts.append(text(112, 524, "DIGITAL THREAD CONTRACT", size=15, fill=TEAL, weight=800, letter=0.8))\n    contract = [\n        ("state", "named variables"),\n        ("units", "dimensional closure"),\n        ("source", "evidence lineage"),\n        ("model", "equations + domain"),\n        ("uncertainty", "intervals + sensitivity"),\n        ("gate", "PASS / HOLD / FAIL"),\n    ]\n    x_positions = [112, 272, 432, 592, 752, 944]\n    for x, (label, value) in zip(x_positions, contract):\n        parts.append(text(x, 558, label.upper(), size=11, fill=DIM, weight=700, mono=True))\n        parts.append(text(x, 585, value, size=13, fill=TEXT, weight=600))\n    parts.append(pill(431, 646, "NO SCALE JUMP WITHOUT A CONTRACT", PURPLE, width=338, height=30, mono=True))\n    return finish(parts)\n\n\ndef render_agentic_qualification_orchestrator() -> str:\n    parts = svg_start(\n        "Agentic qualification orchestrator",\n        "An AI agent coordinates evidence retrieval, scientific kernels and independent verification without overriding qualification gates.",\n    )\n    header(\n        parts,\n        "Agentic qualification orchestrator",\n        "Automation executes the protocol; independent Gates retain authority",\n        eyebrow="AGENT CONTROL PLANE",\n        accent=BLUE,\n    )\n    for y, title_value, detail, color, icon in [\n        (220, "EVIDENCE", "sources, conflicts,\\nconditions and units", TEAL, "database"),\n        (374, "MODELS", "contracts, kernels,\\nsolvers and simulators", PURPLE, "cpu"),\n        (500, "REQUEST", "scope, CQA,\\nrisk and acceptance", BLUE, "flow"),\n    ]:\n        node_card(parts, 58, y, 236, 116, title_value, detail, color, icon=icon, title_size=16)\n        parts.append(line(294, y + 58, 450, 387, stroke=color, width=2.2, arrow=True))\n    parts.extend(\n        [\n            circle(600, 387, 126, fill="#0C1B30", stroke=f"{BLUE}AA", width=2.2),\n            circle(600, 387, 96, fill="#10243D", stroke=f"{CYAN}66", width=1.4),\n            text(600, 352, "AI", size=42, fill=TEXT, weight=900, anchor="middle"),\n            text(600, 387, "ORCHESTRATOR", size=15, fill=CYAN, weight=800, anchor="middle", letter=1.0),\n            multiline(\n                600,\n                421,\n                "route \u00b7 execute \u00b7 compare\\nrecord \u00b7 explain",\n                width_chars=24,\n                size=13,\n                fill=MUTED,\n                weight=600,\n                anchor="middle",\n                line_height=20,\n            ),\n        ]\n    )\n    gates = [\n        (906, 210, "BALANCE", "mass / energy", GREEN),\n        (906, 322, "NUMERICS", "stability / parity", CYAN),\n        (906, 434, "EVIDENCE", "lineage / conflict", AMBER),\n        (906, 546, "APPROVAL", "named authority", RED),\n    ]\n    for x, y, title_value, detail, color in gates:\n        node_card(parts, x, y, 238, 82, title_value, detail, color, icon="shield", title_size=15)\n        parts.append(line(726, 387, x - 14, y + 41, stroke=color, width=2.1, arrow=True))\n    parts.append(pill(416, 660, "AGENT OUTPUT \u2260 ENGINEERING APPROVAL", RED, width=370, height=30, mono=True))\n    return finish(parts)\n\n\ndef render_uncertainty_decision_landscape() -> str:\n    parts = svg_start(\n        "Uncertainty to decision landscape",\n        "A qualification landscape showing how uncertainty, applicability and independent evidence determine PASS, HOLD or FAIL.",\n    )\n    header(\n        parts,\n        "Uncertainty-to-decision landscape",\n        "Precision is not confidence; confidence is earned through independent closure",\n        eyebrow="DECISION SCIENCE",\n        accent=AMBER,\n    )\n    parts.extend(\n        [\n            rect(72, 226, 330, 360, fill="#101D31", stroke=f"{PURPLE}66", radius=28, shadow=True),\n            rect(435, 226, 330, 360, fill="#101D31", stroke=f"{CYAN}66", radius=28, shadow=True),\n            rect(798, 226, 330, 360, fill="#101D31", stroke=f"{GREEN}66", radius=28, shadow=True),\n            text(102, 270, "1 \u00b7 UNCERTAINTY", size=18, fill=PURPLE, weight=800),\n            text(465, 270, "2 \u00b7 APPLICABILITY", size=18, fill=CYAN, weight=800),\n            text(828, 270, "3 \u00b7 DECISION GATE", size=18, fill=GREEN, weight=800),\n        ]\n    )\n    uncertainty_rows = [\n        ("parameter", "identified / prior / nuisance"),\n        ("model form", "candidate closures and bias"),\n        ("numerical", "tolerance, stiffness, drift"),\n        ("measurement", "noise, censoring, calibration"),\n    ]\n    for index, (label, value) in enumerate(uncertainty_rows):\n        y = 316 + index * 62\n        parts.append(pill(102, y - 20, label.upper(), PURPLE, width=104, height=25, mono=True))\n        parts.append(text(220, y, value, size=13, fill=TEXT, weight=600))\n    applicability_rows = [\n        ("domain", "temperature \u00b7 pressure \u00b7 composition"),\n        ("scale", "lab \u00b7 pilot \u00b7 plant"),\n        ("regime", "phase \u00b7 transport \u00b7 kinetics"),\n        ("evidence", "direct \u00b7 inferred \u00b7 missing"),\n    ]\n    for index, (label, value) in enumerate(applicability_rows):\n        y = 316 + index * 62\n        parts.append(pill(465, y - 20, label.upper(), CYAN, width=96, height=25, mono=True))\n        parts.append(text(575, y, value, size=13, fill=TEXT, weight=600))\n    gate_rows = [\n        ("PASS", "declared gate closed", GREEN),\n        ("HOLD", "evidence incomplete", AMBER),\n        ("FAIL", "contract violated", RED),\n        ("NOT EVALUATED", "no qualified claim", DIM),\n    ]\n    for index, (label, value, color) in enumerate(gate_rows):\n        y = 306 + index * 65\n        parts.append(rect(832, y, 264, 48, fill=f"{color}14", stroke=f"{color}88", radius=14))\n        parts.append(text(850, y + 30, label, size=13, fill=color, weight=800, mono=True))\n        parts.append(text(972, y + 30, value, size=12, fill=TEXT, weight=600, anchor="middle"))\n    parts.extend(\n        [\n            line(402, 406, 435, 406, stroke=PURPLE, width=3, arrow=True),\n            line(765, 406, 798, 406, stroke=CYAN, width=3, arrow=True),\n            pill(394, 642, "TRACEABILITY MAKES UNCERTAINTY ACTIONABLE", AMBER, width=412, height=30, mono=True),\n        ]\n    )\n    return finish(parts)\n\n'


          def replace_all(path: str, replacements: dict[str, str]) -> None:
              target = ROOT / path
              text = target.read_text(encoding="utf-8")
              for old, new in replacements.items():
                  if old not in text and new not in text:
                      raise SystemExit(f"{path}: missing replacement anchor {old!r}")
                  text = text.replace(old, new)
              target.write_text(text, encoding="utf-8")


          def insert_after(path: str, anchor: str, addition: str, marker: str) -> None:
              target = ROOT / path
              text = target.read_text(encoding="utf-8")
              if marker in text:
                  return
              if text.count(anchor) != 1:
                  raise SystemExit(f"{path}: expected one insertion anchor, found {text.count(anchor)}")
              target.write_text(text.replace(anchor, anchor + addition, 1), encoding="utf-8")


          # 1. Repair the main CI contract: only main, cancel superseded runs, and use an explicit
          # versioned performance baseline rather than the moving HEAD^ assumption.
          ci_path = ROOT / ".github/workflows/ci.yml"
          ci = ci_path.read_text(encoding="utf-8")
          ci = ci.replace(
              "on:\n  push:\n  pull_request:\n  workflow_dispatch:\n",
              "on:\n  push:\n    branches: [main]\n  pull_request:\n    branches: [main]\n  workflow_dispatch:\n",
          )
          ci = ci.replace(
              "permissions:\n  contents: read\n\nconcurrency:",
              "permissions:\n  contents: read\n\nenv:\n"
              '  PERFORMANCE_BASELINE_COMMIT: "8719e59140202aae53cdfb80239b80dedad6767a"\n\n'
              "concurrency:",
          )
          ci = ci.replace("  cancel-in-progress: false", "  cancel-in-progress: true", 1)
          old_baseline = """          parent_commit="$(git rev-parse HEAD^)"
                    test "$parent_commit" = "8719e59140202aae53cdfb80239b80dedad6767a"
                    git worktree add --detach "$baseline_root" "$parent_commit"
          """
          new_baseline = """          baseline_commit="${PERFORMANCE_BASELINE_COMMIT}"
                    git cat-file -e "${baseline_commit}^{commit}"
                    git merge-base --is-ancestor "$baseline_commit" HEAD
                    git worktree add --detach "$baseline_root" "$baseline_commit"
          """
          if new_baseline not in ci:
              if ci.count(old_baseline) != 1:
                  raise SystemExit("ci.yml: performance baseline anchor mismatch")
              ci = ci.replace(old_baseline, new_baseline, 1)
          ci_path.write_text(ci, encoding="utf-8")

          # 2. Extend the governed master SVG generator with four AI-for-science illustrations.
          generator_path = ROOT / "scripts/generate_uiux_readme_assets.py"
          generator = generator_path.read_text(encoding="utf-8")
          renderer_marker = "def render_ai_scientific_reasoning_loop() -> str:"
          if renderer_marker not in generator:
              anchor = "\nASSETS = {\n"
              if generator.count(anchor) != 1:
                  raise SystemExit("master README generator: ASSETS anchor mismatch")
              generator = generator.replace(anchor, "\n\n" + AI_RENDERERS + "ASSETS = {\n", 1)
          asset_entries = """    "ai-scientific-reasoning-loop.svg": render_ai_scientific_reasoning_loop,
              "multiscale-digital-thread.svg": render_multiscale_digital_thread,
              "agentic-qualification-orchestrator.svg": render_agentic_qualification_orchestrator,
              "uncertainty-decision-landscape.svg": render_uncertainty_decision_landscape,
          """
          if '"ai-scientific-reasoning-loop.svg"' not in generator:
              generator = generator.replace("ASSETS = {\n", "ASSETS = {\n" + asset_entries, 1)
          generator_path.write_text(generator, encoding="utf-8")

          # 3. Synchronize inventory, tests and Wheel member contracts from 21 to 25 assets.
          replace_all(
              "tsao/skillpacks.py",
              {"README_ASSET_MINIMUM = 21": "README_ASSET_MINIMUM = 25"},
          )
          replace_all(
              "tests/test_readme_assets.py",
              {"== 21": "== 25"},
          )
          replace_all(
              "tests/test_skillpack_delivery.py",
              {">= 21": ">= 25", "== 21": "== 25"},
          )
          replace_all(
              "scripts/sync_readme_visuals.py",
              {
                  "all 21 README diagrams": "all 25 README diagrams",
                  "all 21 diagrams": "all 25 diagrams",
                  "全部 21 幅 README 图": "全部 25 幅 README 图",
                  "全部 21 幅图": "全部 25 幅图",
              },
          )
          wheel_path = ROOT / "scripts/verify_wheel_contents.py"
          wheel = wheel_path.read_text(encoding="utf-8")
          if '"ai-scientific-reasoning-loop.svg"' not in wheel:
              wheel = wheel.replace(
                  "_README_ASSETS = (\n",
                  '_README_ASSETS = (\n    "agentic-qualification-orchestrator.svg",\n'
                  '    "ai-scientific-reasoning-loop.svg",\n',
                  1,
              )
              wheel = wheel.replace(
                  '    "main-only-delivery-lifecycle.svg",\n',
                  '    "main-only-delivery-lifecycle.svg",\n    "multiscale-digital-thread.svg",\n',
                  1,
              )
              wheel = wheel.replace(
                  '    "universal-process-package.svg",\n',
                  '    "uncertainty-decision-landscape.svg",\n    "universal-process-package.svg",\n',
                  1,
              )
          wheel_path.write_text(wheel, encoding="utf-8")

          # 4. Add the same four governed figures and exact boundary language to both READMEs.
          replace_all(
              "README.md",
              {
                  "all 21 README diagrams": "all 25 README diagrams",
                  "all 21 diagrams;": "all 25 diagrams;",
              },
          )
          insert_after(
              "README.md",
              "![TSAO Process Intelligence OS overview](docs/assets/readme/tsao-process-intelligence-os.svg)\n",
              """
          \n## Scientific AI operating loop

          ![Scientific AI reasoning loop](docs/assets/readme/ai-scientific-reasoning-loop.svg)

          TSAO uses AI as a governed scientific orchestrator rather than an approval engine. It can connect evidence, propose mechanisms, execute reference models and design falsification tests; balances, applicability, uncertainty and named engineering authorities still determine the Gate.
          """,
              "docs/assets/readme/ai-scientific-reasoning-loop.svg",
          )
          insert_after(
              "README.md",
              "![Layered process-package architecture](docs/assets/readme/process-package-architecture.svg)\n",
              """
          \n### Multiscale digital thread

          ![Multiscale digital thread](docs/assets/readme/multiscale-digital-thread.svg)

          The digital thread carries state definitions, units, evidence lineage, model domains, uncertainty and decision status from molecular interactions to the process package. A numerical hand-off without these contracts is treated as a broken scale bridge.
          """,
              "docs/assets/readme/multiscale-digital-thread.svg",
          )
          insert_after(
              "README.md",
              "Alpha.14 binds every A2 reaction channel to a strict calculated-reference rate package and exposes a structured A3 RHS. Alpha.15 adds an opt-in Dormand–Prince 5(4) integrator with explicit error control, non-negative-state rejection, restart parity, monotonic-time checks and internal/external conservation ledgers. The original A3 reference Euler path remains unchanged; missing bindings, non-identifiable parameters, applicability violations, suspected stiffness and minimum-step exhaustion return machine-readable `HOLD` or `FAIL`.\n",
              """
          \n![Agentic qualification orchestrator](docs/assets/readme/agentic-qualification-orchestrator.svg)

          The orchestrator may route tools and compare outputs, but it cannot overwrite a failed balance, missing evidence, unresolved numerical instability or an absent named approval.
          """,
              "docs/assets/readme/agentic-qualification-orchestrator.svg",
          )
          insert_after(
              "README.md",
              "![Evidence and qualification gates](docs/assets/readme/evidence-gate-system.svg)\n",
              """
          \n![Uncertainty-to-decision landscape](docs/assets/readme/uncertainty-decision-landscape.svg)

          Parameter, model-form, numerical and measurement uncertainty are separated from applicability limits. A precise-looking result outside its domain remains `HOLD` or `NOT_EVALUATED`.
          """,
              "docs/assets/readme/uncertainty-decision-landscape.svg",
          )
          insert_after(
              "README.md",
              "Performance claims are versioned software evidence, not engineering or industrial qualification. Alpha.15 qualification benchmarks the exact Alpha.14 parent and Alpha.15 candidate on the same runner and Python runtime; the frozen Alpha.10 file is retained only for non-blocking historical trend evidence. The release harness uses `timeit.repeat` medians for timing, `cProfile` for hotspot attribution and SHA-256 result digests to reject numerical drift.\n",
              """
          \nThe blocking baseline is declared by `PERFORMANCE_BASELINE_COMMIT` and verified as an ancestor of the candidate. It is never inferred from `HEAD^`, so documentation or supply-chain commits cannot silently invalidate the performance Gate.
          """,
              "PERFORMANCE_BASELINE_COMMIT",
          )

          replace_all(
              "README.zh-CN.md",
              {
                  "全部 21 幅 README 图": "全部 25 幅 README 图",
                  "全部 21 幅图；": "全部 25 幅图；",
              },
          )
          insert_after(
              "README.zh-CN.md",
              "![TSAO 工艺智能操作系统总览](docs/assets/readme/tsao-process-intelligence-os.svg)\n",
              """
          \n## 科学 AI 运行闭环

          ![科学 AI 推理闭环](docs/assets/readme/ai-scientific-reasoning-loop.svg)

          TSAO 将 AI 定位为受治理的科学编排器，而不是审批机器。它可以连接证据、提出机理、执行参考模型并设计证伪试验；物料与能量衡算、适用域、不确定度以及具名工程责任人仍然决定最终 Gate。
          """,
              "docs/assets/readme/ai-scientific-reasoning-loop.svg",
          )
          insert_after(
              "README.zh-CN.md",
              "![分层工艺包架构](docs/assets/readme/process-package-architecture.svg)\n",
              """
          \n### 多尺度数字主线

          ![多尺度数字主线](docs/assets/readme/multiscale-digital-thread.svg)

          数字主线把状态定义、单位、证据谱系、模型适用域、不确定度和决策状态从分子相互作用一直带到工艺包。缺少这些合同的数值传递必须视为尺度桥断裂。
          """,
              "docs/assets/readme/multiscale-digital-thread.svg",
          )
          insert_after(
              "README.zh-CN.md",
              "Alpha.14 为每个 A2 反应通道绑定严格的参考级速率参数包，并提供结构化 A3 RHS。Alpha.15 新增独立、可选的 Dormand–Prince 5(4) 自适应积分器，具有显式误差控制、非负状态拒绝、分段重启一致性、时间单调性和内外部守恒账本。原 A3 参考 Euler 路径保持不变；缺失绑定、不可辨识参数、适用域越界、疑似刚性和最小步长耗尽均返回机器可读的 `HOLD` 或 `FAIL`。\n",
              """
          \n![智能体资格编排器](docs/assets/readme/agentic-qualification-orchestrator.svg)

          编排器可以调度工具并比较结果，但不能覆盖衡算失败、证据缺失、数值不稳定或具名审批缺位。
          """,
              "docs/assets/readme/agentic-qualification-orchestrator.svg",
          )
          insert_after(
              "README.zh-CN.md",
              "![证据与资格门](docs/assets/readme/evidence-gate-system.svg)\n",
              """
          \n![不确定度到决策地形](docs/assets/readme/uncertainty-decision-landscape.svg)

          参数、模型形式、数值与测量不确定度必须和适用域限制分别记录。即使结果看起来非常精确，只要超出适用域，仍只能是 `HOLD` 或 `NOT_EVALUATED`。
          """,
              "docs/assets/readme/uncertainty-decision-landscape.svg",
          )
          insert_after(
              "README.zh-CN.md",
              "性能结论属于版本化的软件证据，不等于工程或工业资格。发布基准使用 `timeit.repeat` 中位数计时、`cProfile` 定位热点，并用结果 SHA-256 拒绝任何数值漂移。\n",
              """
          \n阻断式性能基线由 `PERFORMANCE_BASELINE_COMMIT` 显式声明，并核验其确为候选提交的祖先；不再使用 `HEAD^` 推断，因此文档或供应链提交不会使性能门禁自毁。
          """,
              "PERFORMANCE_BASELINE_COMMIT",
          )

          # 5. Persist the added visual layer and regression rule.
          visual_path = ROOT / "docs/README_VISUAL_SYSTEM.md"
          visual = visual_path.read_text(encoding="utf-8")
          visual_section = """
          ## AI scientific illustration layer

          The master generator now owns 25 deterministic, repository-local SVG figures. Four AI-for-science views extend the existing Scientific Midnight Bento system:

          - `ai-scientific-reasoning-loop.svg`: evidence → hypothesis → simulation → falsification → qualification → decision;
          - `multiscale-digital-thread.svg`: molecular evidence through chain, mesoscale, reactor and package contracts;
          - `agentic-qualification-orchestrator.svg`: tool orchestration separated from independent qualification authority;
          - `uncertainty-decision-landscape.svg`: uncertainty, applicability and PASS/HOLD/FAIL/NOT_EVALUATED outcomes.

          These are explanatory illustrations, not experimental evidence or engineering approval. Every figure is generated by `scripts/generate_uiux_readme_assets.py`, stored locally, has SVG title/description metadata and is checked for deterministic regeneration.
          """
          if "## AI scientific illustration layer" not in visual:
