          python - <<'PY'
          from __future__ import annotations

          import subprocess
          from pathlib import Path

          from scripts.update_source_overlay import update_overlay

          root = Path.cwd()
          raw = subprocess.check_output(["git", "status", "--porcelain=v1", "-z"])
          changed: list[str] = []
          for entry in raw.decode("utf-8").split("\0"):
              if not entry:
                  continue
              path = entry[3:]
              if " -> " in path:
                  path = path.rsplit(" -> ", 1)[-1]
              if path in {
                  ".github/workflows/main-repair-once.yml",
                  "reports/SOURCE_CORE_OVERLAY.tsv",
              }:
                  continue
              if (root / path).is_file():
                  changed.append(path)
          if not changed:
              raise SystemExit("no repair paths found for source overlay")
          print("updating source overlay for:")
          for path in sorted(changed):
              print(f"  - {path}")
          update_overlay(root, sorted(changed))
