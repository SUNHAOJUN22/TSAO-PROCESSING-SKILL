name: Capture alpha10 extended performance baseline once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  baseline:
    if: ${{ contains(github.event.head_commit.message, '[PERF-V2-BASELINE]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install baseline environment
        run: |
          python -m pip install --quiet -e .[dev]
          python -m pip check
          python -c "import pathlib, shutil; [shutil.rmtree(path) for path in pathlib.Path('.').glob('*.egg-info') if path.is_dir()]"
      - name: Prepare exact alpha10 benchmark worktree
        run: |
          rm .github/workflows/performance-v2-baseline-once.yml
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
          rm -rf wheelhouse build dist
          python -m pip wheel --no-deps --no-build-isolation . -w wheelhouse
      - name: Capture expanded baseline
        run: |
          python scripts/benchmark_performance.py \
            --repeats 5 \
            --wheel-dir wheelhouse \
            --output reports/PERFORMANCE_BASELINE_ALPHA10_EXTENDED.json
      - name: Commit baseline evidence only
        run: |
          git checkout -- .github/workflows/performance-v2-baseline-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/PERFORMANCE_BASELINE_ALPHA10_EXTENDED.json
          git commit -m 'perf: record alpha10 extended baseline [skip ci]'
          git push origin HEAD:main
