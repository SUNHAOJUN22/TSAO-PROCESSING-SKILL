name: Diagnose alpha11 release transformation once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ contains(github.event.head_commit.message, '[ALPHA11-TRANSFORM-DIAG]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Apply and diagnose release transformation
        shell: bash
        run: |
          set +e
          LOG=/tmp/alpha11-transform-diagnostic.txt
          : > "$LOG"
          step() {
            echo "" >> "$LOG"
            echo "== $1 ==" >> "$LOG"
            shift
            "$@" >> "$LOG" 2>&1
            echo "exit=$?" >> "$LOG"
          }
          step install python -m pip install --quiet -e '.[dev]'
          step compile_apply python -m py_compile scripts/apply_alpha11_performance_release.py
          step apply python scripts/apply_alpha11_performance_release.py
          step placeholders python - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('reports/PERFORMANCE_OPTIMIZED_ALPHA11_CANDIDATE.json').read_text())
          source['version'] = '0.1.0-alpha.11'
          Path('reports/PERFORMANCE_OPTIMIZED_ALPHA11.json').write_text(json.dumps(source, indent=2) + '\n')
          comparison = json.loads(Path('reports/PERFORMANCE_COMPARISON_ALPHA11_CANDIDATE.json').read_text())
          comparison['optimized_version'] = '0.1.0-alpha.11'
          Path('reports/PERFORMANCE_COMPARISON_ALPHA11.json').write_text(json.dumps(comparison, indent=2) + '\n')
          PY
          step render python scripts/update_performance_readme.py --comparison reports/PERFORMANCE_COMPARISON_ALPHA11.json
          step graphics python scripts/generate_performance_readme_assets.py
          step targeted python -m pytest -q tests/test_release_metadata_alpha11.py tests/test_readme_assets.py tests/test_release_convergence.py tests/test_skillpack_delivery.py tests/test_wheel_contract.py
          step ruff python -m ruff check scripts/apply_alpha11_performance_release.py scripts/verify_wheel_contents.py tsao/skillpacks.py scripts/verify_wheel_runtime.py tests/test_release_metadata_alpha11.py tests/test_readme_assets.py tests/test_release_convergence.py
          git reset --hard HEAD
          cp "$LOG" reports/ALPHA11_TRANSFORM_DIAGNOSTIC.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/ALPHA11_TRANSFORM_DIAGNOSTIC.txt
          git commit -m 'diagnostic: capture alpha11 transform results [skip ci]'
          git push origin HEAD:main
