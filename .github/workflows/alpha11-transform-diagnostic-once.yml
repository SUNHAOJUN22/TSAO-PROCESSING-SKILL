name: Promote alpha11 performance release once

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'

concurrency:
  group: tsao-alpha11-performance-promotion
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  promote:
    if: ${{ github.event_name == 'schedule' || contains(github.event.head_commit.message, '[FINALIZE-ALPHA11]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Promote and qualify
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_BASE_SHA: 92150eac35ded7eb001a261c8a05e21de4e01070
        shell: bash
        run: |
          set -euo pipefail
          ORCHESTRATION_SHA="$(git rev-parse HEAD)"; export ORCHESTRATION_SHA
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          promotion_failure() {
            local status="$?"
            local failed_command="${BASH_COMMAND}"
            local failed_line="${BASH_LINENO[0]:-${LINENO}}"
            trap - ERR
            set +e
            if [[ -f reports/PERFORMANCE_COMPARISON_ALPHA11.json ]]; then
              cp reports/PERFORMANCE_COMPARISON_ALPHA11.json /tmp/alpha11-failure-comparison.json
            fi
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports
            {
              printf 'status=FAIL\n'
              printf 'audit_baseline=%s\n' "${AUDIT_BASE_SHA}"
              printf 'orchestration_commit=%s\n' "${ORCHESTRATION_SHA}"
              printf 'workflow_run_id=%s\n' "${GITHUB_RUN_ID}"
              printf 'workflow_run_attempt=%s\n' "${GITHUB_RUN_ATTEMPT}"
              printf 'failed_line=%s\n' "${failed_line}"
              printf 'failed_command=%s\n' "${failed_command}"
              printf 'exit_status=%s\n' "${status}"
              printf 'recorded_utc=%s\n' "$(date -u +%FT%TZ)"
              if [[ -f /tmp/alpha11-prepare.log ]]; then
                printf 'prepare_log_begin\n'
                cat /tmp/alpha11-prepare.log
                printf 'prepare_log_end\n'
              fi
            } > reports/ALPHA11_PROMOTION_FAILURE.txt
            if [[ -f /tmp/alpha11-failure-comparison.json ]]; then
              cp /tmp/alpha11-failure-comparison.json reports/ALPHA11_PROMOTION_FAILURE_COMPARISON.json
            fi
            git add reports/ALPHA11_PROMOTION_FAILURE.txt reports/ALPHA11_PROMOTION_FAILURE_COMPARISON.json 2>/dev/null || git add reports/ALPHA11_PROMOTION_FAILURE.txt
            git commit -m 'diagnostic: capture alpha11 promotion failure [skip ci]'
            git push origin HEAD:main
            exit "${status}"
          }
          trap promotion_failure ERR

          mkdir -p reports
          {
            printf 'status=RUNNING\n'
            printf 'audit_baseline=%s\n' "${AUDIT_BASE_SHA}"
            printf 'orchestration_commit=%s\n' "${ORCHESTRATION_SHA}"
            printf 'workflow_run_id=%s\n' "${GITHUB_RUN_ID}"
            printf 'workflow_run_attempt=%s\n' "${GITHUB_RUN_ATTEMPT}"
            printf 'started_utc=%s\n' "$(date -u +%FT%TZ)"
          } > reports/ALPHA11_PROMOTION_HEARTBEAT.txt
          git add reports/ALPHA11_PROMOTION_HEARTBEAT.txt
          git commit -m 'chore: record alpha11 promotion heartbeat [skip ci]' || true
          git push origin HEAD:main

          cp scripts/finalize_alpha11_once.py /tmp/finalize_alpha11_once.py
          python -m pip install --quiet -e '.[dev]'
          python scripts/normalize_alpha11_transform_once.py normalize
          set +e
          python /tmp/finalize_alpha11_once.py prepare 2>&1 | tee /tmp/alpha11-prepare.log
          prepare_status=${PIPESTATUS[0]}
          set -e
          if [[ ${prepare_status} -ne 0 ]]; then
            false
          fi
          python scripts/normalize_alpha11_transform_once.py restore
          rm -f scripts/normalize_alpha11_transform_once.py
          rm -f reports/ALPHA11_PROMOTION_HEARTBEAT.txt reports/ALPHA11_PROMOTION_FAILURE.txt reports/ALPHA11_PROMOTION_FAILURE_COMPARISON.json

          python scripts/update_performance_readme.py --comparison reports/PERFORMANCE_COMPARISON_ALPHA11.json
          python scripts/generate_readme_assets.py
          python scripts/generate_extended_readme_assets.py
          python scripts/generate_decision_readme_assets.py
          python scripts/generate_performance_readme_assets.py
          python scripts/generate_uiux_readme_assets.py
          python scripts/harden_readme_svg_accessibility.py
          python scripts/verify_readme_visual_accessibility.py
          python scripts/sync_readme_visuals.py
          python scripts/sync_readme_visuals.py --check
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest

          rm -rf build dist wheelhouse ./*.egg-info
          python -m pip wheel --no-deps --no-build-isolation . -w wheelhouse
          python scripts/verify_wheel_contents.py --wheel-dir wheelhouse
          python scripts/verify_wheel_runtime.py --wheel-dir wheelhouse
          python scripts/benchmark_performance_v2.py --repeats 5 --wheel-dir wheelhouse --output reports/PERFORMANCE_OPTIMIZED_ALPHA11.json
          python scripts/compare_performance_v2.py --baseline reports/PERFORMANCE_BASELINE_ALPHA10_EXTENDED.json --current reports/PERFORMANCE_OPTIMIZED_ALPHA11.json --output reports/PERFORMANCE_COMPARISON_ALPHA11.json
          python /tmp/finalize_alpha11_once.py stamp-performance
          python scripts/update_performance_readme.py --comparison reports/PERFORMANCE_COMPARISON_ALPHA11.json
          python scripts/generate_performance_readme_assets.py
          python scripts/harden_readme_svg_accessibility.py
          python scripts/verify_readme_visual_accessibility.py
          python scripts/sync_readme_visuals.py
          python scripts/sync_readme_visuals.py --check
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest

          python scripts/run_ci.py
          rm -rf build dist wheelhouse ./*.egg-info
          python -m pip wheel --no-deps --no-build-isolation . -w wheelhouse
          python scripts/verify_wheel_contents.py --wheel-dir wheelhouse > reports/runtime/ALPHA11_WHEEL_CONTENTS.json
          cat reports/runtime/ALPHA11_WHEEL_CONTENTS.json
          python scripts/verify_wheel_runtime.py --wheel-dir wheelhouse > reports/runtime/ALPHA11_WHEEL_RUNTIME.json
          cat reports/runtime/ALPHA11_WHEEL_RUNTIME.json
          python /tmp/finalize_alpha11_once.py record-local
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
          rm -rf build dist wheelhouse ./*.egg-info
          python -m pip wheel --no-deps --no-build-isolation . -w wheelhouse
          python scripts/verify_wheel_contents.py --wheel-dir wheelhouse
          python scripts/verify_wheel_runtime.py --wheel-dir wheelhouse
          python -m pytest -q tests/test_release_metadata_alpha11.py tests/test_repository_contracts.py tests/test_release_convergence.py tests/test_wheel_contract.py tests/test_performance_v2_numeric_parity.py
          python -m ruff check tsao skills scripts tests
          python -m tsao.cli doctor --root . --profile core
          python scripts/update_performance_readme.py --comparison reports/PERFORMANCE_COMPARISON_ALPHA11.json --check
          git diff --check
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l)" -eq 1
          test ! -e scripts/finalize_alpha11_once.py
          test ! -e scripts/normalize_alpha11_transform_once.py
          test ! -e reports/ALPHA11_PROMOTION_HEARTBEAT.txt
          test ! -e reports/ALPHA11_PROMOTION_FAILURE.txt
          test ! -e reports/ALPHA11_PROMOTION_FAILURE_COMPARISON.json
          test -z "$(find reports -maxdepth 1 -type f \( -name '*CANDIDATE*' -o -name '*DIAGNOSTIC*' -o -name 'PERFORMANCE_V2_*' \) -print)"
          rm -rf build dist wheelhouse ./*.egg-info
          find reports/runtime -maxdepth 1 -type f ! -name README.md -delete

          git add -A
          git commit -m 'release(perf): promote 0.1.0-alpha.11 with measured qualification'
          CANDIDATE_SHA="$(git rev-parse HEAD)"; export CANDIDATE_SHA
          git push origin HEAD:main

          dispatch_wait() {
            local sha="$1" label="$2" run_id="" info="" status="" conclusion=""
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" -f ref=main >/dev/null
            for _ in $(seq 1 180); do
              sleep 10
              run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=workflow_dispatch&branch=main&per_page=30" | TARGET_SHA="$sha" python -c "import json,os,sys; d=json.load(sys.stdin); print(next((str(r['id']) for r in d.get('workflow_runs',[]) if r.get('head_sha')==os.environ['TARGET_SHA']),''))")"
              [[ -n "$run_id" ]] && break
            done
            [[ -n "$run_id" ]] || { echo "missing $label run" >&2; return 1; }
            for _ in $(seq 1 720); do
              info="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
              status="$(printf '%s' "$info" | python -c "import json,sys; print(json.load(sys.stdin).get('status',''))")"
              [[ "$status" == completed ]] && break
              sleep 10
            done
            conclusion="$(printf '%s' "$info" | python -c "import json,sys; print(json.load(sys.stdin).get('conclusion',''))")"
            QUAL_RUN_URL="$(printf '%s' "$info" | python -c "import json,sys; print(json.load(sys.stdin).get('html_url',''))")"
            [[ "$conclusion" == success ]] || { echo "$label failed: $conclusion $QUAL_RUN_URL" >&2; return 1; }
            QUAL_RUN_ID="$run_id"; export QUAL_RUN_ID QUAL_RUN_URL
          }

          dispatch_wait "$CANDIDATE_SHA" candidate
          CANDIDATE_RUN_ID="$QUAL_RUN_ID"; CANDIDATE_RUN_URL="$QUAL_RUN_URL"
          export CANDIDATE_RUN_ID CANDIDATE_RUN_URL
          python /tmp/finalize_alpha11_once.py record-cross
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
          python -m tsao.cli doctor --root . --profile core
          python -m pytest -q tests/test_release_metadata_alpha11.py tests/test_repository_contracts.py tests/test_release_convergence.py tests/test_wheel_contract.py
          git add reports/ALPHA11_FINAL_QUALIFICATION.json reports/SOURCE_CORE_MANIFEST.tsv
          git commit -m 'chore(release): close alpha11 cross-platform qualification evidence'
          FINAL_SHA="$(git rev-parse HEAD)"; export FINAL_SHA
          git push origin HEAD:main
          dispatch_wait "$FINAL_SHA" final

          mkdir -p reports/runtime
          cat > reports/runtime/ALPHA11_PROMOTION_WORKFLOW.json <<JSON
          {"audit_baseline":"${AUDIT_BASE_SHA}","orchestration_commit":"${ORCHESTRATION_SHA}","candidate_commit":"${CANDIDATE_SHA}","candidate_run_id":${CANDIDATE_RUN_ID},"candidate_run_url":"${CANDIDATE_RUN_URL}","final_commit":"${FINAL_SHA}","final_run_id":${QUAL_RUN_ID},"final_run_url":"${QUAL_RUN_URL}","status":"PASS"}
          JSON
          trap - ERR
      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tsao-alpha11-promotion-${{ github.sha }}
          path: reports/runtime/ALPHA11_PROMOTION_WORKFLOW.json
          if-no-files-found: warn
          retention-days: 30
