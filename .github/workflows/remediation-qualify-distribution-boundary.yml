name: One-shot distribution boundary qualification

on:
  push:
    branches:
      - remediation/pep517-setup-bootstrap

permissions:
  contents: write

concurrency:
  group: processing-distribution-boundary-convergence
  cancel-in-progress: false

jobs:
  qualify-and-freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact Draft PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: remediation/pep517-setup-bootstrap
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install exact dependencies and package
        run: |
          python scripts/verify_dependency_lock.py requirements.lock --pyproject pyproject.toml
          python -m pip install --quiet --require-hashes -r requirements.lock
          python -m pip install --quiet --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Fold controlled distribution gate into canonical CI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/ci.yml')
          text = workflow.read_text(encoding='utf-8')
          marker = "      - name: Verify installed dependency graph\n        run: python -m pip check\n"
          addition = """      - name: Verify controlled registry blocks public artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        shell: bash
        run: |
          set -euo pipefail
          python -c \"from pathlib import Path; from tsao.distribution_policy import assert_public_distribution_allowed; kinds=('public source distribution','public wheel'); [(lambda kind: (_ for _ in ()).throw(SystemExit(f'{kind} was permitted while the registry remains controlled')) if not _blocked(Path.cwd(), kind, assert_public_distribution_allowed) else None)(kind) for kind in kinds]\"
      - name: Run distribution containment regressions
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_distribution_containment_v20.py
          tests/test_release_integrity_alpha6.py
          tests/test_main_only_ci_policy.py
          tests/test_public_distribution_boundary_workflow.py
"""
          # Replace the compact command above with a readable helper local to ci.yml.
          addition = addition.replace(
              "python -c \\\"from pathlib import Path; from tsao.distribution_policy import assert_public_distribution_allowed; kinds=('public source distribution','public wheel'); [(lambda kind: (_ for _ in ()).throw(SystemExit(f'{kind} was permitted while the registry remains controlled')) if not _blocked(Path.cwd(), kind, assert_public_distribution_allowed) else None)(kind) for kind in kinds]\\\"",
              "python - <<'PYBLOCK'\n          from pathlib import Path\n          from tsao.distribution_policy import assert_public_distribution_allowed\n\n          for artifact_kind in ('public source distribution', 'public wheel'):\n              try:\n                  assert_public_distribution_allowed(Path.cwd(), artifact_kind=artifact_kind)\n              except Exception as exc:\n                  message = str(exc)\n                  if 'CONTROLLED' not in message.upper() and 'BLOCK' not in message.upper():\n                      raise SystemExit(f'{artifact_kind} failed for an unrelated reason: {message}') from exc\n              else:\n                  raise SystemExit(f'{artifact_kind} was permitted while the registry remains controlled')\n          PYBLOCK",
          )
          if 'Verify controlled registry blocks public artifacts' not in text:
              if marker not in text:
                  raise SystemExit('canonical dependency marker not found')
              text = text.replace(marker, marker + addition, 1)
          workflow.write_text(text, encoding='utf-8')
          PY
          cat > tests/test_public_distribution_boundary_workflow.py <<'PY'
          from __future__ import annotations

          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          WORKFLOW = ROOT / '.github/workflows/ci.yml'


          def test_controlled_registry_is_part_of_the_single_authoritative_workflow() -> None:
              text = WORKFLOW.read_text(encoding='utf-8')
              assert sorted(path.name for path in (ROOT / '.github/workflows').glob('*.yml')) == ['ci.yml']
              assert 'contents: read' in text
              assert 'assert_public_distribution_allowed' in text
              assert 'public source distribution' in text
              assert 'public wheel' in text
              assert 'was permitted while the registry remains controlled' in text
              assert 'continue-on-error' not in text


          def test_canonical_ci_runs_distribution_containment_regressions() -> None:
              text = WORKFLOW.read_text(encoding='utf-8')
              assert 'tests/test_distribution_containment_v20.py' in text
              assert 'tests/test_release_integrity_alpha6.py' in text
              assert 'tests/test_main_only_ci_policy.py' in text
              assert 'tests/test_public_distribution_boundary_workflow.py' in text
          PY
          find .github/workflows -maxdepth 1 -type f ! -name ci.yml -delete
          python scripts/build_source_asset_manifest.py --root . --out reports/SOURCE_CORE_MANIFEST.tsv

      - name: Execute full repository qualification
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format setup.py tsao tests scripts
          python -m ruff check setup.py tsao tests scripts
          python -m ruff format --check setup.py tsao tests scripts
          python -m pytest -q -p no:cacheprovider
          python -m tsao.cli doctor --root . --profile core
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n')" = 'ci.yml'
          git diff --check

      - name: Commit exact review tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ci): enforce controlled distribution in canonical workflow'
          git push origin HEAD:remediation/pep517-setup-bootstrap
