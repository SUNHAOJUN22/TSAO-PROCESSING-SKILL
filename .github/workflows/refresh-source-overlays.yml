name: One-time source provenance refresh

on:
  push:
    branches: [main]
    paths: [.github/workflows/refresh-source-overlays.yml]

permissions:
  contents: write

concurrency:
  group: one-time-source-provenance-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install the exact qualification environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --require-hashes -r requirements.lock
          python -m pip install --quiet --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Recompute source identities and run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_source_overlay.py \
            skills/poe/estimation.py \
            tests/test_atomic_write_concurrency.py \
            tsao/_utils.py \
            --target reports/SOURCE_CORE_OVERLAY.tsv
          python scripts/update_source_overlay.py \
            tsao/_utils.py \
            --target reports/SOURCE_ACCEPTANCE_OVERLAY.tsv
          python -m pytest -q -p no:cacheprovider \
            tests/test_atomic_write_concurrency.py \
            skills/poe/tests/test_estimation_output_aliasing.py \
            skills/poe/tests/test_estimation_finite_boundaries.py \
            skills/poe/tests/test_estimation_regressions.py
          python -m tsao.cli doctor --root . --profile core
      - name: Publish the verified identities and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git diff -- reports/SOURCE_CORE_OVERLAY.tsv reports/SOURCE_ACCEPTANCE_OVERLAY.tsv)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/SOURCE_CORE_OVERLAY.tsv reports/SOURCE_ACCEPTANCE_OVERLAY.tsv
          git rm .github/workflows/refresh-source-overlays.yml
          git commit -m "fix: refresh verified source provenance overlays"
          git push origin HEAD:main
