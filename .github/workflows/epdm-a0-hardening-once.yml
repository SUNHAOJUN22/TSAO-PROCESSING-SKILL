name: Apply EPDM Phase A0 hardening once

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tsao-epdm-a0-hardening-once
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, '[APPLY-EPDM-A0-HARDENING]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install development environment
        run: python -m pip install --quiet -e .[dev]
      - name: Materialize strict contracts and remove temporary artifacts
        env:
          CASE_SCHEMA_GZIP_B64: 
          TEST_MODULE_GZIP_B64: 
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import os
          from pathlib import Path

          payloads = {
              Path('skills/epdm/schemas/epdm_case.schema.json'): os.environ['CASE_SCHEMA_GZIP_B64'],
              Path('skills/epdm/tests/test_epdm_phase_a0.py'): os.environ['TEST_MODULE_GZIP_B64'],
          }
          for path, encoded in payloads.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(gzip.decompress(base64.b64decode(encoded)))

          for path in (
              Path('.github/workflows/epdm-a0-finalize-once.yml'),
              Path('.github/workflows/epdm-a0-qualification-once.yml'),
              Path('.github/workflows/epdm-a0-hardening-once.yml'),
              Path('reports/EPDM_PHASE_A0_RUN_OBSERVATION.json'),
          ):
              path.unlink(missing_ok=True)
          PY
      - name: Verify intended file identities
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          from pathlib import Path

          expected = {
              'docs/EPDM_PHASE_A0_HARDENING_PLAN.md': 'b05704c123eab0512ba1dfb380f9f7415c1f4d56',
              'skills/epdm/SKILL.md': '94b3465e281547b101b3c41718209c086a696183',
              'skills/epdm/STATUS.md': '071a24300f532f329162eac8c3effd7fb116bb2f',
              'skills/epdm/fixtures/reference_cases.json': '3389712b43a0c8004817695ddf172591728a2277',
              'skills/epdm/fixtures/v1_api_contract.json': '2155d70c61975065d2587caa5fbb37dbce4f62b4',
              'skills/epdm/package_audit.py': '3ee15ec19d14ec2b285c02e4843a375f76ea3473',
              'skills/epdm/qualification.py': '89cebf58654ce66630f15016363e691c5807cdab',
              'skills/epdm/schemas/epdm_case.schema.json': '39a56189358f432a29b500bb83ce6cc882d4f6ab',
              'skills/epdm/schemas/epdm_package.schema.json': 'd205fb56ca465aeb184a831c469faecee71b837d',
              'skills/epdm/tests/test_epdm_phase_a0.py': '9faac94884d4fed07adbcd85bf3d62f4687be8f6',
          }
          for name, wanted in expected.items():
              data = Path(name).read_bytes()
              observed = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
              if observed != wanted:
                  raise SystemExit(f'{name}: expected {wanted}, observed {observed}')
          PY
      - name: Rebuild and verify final source identity
        run: |
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
          python -m tsao.cli doctor --root . --profile core
          python - <<'PY'
          import subprocess
          workflows = sorted(
              path
              for path in subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
              if path.startswith('.github/workflows/') and __import__('pathlib').Path(path).exists()
          )
          assert workflows == ['.github/workflows/ci.yml'], workflows
          PY
      - name: Full software qualification
        run: python scripts/run_ci.py
      - name: Skillpack, wheel and installed-runtime closure
        run: |
          python -m tsao.skillpacks --root .
          python -m tsao.cli package template --family "generic process"
          python -m pip wheel --no-deps --no-build-isolation . -w wheelhouse
          python scripts/verify_wheel_contents.py --wheel-dir wheelhouse
          python scripts/verify_wheel_runtime.py --wheel-dir wheelhouse
          python -m tsao.cli epdm status
          python -m tsao.cli epdm audit
          python -m tsao.cli epdm reference-demo
      - name: Commit clean hardened tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(epdm): harden Phase A0 evidence and repository closure'
          git push origin HEAD:main
