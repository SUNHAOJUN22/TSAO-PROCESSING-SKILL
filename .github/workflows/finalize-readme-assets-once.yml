name: Finalize README assets once

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tsao-finalize-readme-assets-once
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ contains(github.event.head_commit.message, '[FINALIZE-ASSETS]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --quiet -e .[dev]
      - name: Regenerate and verify all README graphics
        run: |
          python scripts/generate_readme_assets.py
          python scripts/generate_extended_readme_assets.py
          git diff --exit-code -- docs/assets/readme
      - name: Remove one-time workflow and refresh source identity
        run: |
          rm .github/workflows/finalize-readme-assets-once.yml
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
      - name: Full software qualification
        run: python scripts/run_ci.py
      - name: Specialist audits
        run: |
          python skills/epdm/scripts/audit_epdm.py
          python skills/poe/scripts/audit_p0.py --root .
          python skills/poe/scripts/audit_p1.py --root .
      - name: Wheel and installed-runtime verification
        run: |
          python -m pip wheel --no-deps --no-build-isolation . -w wheelhouse
          python scripts/verify_wheel_contents.py --wheel-dir wheelhouse
          python scripts/verify_wheel_runtime.py --wheel-dir wheelhouse
      - name: Commit finalized main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "final: seal twelve-diagram README and source identity"
          git push origin HEAD:main
