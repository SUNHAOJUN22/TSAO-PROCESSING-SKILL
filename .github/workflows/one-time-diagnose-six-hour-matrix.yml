          status="${{ job.status }}"
          head=$(git rev-parse HEAD 2>/dev/null || echo UNKNOWN)
          body=$(cat <<EOF
          SIX_HOUR_HARDENING_CONTROLLER_V2: **$status**

          - run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - branch: \`agent/six-hour-soak-hardening-20260809\`
          - head: \`$head\`

          The candidate separates timing from allocation tracing, restores generated performance evidence, deletes the one-time workflow from the candidate tree, validates YAML job structure and adds a fail-closed 21,600-second continuous qualification Gate.
