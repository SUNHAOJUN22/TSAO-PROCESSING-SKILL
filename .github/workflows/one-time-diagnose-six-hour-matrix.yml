name: One-time apply corrected six-hour hardening

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  apply-hardening:
    if: >-
      github.event.issue.number == 68 &&
      github.event.comment.body == '/apply-six-hour-hardening-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/six-hour-soak-hardening-20260809
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install exact locked environment
        run: |
          python scripts/verify_dependency_lock.py requirements.lock --pyproject pyproject.toml
          python -m pip install --quiet --require-hashes -r requirements.lock
          python -m pip install --quiet --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Reuse audited hardening patch with corrected YAML nesting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          source_commit = "6ecf4859324308c473f3be6e1ac78cb3fbdee858"
          source_path = ".github/workflows/one-time-diagnose-six-hour-matrix.yml"
          source = subprocess.check_output(
              ["git", "show", f"{source_commit}:{source_path}"],
              text=True,
          )
          workflow = yaml.load(source, Loader=yaml.BaseLoader)
          steps = workflow["jobs"]["apply-hardening"]["steps"]
          original = next(
              step["run"]
              for step in steps
              if step.get("name") == "Apply fail-closed hardening and six-hour gate"
          )
          needle = '''if "six-hour-soak-stage-1:" not in ci:
              ci = ci.rstrip() + "\\n\\n" + soak.rstrip() + "\\n"
          '''
          replacement = '''soak = textwrap.indent(soak, "  ")

          if "six-hour-soak-stage-1:" not in ci:
              ci = ci.rstrip() + "\\n\\n" + soak.rstrip() + "\\n"
          '''
          if needle not in original:
              raise SystemExit("audited controller insertion anchor was not found")
          corrected = original.replace(needle, replacement, 1)
          target = Path("/tmp/apply-six-hour-hardening-v3.sh")
          target.write_text(corrected, encoding="utf-8")
          PY
          bash /tmp/apply-six-hour-hardening-v3.sh
      - name: Commit and push candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: isolate acceptance metrics and add six-hour soak gate"
          git push origin HEAD:agent/six-hour-soak-hardening-20260809
      - name: Record controller result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="${{ job.status }}"
          head=$(git rev-parse HEAD 2>/dev/null || echo UNKNOWN)
          body=$(cat <<EOF
          SIX_HOUR_HARDENING_CONTROLLER_V3: **$status**

          - run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - branch: \`agent/six-hour-soak-hardening-20260809\`
          - head: \`$head\`
          - structural correction: generated soak jobs are indented beneath \`jobs:\`

          The controller retains the original fail-closed source, test, README and provenance changes. It does not lower any acceptance threshold.
          EOF
          )
          gh issue comment 68 --repo "$GITHUB_REPOSITORY" --body "$body"
