name: One-time apply corrected six-hour hardening

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  apply-hardening:
    if: >-
      github.event.issue.number == 68 &&
      github.event.comment.body == '/apply-six-hour-hardening-v5'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/six-hour-soak-hardening-20260809
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install exact locked environment
        run: |
          python scripts/verify_dependency_lock.py requirements.lock --pyproject pyproject.toml
          python -m pip install --quiet --require-hashes -r requirements.lock
          python -m pip install --quiet --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Apply audited patch with both workflow-string contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          source_commit = "912bf976ee5ea2234a1fc8dafd79f041c9a010fe"
          source_path = ".github/workflows/one-time-diagnose-six-hour-matrix.yml"
          source = subprocess.check_output(
              ["git", "show", f"{source_commit}:{source_path}"],
              text=True,
          )
          workflow = yaml.load(source, Loader=yaml.BaseLoader)
          steps = workflow["jobs"]["apply-hardening"]["steps"]
          original = next(
              step["run"]
              for step in steps
              if step.get("name")
              == "Reuse audited hardening patch with workflow-contract corrections"
          )
          anchor = "corrected = corrected.replace(permanent_install, soak_install)"
          addition = '''corrected = corrected.replace(permanent_install, soak_install)

          permanent_editable = (
              "python -m pip install --quiet --no-deps "
              "--no-build-isolation -e ."
          )
          soak_editable = (
              "python -m pip install --quiet --no-deps "
              "--no-build-isolation --editable ."
          )
          editable_count = corrected.count(permanent_editable)
          if editable_count != 2:
              raise SystemExit(
                  f"expected two soak editable installs, found {editable_count}"
              )
          corrected = corrected.replace(permanent_editable, soak_editable)'''
          if original.count(anchor) != 1:
              raise SystemExit("V4 editable-install insertion anchor is not unique")
          corrected_controller = original.replace(anchor, addition, 1)
          target = Path("/tmp/apply-six-hour-hardening-v5.sh")
          target.write_text(corrected_controller, encoding="utf-8")
          PY
          bash /tmp/apply-six-hour-hardening-v5.sh
      - name: Commit and push candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: isolate acceptance metrics and add six-hour soak gate"
          git push origin HEAD:agent/six-hour-soak-hardening-20260809
      - name: Record controller result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="${{ job.status }}"
          head=$(git rev-parse HEAD 2>/dev/null || echo UNKNOWN)
          body=$(cat <<EOF
          SIX_HOUR_HARDENING_CONTROLLER_V5: **$status**

          - run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - branch: \`agent/six-hour-soak-hardening-20260809\`
          - head: \`$head\`
          - hash-locked installs: preserved
          - editable installs: \`--no-deps --no-build-isolation\` preserved
          - permanent canonical command counts: unchanged

          No threshold or dependency-integrity Gate is lowered.
          EOF
          )
          gh issue comment 68 --repo "$GITHUB_REPOSITORY" --body "$body"
