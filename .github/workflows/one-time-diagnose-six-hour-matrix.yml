name: One-time diagnose remaining six-hour matrix failures

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  windows-epdm:
    if: >-
      github.event.issue.number == 68 &&
      github.event.comment.body == '/diagnose-six-hour-matrix-v2'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked environment
        shell: pwsh
        run: |
          python scripts/verify_dependency_lock.py requirements.lock --pyproject pyproject.toml
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Publish exact EPDM acceptance checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          import json
          from pathlib import Path
          from skills.epdm.acceptance import qualify_acceptance
          project = Path('skills/epdm/fixtures/v2_phase_a1_reference_project.json')
          rows = []
          for samples in (3, 5, 7):
              result = qualify_acceptance(project, load_samples=samples)
              rows.append({
                  'samples': samples,
                  'pass': result.pass_,
                  'checks': dict(result.checks),
                  'metrics': dict(result.metrics),
                  'errors': list(result.errors),
              })
          Path('windows-diagnostic.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2), encoding='utf-8')
          '@ | python -
          $payload = Get-Content windows-diagnostic.json -Raw
          $body = "WINDOWS_EPDM_DIAGNOSTIC run $env:GITHUB_RUN_ID`n```json`n$payload`n```"
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/issues/68/comments" -f body="$body"

  ubuntu-performance:
    if: >-
      github.event.issue.number == 68 &&
      github.event.comment.body == '/diagnose-six-hour-matrix-v2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked environment
        run: |
          python scripts/verify_dependency_lock.py requirements.lock --pyproject pyproject.toml
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Publish exact process-intelligence performance inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python scripts/validate_process_intelligence_performance.py --samples 160 > /tmp/performance.out 2>&1
          code=$?
          set -e
          python - <<'PY' > /tmp/source.out
          from pathlib import Path
          for candidate in Path('.').rglob('*.py'):
              text = candidate.read_text(encoding='utf-8', errors='ignore')
              if 'annual_duration_hours' in text:
                  print(f'--- {candidate.as_posix()} ---')
                  lines = text.splitlines()
                  for index, line in enumerate(lines, start=1):
                      if 'annual_duration_hours' in line:
                          lower = max(1, index - 8)
                          upper = min(len(lines), index + 8)
                          for cursor in range(lower, upper + 1):
                              print(f'{cursor}: {lines[cursor - 1]}')
          PY
          output=$(tail -c 12000 /tmp/performance.out)
          source=$(tail -c 18000 /tmp/source.out)
          body=$(printf 'UBUNTU314_PERFORMANCE_DIAGNOSTIC run %s exit %s\n```text\n%s\n%s\n```' "$GITHUB_RUN_ID" "$code" "$output" "$source")
          jq -n --arg body "$body" '{body:$body}' >/tmp/comment.json
          curl -fsSL -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/68/comments" \
            -d @/tmp/comment.json
