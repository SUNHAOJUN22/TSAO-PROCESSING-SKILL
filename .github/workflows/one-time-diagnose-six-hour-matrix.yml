name: One-time main-only acceptance hardening

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  apply-and-dispatch:
    if: >-
      github.event.issue.number == 68 &&
      github.event.comment.body == '/apply-main-only-acceptance-v6'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install exact locked environment
        run: |
          python scripts/verify_dependency_lock.py requirements.lock --pyproject pyproject.toml
          python -m pip install --quiet --require-hashes -r requirements.lock
          python -m pip install --quiet --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Apply root-cause code, regression, README and provenance fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import subprocess
          from pathlib import Path

          from tsao.provenance import canonical_identity, classify_path

          root = Path.cwd()

          acceptance_path = root / "skills/epdm/acceptance.py"
          acceptance = acceptance_path.read_text(encoding="utf-8")
          old_loader = '''def _loader_resource_metrics(project_path: Path, samples: int) -> tuple[float, int, str]:
              if isinstance(samples, bool) or not isinstance(samples, int) or samples < 1:
                  raise ValueError("samples must be a positive integer")
              timings: list[float] = []
              publications: list[str] = []
              tracemalloc.start()
              try:
                  for _ in range(samples):
                      start = time.perf_counter()
                      snapshot = load_canonical_project_file(project_path)
                      timings.append(time.perf_counter() - start)
                      publications.append(snapshot.publication_sha256)
                  _, peak = tracemalloc.get_traced_memory()
              finally:
                  tracemalloc.stop()
              if len(set(publications)) != 1:
                  raise ContractValidationError(
                      "canonical publication identity changed across repeated loads"
                  )
              timings.sort()
              median = timings[len(timings) // 2]
              return median, peak, publications[0]
          '''
          new_loader = '''def _loader_resource_metrics(project_path: Path, samples: int) -> tuple[float, int, str]:
              if isinstance(samples, bool) or not isinstance(samples, int) or samples < 1:
                  raise ValueError("samples must be a positive integer")
              timings: list[float] = []
              publications: list[str] = []

              # Keep wall-clock latency independent of allocation-tracing overhead.
              # This closes a platform-sensitive acceptance artifact on Windows while
              # retaining the original latency and peak-memory limits unchanged.
              for _ in range(samples):
                  start = time.perf_counter()
                  snapshot = load_canonical_project_file(project_path)
                  timings.append(time.perf_counter() - start)
                  publications.append(snapshot.publication_sha256)

              tracemalloc.start()
              try:
                  memory_snapshot = load_canonical_project_file(project_path)
                  publications.append(memory_snapshot.publication_sha256)
                  _, peak = tracemalloc.get_traced_memory()
              finally:
                  tracemalloc.stop()

              if len(set(publications)) != 1:
                  raise ContractValidationError(
                      "canonical publication identity changed across repeated loads"
                  )
              timings.sort()
              middle = len(timings) // 2
              if len(timings) % 2:
                  median = timings[middle]
              else:
                  median = (timings[middle - 1] + timings[middle]) / 2.0
              return median, peak, publications[0]
          '''
          if old_loader in acceptance:
              acceptance_path.write_text(
                  acceptance.replace(old_loader, new_loader, 1),
                  encoding="utf-8",
              )
          elif new_loader not in acceptance:
              raise SystemExit("acceptance resource-metric source drifted")

          test_path = root / "skills/epdm/tests/test_acceptance.py"
          tests = test_path.read_text(encoding="utf-8")
          import_anchor = "import pytest\n\nfrom skills.epdm.acceptance import ("
          import_replacement = (
              "import pytest\n\n"
              "from skills.epdm import acceptance as acceptance_module\n"
              "from skills.epdm.acceptance import ("
          )
          if "from skills.epdm import acceptance as acceptance_module" not in tests:
              if import_anchor not in tests:
                  raise SystemExit("acceptance test import anchor drifted")
              tests = tests.replace(import_anchor, import_replacement, 1)

          regression = '''\n\ndef test_loader_timing_is_isolated_from_tracemalloc(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              expected_publication = load_canonical_project_file(PROJECT).publication_sha256
              tracing = {"active": False}
              traced_loads: list[bool] = []
              original_loader = acceptance_module.load_canonical_project_file

              def tracked_loader(path: Path):
                  traced_loads.append(tracing["active"])
                  return original_loader(path)

              def start_tracing() -> None:
                  assert tracing["active"] is False
                  tracing["active"] = True

              def stop_tracing() -> None:
                  assert tracing["active"] is True
                  tracing["active"] = False

              def traced_memory() -> tuple[int, int]:
                  assert tracing["active"] is True
                  return 0, 1234

              monkeypatch.setattr(
                  acceptance_module,
                  "load_canonical_project_file",
                  tracked_loader,
              )
              monkeypatch.setattr(acceptance_module.tracemalloc, "start", start_tracing)
              monkeypatch.setattr(acceptance_module.tracemalloc, "stop", stop_tracing)
              monkeypatch.setattr(
                  acceptance_module.tracemalloc,
                  "get_traced_memory",
                  traced_memory,
              )

              median, peak, publication = acceptance_module._loader_resource_metrics(
                  PROJECT,
                  3,
              )

              assert traced_loads == [False, False, False, True]
              assert tracing["active"] is False
              assert median >= 0.0
              assert peak == 1234
              assert publication == expected_publication
          '''
          regression_anchor = "\n\ndef test_load_samples_must_be_positive() -> None:\n"
          if "test_loader_timing_is_isolated_from_tracemalloc" not in tests:
              if regression_anchor not in tests:
                  raise SystemExit("acceptance test insertion anchor drifted")
              tests = tests.replace(regression_anchor, regression + regression_anchor, 1)
          test_path.write_text(tests, encoding="utf-8")

          start_marker = "<!-- PERFORMANCE_RESULTS_START -->"
          end_marker = "<!-- PERFORMANCE_RESULTS_END -->"
          readme_specs = (
              (root / "README.md", "## Accepted performance evidence", "\n## Use strategy\n"),
              (root / "README.zh-CN.md", "## 已验收性能证据", "\n## 使用策略\n"),
          )
          for path, heading, anchor in readme_specs:
              text = path.read_text(encoding="utf-8")
              if start_marker not in text and end_marker not in text:
                  if anchor not in text:
                      raise SystemExit(f"README insertion anchor drifted: {path}")
                  block = f"\n{heading}\n\n{start_marker}\n{end_marker}\n"
                  text = text.replace(anchor, block + anchor, 1)
                  path.write_text(text, encoding="utf-8")
              elif text.count(start_marker) != 1 or text.count(end_marker) != 1:
                  raise SystemExit(f"README performance markers are inconsistent: {path}")

          subprocess.run(
              [
                  "python",
                  "scripts/update_performance_readme.py",
                  "--comparison",
                  "reports/PERFORMANCE_COMPARISON_ALPHA11.json",
              ],
              check=True,
          )

          controller = root / ".github/workflows/one-time-diagnose-six-hour-matrix.yml"
          controller.unlink()

          changed_paths = [
              "README.md",
              "README.zh-CN.md",
              "skills/epdm/acceptance.py",
              "skills/epdm/tests/test_acceptance.py",
          ]
          fields = [
              "path",
              "sha256",
              "bytes",
              "specialist",
              "artifact_class",
              "license_scope",
          ]

          def update_overlay(target: Path) -> None:
              records: dict[str, dict[str, object]] = {}
              with target.open(encoding="utf-8", newline="") as stream:
                  for row in csv.DictReader(stream, delimiter="\t"):
                      records[str(row["path"])] = dict(row)
              records.pop(
                  ".github/workflows/one-time-diagnose-six-hour-matrix.yml",
                  None,
              )
              for relative in changed_paths:
                  path = root / relative
                  digest, size = canonical_identity(path)
                  specialist, artifact_class, license_scope = classify_path(relative)
                  records[relative] = {
                      "path": relative,
                      "sha256": digest,
                      "bytes": size,
                      "specialist": specialist,
                      "artifact_class": artifact_class,
                      "license_scope": license_scope,
                  }
              with target.open("w", encoding="utf-8", newline="") as stream:
                  writer = csv.DictWriter(
                      stream,
                      fieldnames=fields,
                      delimiter="\t",
                      lineterminator="\n",
                  )
                  writer.writeheader()
                  writer.writerows(records[key] for key in sorted(records))

          update_overlay(root / "reports/SOURCE_CORE_OVERLAY.tsv")
          update_overlay(root / "reports/SOURCE_ACCEPTANCE_OVERLAY.tsv")
          PY
      - name: Validate candidate before publication
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          test "$(git ls-files '.github/workflows/*' | tr '\n' ' ')" = ".github/workflows/ci.yml "
          python -m compileall -q skills/epdm/acceptance.py skills/epdm/tests/test_acceptance.py
          python -m pytest -q -p no:cacheprovider skills/epdm/tests/test_acceptance.py
          python scripts/update_performance_readme.py \
            --comparison reports/PERFORMANCE_COMPARISON_ALPHA11.json \
            --check
          python -m tsao.cli doctor --root . --profile core
          python scripts/run_ci.py
          git diff --cached --check
      - name: Commit root-cause fix directly to main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: isolate EPDM acceptance timing from memory tracing"
          git push origin HEAD:main
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Dispatch permanent eight-matrix qualification
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          requested_epoch=$(date +%s)
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
          run_json=""
          for attempt in $(seq 1 24); do
            candidate=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --event workflow_dispatch \
              --limit 5 \
              --json databaseId,url,status,conclusion,headSha,createdAt 2>/dev/null || true)
            run_json=$(RUNS="$candidate" REQUESTED_EPOCH="$requested_epoch" python - <<'PY'
          import datetime as dt
          import json
          import os

          rows = json.loads(os.environ.get("RUNS") or "[]")
          requested = int(os.environ["REQUESTED_EPOCH"])
          for row in rows:
              stamp = int(
                  dt.datetime.fromisoformat(
                      row["createdAt"].replace("Z", "+00:00")
                  ).timestamp()
              )
              if stamp >= requested - 5:
                  print(json.dumps(row, separators=(",", ":")))
                  break
          PY
            )
            if [[ -n "$run_json" ]]; then
              break
            fi
            sleep 5
          done
          test -n "$run_json"
          RUN_JSON="$run_json" python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          row = json.loads(os.environ["RUN_JSON"])
          print(f"run_id={row['databaseId']}")
          print(f"run_url={row['url']}")
          print(f"run_status={row['status']}")
          print(f"head_sha={row['headSha']}")
          PY
      - name: Record main-only publication and qualification dispatch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.publish.outputs.commit_sha }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          RUN_URL: ${{ steps.dispatch.outputs.run_url }}
          RUN_STATUS: ${{ steps.dispatch.outputs.run_status }}
          RUN_HEAD: ${{ steps.dispatch.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh issue comment 68 --repo "$GITHUB_REPOSITORY" --body "MAIN_ONLY_ACCEPTANCE_V6: **${{ job.status }}**

- published main commit: \`${COMMIT_SHA:-UNPUBLISHED}\`
- permanent qualification run: ${RUN_URL:-UNRESOLVED}
- run id: \`${RUN_ID:-UNRESOLVED}\`
- run status: \`${RUN_STATUS:-UNRESOLVED}\`
- run head: \`${RUN_HEAD:-UNRESOLVED}\`
- temporary controller removed from the published tree
- permanent \`ci.yml\` was not modified

The acceptance limits, coverage thresholds, dependency lock and approval boundaries remain unchanged."
