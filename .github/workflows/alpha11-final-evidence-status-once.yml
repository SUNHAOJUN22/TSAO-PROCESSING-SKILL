name: Observe alpha11 final evidence once

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  observe:
    if: ${{ contains(github.event.head_commit.message, '[OBSERVE-ALPHA11-FINAL]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Record final evidence run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: "622062ebf895f268bc3520064ee3aa8cd8222c38"
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/alpha11-final-evidence-once.yml/runs?event=push&branch=main&per_page=20" > /tmp/runs.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          runs = json.loads(Path('/tmp/runs.json').read_text()).get('workflow_runs', [])
          run = next((item for item in runs if item.get('head_sha') == os.environ['TARGET_SHA']), None)
          if run is None:
              raise SystemExit('final evidence run not found')
          payload = {
              'schema': 'TSAO-ALPHA11-FINAL-EVIDENCE-STATUS-1',
              'run_id': run.get('id'),
              'head_sha': run.get('head_sha'),
              'status': run.get('status'),
              'conclusion': run.get('conclusion'),
              'run_url': run.get('html_url'),
          }
          Path('reports/ALPHA11_FINAL_EVIDENCE_STATUS.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/ALPHA11_FINAL_EVIDENCE_STATUS.json
          git commit -m 'diagnostic: record alpha11 final evidence status [skip ci]'
          git push origin HEAD:main
