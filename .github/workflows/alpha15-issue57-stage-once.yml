name: Stage exact Alpha15 Issue57 tree once

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tsao-alpha15-issue57-final-staging
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: alpha15-issue57-qualification
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Rebuild and stage qualified tree
        shell: bash
        run: |
          set -euo pipefail
          base='e4afd1cf838aeda9078f21021954b326fa0a8494'
          payload="$RUNNER_TEMP/alpha15-issue57.patch.gz.b64"
          patch="$RUNNER_TEMP/alpha15-issue57.patch"
          cp .github/issue57/alpha15-issue57.patch.gz.b64 "$payload"
          git reset --hard "$base"
          python - "$payload" "$patch" <<'PY'
          import base64
          import gzip
          import sys
          from pathlib import Path

          encoded = b"".join(Path(sys.argv[1]).read_bytes().split())
          compressed = base64.b64decode(encoded, validate=True)
          Path(sys.argv[2]).write_bytes(gzip.decompress(compressed))
          PY
          echo "a151f26a28f15656f1a08e872485c721df702d8dba37f21ce9bcc685514ab40b  $patch" | sha256sum --check --status
          git apply --check "$patch"
          git apply --whitespace=fix "$patch"
          python scripts/update_source_overlay.py --root . \
            CHANGELOG.md \
            skills/epdm/kinetics.py \
            skills/epdm/process.py \
            skills/epdm/tests/test_epdm_scalar_finite_hardening.py
          git diff --check
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)" = "ci.yml"
          test ! -e .github/issue57
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: stage qualified alpha15 Issue57 tree'
          test "$(git rev-parse HEAD^)" = "$base"
          git rev-parse HEAD | tee "$RUNNER_TEMP/alpha15-issue57-staging.commit"
          git rev-parse HEAD^{tree} | tee "$RUNNER_TEMP/alpha15-issue57-staging.tree"
          git push --force origin HEAD:refs/heads/alpha15-issue57-final-staging
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: alpha15-issue57-staging-identity
          path: |
            ${{ runner.temp }}/alpha15-issue57-staging.commit
            ${{ runner.temp }}/alpha15-issue57-staging.tree
          if-no-files-found: warn
          retention-days: 14
