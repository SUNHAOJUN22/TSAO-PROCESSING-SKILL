name: One-time refresh six-hour source overlay

on:
  push:
    branches: [main]
    paths:
      - .github/refresh-six-hour-source-overlay.trigger

permissions:
  contents: write

concurrency:
  group: tsao-processing-six-hour-source-overlay-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock
      - name: Install exact locked dependencies and package
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_dependency_lock.py requirements.lock --pyproject pyproject.toml
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Remove transport and refresh governed source overlay
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-refresh-six-hour-source-overlay.yml
          rm -f .github/refresh-six-hour-source-overlay.trigger
          python scripts/update_source_overlay.py \
            .github/workflows/ci.yml \
            README.md \
            README.zh-CN.md \
            docs/SIX_REPOSITORY_PARALLEL_6H_ACCEPTANCE_PROMPT.md \
            docs/localized-vision/process-intelligence-vision-en.svg \
            docs/localized-vision/process-intelligence-vision-zh.svg
      - name: Qualify repaired exact tree before publication
        shell: bash
        run: |
          set -euo pipefail
          python -m tsao.cli doctor --root . --profile core
          python scripts/run_ci.py
          python skills/epdm/scripts/audit_epdm.py
          python skills/poe/scripts/audit_p0.py --root .
          python skills/poe/scripts/audit_p1.py --root .
      - name: Publish repaired main tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: bind six-hour acceptance prompt and localized visuals to source provenance'
          git push origin HEAD:main
