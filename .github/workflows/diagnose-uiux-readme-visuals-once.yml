name: Diagnose UIUX README visuals once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ contains(github.event.head_commit.message, '[DIAG-UIUX-README]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Run exact diagnostic chain
        shell: bash
        run: |
          set +e
          LOG=/tmp/uiux-readme-visual-diagnostic.txt
          : > "$LOG"
          step() {
            echo "" >> "$LOG"
            echo "== $1 ==" >> "$LOG"
            shift
            "$@" >> "$LOG" 2>&1
            echo "exit=$?" >> "$LOG"
          }
          step install python -m pip install --quiet -e '.[dev]'
          step pip_check python -m pip check
          python -c "import pathlib, shutil; [shutil.rmtree(path) for path in pathlib.Path('.').glob('*.egg-info') if path.is_dir()]"
          step compile python -m py_compile scripts/apply_uiux_visual_contract.py scripts/generate_uiux_readme_assets.py scripts/sync_readme_visuals.py
          step apply python scripts/apply_uiux_visual_contract.py
          step legacy_base python scripts/generate_readme_assets.py
          step legacy_extended python scripts/generate_extended_readme_assets.py
          step legacy_decision python scripts/generate_decision_readme_assets.py
          step legacy_performance python scripts/generate_performance_readme_assets.py
          step uiux_master python scripts/generate_uiux_readme_assets.py
          step sync_readme python scripts/sync_readme_visuals.py
          step sync_check python scripts/sync_readme_visuals.py --check
          step svg_parse python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          paths = sorted(Path('docs/assets/readme').glob('*.svg'))
          assert len(paths) == 18, len(paths)
          for path in paths:
              root = ElementTree.parse(path).getroot()
              assert root.tag.endswith('svg')
              assert root.find('{http://www.w3.org/2000/svg}title') is not None
              assert root.find('{http://www.w3.org/2000/svg}desc') is not None
          print('parsed', len(paths), 'SVG assets')
          PY
          rm -f scripts/apply_uiux_visual_contract.py
          rm -f .github/workflows/finalize-uiux-readme-visuals-once.yml
          rm -f .github/workflows/diagnose-uiux-readme-visuals-once.yml
          step refresh_manifest python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
          step targeted python -m pytest -q tests/test_readme_assets.py tests/test_release_convergence.py tests/test_skillpack_delivery.py tests/test_wheel_contract.py
          step ruff python -m ruff check scripts/generate_uiux_readme_assets.py scripts/sync_readme_visuals.py tests/test_readme_assets.py tests/test_release_convergence.py tsao/skillpacks.py
          step run_ci python scripts/run_ci.py
          step skillpacks python -m tsao.skillpacks --root .
          rm -rf wheelhouse build dist
          step wheel_build python -m pip wheel --no-deps --no-build-isolation . -w wheelhouse
          step wheel_contents python scripts/verify_wheel_contents.py --wheel-dir wheelhouse
          step wheel_runtime python scripts/verify_wheel_runtime.py --wheel-dir wheelhouse
          git reset --hard HEAD
          cp "$LOG" reports/UIUX_README_VISUAL_DIAGNOSTIC.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/UIUX_README_VISUAL_DIAGNOSTIC.txt
          git commit -m "diagnostic: capture UIUX README visual results [skip ci]"
          git push origin HEAD:main
