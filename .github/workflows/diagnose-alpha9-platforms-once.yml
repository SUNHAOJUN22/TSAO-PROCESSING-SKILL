name: Diagnose alpha9 Windows and macOS once

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    if: ${{ contains(github.event.head_commit.message, '[DIAG-XPLAT-ALPHA9]') }}
    runs-on: windows-latest
    timeout-minutes: 180
    outputs:
      report: ${{ steps.diagnose.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development environment
        run: |
          python -m pip install --quiet -e .[dev]
          python -m pip check
          python -c "import pathlib, shutil; [shutil.rmtree(path) for path in pathlib.Path('.').glob('*.egg-info') if path.is_dir()]"
      - id: diagnose
        name: Run Windows diagnostic
        run: python .github/diagnose_alpha9_platform.py

  macos:
    if: ${{ contains(github.event.head_commit.message, '[DIAG-XPLAT-ALPHA9]') }}
    runs-on: macos-latest
    timeout-minutes: 180
    outputs:
      report: ${{ steps.diagnose.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development environment
        run: |
          python -m pip install --quiet -e .[dev]
          python -m pip check
          python -c "import pathlib, shutil; [shutil.rmtree(path) for path in pathlib.Path('.').glob('*.egg-info') if path.is_dir()]"
      - id: diagnose
        name: Run macOS diagnostic
        run: python .github/diagnose_alpha9_platform.py

  collect:
    needs: [windows, macos]
    if: ${{ always() && contains(github.event.head_commit.message, '[DIAG-XPLAT-ALPHA9]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      WINDOWS_REPORT: ${{ needs.windows.outputs.report }}
      MACOS_REPORT: ${{ needs.macos.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Write compact diagnostic report
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          def decode(name):
              value = os.environ.get(name, "")
              if not value:
                  return {"pass": False, "error": f"missing {name} output"}
              try:
                  return json.loads(base64.b64decode(value).decode("utf-8"))
              except Exception as exc:
                  return {"pass": False, "error": f"could not decode {name}: {exc}"}

          report = {
              "windows": decode("WINDOWS_REPORT"),
              "macos": decode("MACOS_REPORT"),
          }
          report["pass"] = bool(report["windows"].get("pass") and report["macos"].get("pass"))
          Path("reports/ALPHA9_CROSS_PLATFORM_DIAGNOSTIC.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Commit diagnostic evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ALPHA9_CROSS_PLATFORM_DIAGNOSTIC.json
          git commit -m "diagnostic: capture alpha9 Windows and macOS results [skip ci]"
          git push origin HEAD:main
