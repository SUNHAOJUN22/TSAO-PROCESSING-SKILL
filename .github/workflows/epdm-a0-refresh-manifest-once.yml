name: Finalize EPDM Phase A0 manifest once

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tsao-epdm-a0-manifest-finalization
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ contains(github.event.head_commit.message, '[EPDM-A0-REFRESH-MANIFEST]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --quiet -e .
      - name: Remove one-time workflow and rebuild final source identity
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/epdm-a0-refresh-manifest-once.yml
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
          python -m tsao.cli doctor --root . --profile core
      - name: Commit the final manifest and workflow deletion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/SOURCE_CORE_MANIFEST.tsv .github/workflows/epdm-a0-refresh-manifest-once.yml
          git commit -m 'chore: finalize EPDM Phase A0 source identity'
          git push origin HEAD:main
