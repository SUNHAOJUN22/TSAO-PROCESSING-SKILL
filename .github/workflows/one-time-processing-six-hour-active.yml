name: Processing six-hour active qualification

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  stage-1:
    if: github.event.issue.number == 68 && github.event.comment.body == '/run-processing-six-hour-active-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    outputs:
      active_ns: ${{ steps.soak.outputs.active_ns }}
      cycles: ${{ steps.soak.outputs.cycles }}
      tested_sha: ${{ steps.target.outputs.tested_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bb018f4075dba6c7b4a9be567cde82bf89c91034
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact repaired source
        id: target
        shell: bash
        run: |
          set -euo pipefail
          tested_sha=$(git rev-parse HEAD)
          test "$tested_sha" = "bb018f4075dba6c7b4a9be567cde82bf89c91034"
          echo "tested_sha=$tested_sha" >> "$GITHUB_OUTPUT"

      - name: Record six-hour run start
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body=$(printf '%s\n' \
            'Processing six-hour active qualification: RUNNING.' \
            '' \
            "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            'immutable tested source: bb018f4075dba6c7b4a9be567cde82bf89c91034' \
            'required active test time: 21,600,000,000,000 ns' \
            'duration basis: MONOTONIC_ACTIVE_TEST_EXECUTION_ONLY' \
            '' \
            'Queueing, dependency installation and artifact upload time are excluded.')
          gh issue comment 68 --repo "$GITHUB_REPOSITORY" --body "$body"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install exact locked environment
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_dependency_lock.py requirements.lock --pyproject pyproject.toml
          python -m pip install --quiet --require-hashes -r requirements.lock
          python -m pip install --quiet --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Write deterministic qualification cycle
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/processing-six-hour-cycle.sh" <<'CYCLE'
          set -euo pipefail
          python scripts/run_ci.py
          python scripts/qualify_acceptance.py \
            --project skills/epdm/fixtures/v2_phase_a1_reference_project.json \
            --output "$RUNNER_TEMP/processing-acceptance.json" \
            --load-samples 3
          python -m tsao.cli doctor --root . --profile core
          CYCLE
          chmod +x "$RUNNER_TEMP/processing-six-hour-cycle.sh"

      - name: Accumulate active qualification runtime
        id: soak
        shell: bash
        env:
          ACTIVE_INITIAL_NS: "0"
          ACTIVE_TARGET_NS: "9000000000000"
          STAGE_NUMBER: "1"
          TESTED_SHA: ${{ steps.target.outputs.tested_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/processing-six-hour-evidence"
          python - <<'PY'
          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          evidence_dir = Path(os.environ['RUNNER_TEMP']) / 'processing-six-hour-evidence'
          stage = int(os.environ['STAGE_NUMBER'])
          active_ns = int(os.environ['ACTIVE_INITIAL_NS'])
          target_ns = int(os.environ['ACTIVE_TARGET_NS'])
          tested_sha = os.environ['TESTED_SHA']
          cycle = 0
          ledger = evidence_dir / f'stage-{stage}.ndjson'
          ledger.write_text('', encoding='utf-8')
          while active_ns < target_ns:
              cycle += 1
              started_epoch = int(time.time())
              started_active = time.monotonic_ns()
              log = evidence_dir / f'stage-{stage}-current.log'
              with log.open('w', encoding='utf-8') as stream:
                  completed = subprocess.run(
                      ['bash', os.path.join(os.environ['RUNNER_TEMP'], 'processing-six-hour-cycle.sh')],
                      stdout=stream,
                      stderr=subprocess.STDOUT,
                      text=True,
                      check=False,
                  )
              ended_active = time.monotonic_ns()
              ended_epoch = int(time.time())
              cycle_active_ns = ended_active - started_active
              active_ns += cycle_active_ns
              row = {
                  'stage': stage,
                  'cycle': cycle,
                  'tested_sha': tested_sha,
                  'started_epoch': started_epoch,
                  'ended_epoch': ended_epoch,
                  'cycle_active_ns': cycle_active_ns,
                  'cumulative_active_ns': active_ns,
                  'target_active_ns': target_ns,
                  'returncode': completed.returncode,
              }
              with ledger.open('a', encoding='utf-8') as stream:
                  stream.write(json.dumps(row, sort_keys=True) + '\n')
              if completed.returncode != 0:
                  print(log.read_text(encoding='utf-8', errors='replace')[-30000:])
                  raise SystemExit(f'stage {stage} cycle {cycle} failed')
              print(
                  f'stage={stage} cycle={cycle} PASS '
                  f'active={active_ns / 3_600_000_000_000:.6f} h',
                  flush=True,
              )
          summary = {
              'schema': 'SUNHJ-SIX-HOUR-ACTIVE-QUALIFICATION-1',
              'stage': stage,
              'pass': True,
              'tested_sha': tested_sha,
              'stage_cycles': cycle,
              'cumulative_active_ns': active_ns,
              'cumulative_active_hours': active_ns / 3_600_000_000_000,
              'required_active_ns': target_ns,
              'duration_basis': 'MONOTONIC_ACTIVE_TEST_EXECUTION_ONLY',
          }
          (evidence_dir / f'stage-{stage}-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write(f'active_ns={active_ns}\n')
              stream.write(f'cycles={cycle}\n')
          PY

      - name: Upload stage 1 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: processing-six-hour-stage-1-${{ github.run_id }}
          path: ${{ runner.temp }}/processing-six-hour-evidence/
          if-no-files-found: error
          retention-days: 30

  stage-2:
    needs: stage-1
    if: github.event.issue.number == 68 && github.event.comment.body == '/run-processing-six-hour-active-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      active_ns: ${{ steps.soak.outputs.active_ns }}
      cycles: ${{ steps.soak.outputs.cycles }}
      tested_sha: ${{ needs.stage-1.outputs.tested_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.stage-1.outputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install exact locked environment
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_dependency_lock.py requirements.lock --pyproject pyproject.toml
          python -m pip install --quiet --require-hashes -r requirements.lock
          python -m pip install --quiet --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Write deterministic qualification cycle
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/processing-six-hour-cycle.sh" <<'CYCLE'
          set -euo pipefail
          python scripts/run_ci.py
          python scripts/qualify_acceptance.py \
            --project skills/epdm/fixtures/v2_phase_a1_reference_project.json \
            --output "$RUNNER_TEMP/processing-acceptance.json" \
            --load-samples 3
          python -m tsao.cli doctor --root . --profile core
          CYCLE
          chmod +x "$RUNNER_TEMP/processing-six-hour-cycle.sh"

      - name: Accumulate active qualification runtime
        id: soak
        shell: bash
        env:
          ACTIVE_INITIAL_NS: ${{ needs.stage-1.outputs.active_ns }}
          ACTIVE_TARGET_NS: "21600000000000"
          STAGE_NUMBER: "2"
          TESTED_SHA: ${{ needs.stage-1.outputs.tested_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/processing-six-hour-evidence"
          python - <<'PY'
          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          evidence_dir = Path(os.environ['RUNNER_TEMP']) / 'processing-six-hour-evidence'
          stage = int(os.environ['STAGE_NUMBER'])
          active_ns = int(os.environ['ACTIVE_INITIAL_NS'])
          target_ns = int(os.environ['ACTIVE_TARGET_NS'])
          tested_sha = os.environ['TESTED_SHA']
          cycle = 0
          ledger = evidence_dir / f'stage-{stage}.ndjson'
          ledger.write_text('', encoding='utf-8')
          while active_ns < target_ns:
              cycle += 1
              started_epoch = int(time.time())
              started_active = time.monotonic_ns()
              log = evidence_dir / f'stage-{stage}-current.log'
              with log.open('w', encoding='utf-8') as stream:
                  completed = subprocess.run(
                      ['bash', os.path.join(os.environ['RUNNER_TEMP'], 'processing-six-hour-cycle.sh')],
                      stdout=stream,
                      stderr=subprocess.STDOUT,
                      text=True,
                      check=False,
                  )
              ended_active = time.monotonic_ns()
              ended_epoch = int(time.time())
              cycle_active_ns = ended_active - started_active
              active_ns += cycle_active_ns
              row = {
                  'stage': stage,
                  'cycle': cycle,
                  'tested_sha': tested_sha,
                  'started_epoch': started_epoch,
                  'ended_epoch': ended_epoch,
                  'cycle_active_ns': cycle_active_ns,
                  'cumulative_active_ns': active_ns,
                  'target_active_ns': target_ns,
                  'returncode': completed.returncode,
              }
              with ledger.open('a', encoding='utf-8') as stream:
                  stream.write(json.dumps(row, sort_keys=True) + '\n')
              if completed.returncode != 0:
                  print(log.read_text(encoding='utf-8', errors='replace')[-30000:])
                  raise SystemExit(f'stage {stage} cycle {cycle} failed')
              print(
                  f'stage={stage} cycle={cycle} PASS '
                  f'active={active_ns / 3_600_000_000_000:.6f} h',
                  flush=True,
              )
          summary = {
              'schema': 'SUNHJ-SIX-HOUR-ACTIVE-QUALIFICATION-1',
              'stage': stage,
              'pass': True,
              'tested_sha': tested_sha,
              'stage_cycles': cycle,
              'cumulative_active_ns': active_ns,
              'cumulative_active_hours': active_ns / 3_600_000_000_000,
              'required_active_ns': target_ns,
              'duration_basis': 'MONOTONIC_ACTIVE_TEST_EXECUTION_ONLY',
          }
          (evidence_dir / f'stage-{stage}-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write(f'active_ns={active_ns}\n')
              stream.write(f'cycles={cycle}\n')
          PY

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: processing-six-hour-final-${{ github.run_id }}
          path: ${{ runner.temp }}/processing-six-hour-evidence/
          if-no-files-found: error
          retention-days: 30

  duration-gate:
    needs: [stage-1, stage-2]
    if: always() && github.event.issue.number == 68 && github.event.comment.body == '/run-processing-six-hour-active-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce six active hours
        shell: bash
        env:
          STAGE1_RESULT: ${{ needs.stage-1.result }}
          STAGE2_RESULT: ${{ needs.stage-2.result }}
          ACTIVE_NS: ${{ needs.stage-2.outputs.active_ns }}
          TESTED_SHA: ${{ needs.stage-2.outputs.tested_sha }}
        run: |
          set -euo pipefail
          test "$STAGE1_RESULT" = success
          test "$STAGE2_RESULT" = success
          test "${ACTIVE_NS:-0}" -ge 21600000000000
          test -n "$TESTED_SHA"

      - name: Record six-hour machine ledger
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE1_RESULT: ${{ needs.stage-1.result }}
          STAGE2_RESULT: ${{ needs.stage-2.result }}
          ACTIVE_NS: ${{ needs.stage-2.outputs.active_ns }}
          TESTED_SHA: ${{ needs.stage-2.outputs.tested_sha }}
          STAGE1_CYCLES: ${{ needs.stage-1.outputs.cycles }}
          STAGE2_CYCLES: ${{ needs.stage-2.outputs.cycles }}
        run: |
          set -euo pipefail
          verdict=FAIL
          if [[ "$STAGE1_RESULT" == success && "$STAGE2_RESULT" == success ]] \
            && [[ "${ACTIVE_NS:-0}" -ge 21600000000000 ]]; then
            verdict=PASS
          fi
          body=$(printf '%s\n' \
            "Processing six-hour active qualification: $verdict." \
            '' \
            "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "stage 1: $STAGE1_RESULT" \
            "stage 2: $STAGE2_RESULT" \
            "measured active test time: ${ACTIVE_NS:-0} ns" \
            'required active test time: 21,600,000,000,000 ns' \
            "immutable tested source: ${TESTED_SHA:-UNRESOLVED}" \
            "qualification cycles: ${STAGE1_CYCLES:-0} + ${STAGE2_CYCLES:-0}" \
            'duration basis: MONOTONIC_ACTIVE_TEST_EXECUTION_ONLY' \
            '' \
            'Scientific, engineering, HSE, customer and industrial approvals remain NOT_EVALUATED.')
          gh issue comment 68 --repo "$GITHUB_REPOSITORY" --body "$body"
          test "$verdict" = PASS
