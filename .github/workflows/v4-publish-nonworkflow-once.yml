name: V4 non-workflow candidate publication once

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: v4-publish-nonworkflow-once
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '/publish-processing-v4-artifact')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Download qualified exact-tree bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/processing-v4-candidate"
          mkdir -p "$bundle"
          gh run download 31326415893 \
            --repo "$GITHUB_REPOSITORY" \
            --name processing-v4-exact-candidate-9890e42c95d78b166c790d45ea070106e9a4885f \
            --dir "$bundle"
          test "$(cat "$bundle/PARENT_SHA.txt")" = 86a2f118ce99adbe90bce5e9c95b807815f9ff8c
          test "$(cat "$bundle/CANDIDATE_SHA.txt")" = 9890e42c95d78b166c790d45ea070106e9a4885f
          git merge-base --is-ancestor 86a2f118ce99adbe90bce5e9c95b807815f9ff8c HEAD
          unexpected="$(git diff --name-only 86a2f118ce99adbe90bce5e9c95b807815f9ff8c..HEAD | grep -v '^.github/workflows/v4-publish-nonworkflow-once.yml$' || :)"
          if [[ -n "$unexpected" ]]; then
            echo "STALE_MAIN unexpected changes after qualified parent:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 3
          fi
      - name: Publish only qualified non-workflow identity files
        env:
          BUNDLE: ${{ runner.temp }}/processing-v4-candidate
        run: |
          set -euo pipefail
          cp "$BUNDLE/reports/SOURCE_CORE_MANIFEST.tsv" reports/SOURCE_CORE_MANIFEST.tsv
          cp "$BUNDLE/reports/SOURCE_CORE_OVERLAY.tsv" reports/SOURCE_CORE_OVERLAY.tsv
          cp "$BUNDLE/reports/SOURCE_ACCEPTANCE_OVERLAY.tsv" reports/SOURCE_ACCEPTANCE_OVERLAY.tsv
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            reports/SOURCE_CORE_MANIFEST.tsv \
            reports/SOURCE_CORE_OVERLAY.tsv \
            reports/SOURCE_ACCEPTANCE_OVERLAY.tsv
          git commit -m 'ci: publish qualified fail-closed provenance identities'
          git push origin HEAD:main
      - name: Publish machine result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ job.status }}
        run: |
          gh issue comment "$ISSUE" --body "V4_PROCESSING_NONWORKFLOW_PUBLISH outcome=${OUTCOME} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} source_bundle=31326415893 final_workflow_patch=connector_pending"
