name: Finalize main-only hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/main-only-hardening-finalize-once.yml
      - .github/hardening/**
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: tsao-main-only-hardening
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Execute verified finalizer and export final tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          script=".github/hardening/finalize-main.sh"
          test -f "${script}"
          echo "b7e9572b34ae201b849b02ffbb0f027558fbbe93420ed8efdca081902f0602a5  ${script}" \
            | sha256sum --check --strict
          python - "${script}" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          old = """python scripts/update_source_overlay.py --root . \\
            requirements.lock \\
          """
          new = """python scripts/update_source_overlay.py --root . \\
            scripts/verify_dependency_lock.py \\
            requirements.lock \\
          """
          if old not in text:
              raise SystemExit("finalizer overlay-update anchor not found")
          text = text.replace(old, new, 1)

          push_marker = "git push origin HEAD:main\n"
          if push_marker not in text:
              raise SystemExit("finalizer push anchor not found")
          prefix = text.split(push_marker, 1)[0]
          export_tail = r'''final_sha="$(git rev-parse HEAD)"
          git archive --format=zip \
            --output="${evidence_dir}/FINAL_MAIN_TREE.zip" "${final_sha}"
          git diff --binary "${GITHUB_SHA}" "${final_sha}" \
            > "${evidence_dir}/FINAL_MAIN_PATCH.diff"
          git ls-tree -r --full-tree "${final_sha}" \
            > "${evidence_dir}/FINAL_MAIN_TREE.tsv"
          lock_sha="$(sha256sum requirements.lock | awk '{print $1}')"
          printf 'FINAL_SHA=%s\nBASE_SHA=%s\nLOCK_SHA=%s\n' \
            "${final_sha}" "${GITHUB_SHA}" "${lock_sha}" \
            | tee "${evidence_dir}/FINALIZATION_RESULT.txt"
          '''
          path.write_text(prefix + export_tail, encoding="utf-8")
          PY
          chmod +x "${script}"
          "${script}"
      - name: Upload qualification evidence and final tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-only-hardening-publication
          path: |
            requirements.lock
            reports/DEPENDENCY_LOCK_QUALIFICATION_2026-08-05.json
            reports/PIP_AUDIT_2026-08-05.json
            ${{ runner.temp }}/main-hardening-evidence/**
          if-no-files-found: error
          retention-days: 30

  notify-failure:
    needs: finalize
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report finalization failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh issue comment 68 --repo "${GITHUB_REPOSITORY}"
          --body "Main-only hardening finalization failed in run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. No success claim or branch cleanup was recorded."
