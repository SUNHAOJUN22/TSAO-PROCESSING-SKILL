name: Seal alpha9 release cleanly once

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tsao-seal-alpha9-release-clean-once
  cancel-in-progress: true

jobs:
  pause:
    if: ${{ contains(github.event.head_commit.message, '[PAUSE-SEAL]') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Fresh alpha9 seal paused for exact final-worktree diagnosis."
