name: Close alpha11 cross-platform qualification once

on:
  push:
    branches: [main]

concurrency:
  group: tsao-alpha11-cross-platform-closure-v5
  cancel-in-progress: false

env:
  QUALIFIED_SOURCE_SHA: 076e732a8ae257699379a4465dd88dc8adc65410

jobs:
  announce:
    if: ${{ contains(github.event.head_commit.message, '[CLOSE-ALPHA11-V5]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Record observable closure run
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > reports/ALPHA11_CROSS_PLATFORM_HEARTBEAT.json <<JSON
          {
            "schema": "TSAO-ALPHA11-CROSS-PLATFORM-HEARTBEAT-1",
            "qualified_source_commit": "${QUALIFIED_SOURCE_SHA}",
            "observer_commit": "${GITHUB_SHA}",
            "workflow_run_id": ${GITHUB_RUN_ID},
            "workflow_run_attempt": ${GITHUB_RUN_ATTEMPT},
            "status": "RUNNING"
          }
          JSON
          git add reports/ALPHA11_CROSS_PLATFORM_HEARTBEAT.json
          git commit -m 'chore: record alpha11 cross-platform closure heartbeat [skip ci]'
          git push origin HEAD:main

  qualification:
    needs: announce
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        include:
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.QUALIFIED_SOURCE_SHA }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install
        run: python -m pip install --quiet -e .[dev]
      - name: Refresh source identity for the qualified worktree
        run: python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
      - name: Dependency integrity
        run: python -m pip check
      - name: Verify permanent tracked-file hygiene
        run: >-
          python -c "import subprocess; from pathlib import Path; tracked=[p for p in subprocess.check_output(['git','ls-files','-z']).decode().split(chr(0)) if p]; w=sorted(p for p in tracked if p.startswith('.github/workflows/')); assert w==['.github/workflows/ci.yml'],w; f=[p for p in tracked if '-once.yml' in Path(p).name or 'CANDIDATE' in Path(p).name or 'DIAGNOSTIC' in Path(p).name]; assert not f,f"
      - name: Clean editable-install metadata
        run: python -c "import pathlib, shutil; [shutil.rmtree(path) for path in pathlib.Path('.').glob('*.egg-info') if path.is_dir()]"
      - name: Verify deterministic README graphics and visual contract
        run: |
          python scripts/generate_readme_assets.py
          python scripts/generate_extended_readme_assets.py
          python scripts/generate_decision_readme_assets.py
          python scripts/generate_performance_readme_assets.py
          python scripts/generate_uiux_readme_assets.py
          python scripts/harden_readme_svg_accessibility.py
          python scripts/verify_readme_visual_accessibility.py
          python scripts/sync_readme_visuals.py --check
          git diff --exit-code -- docs/assets/readme README.md README.zh-CN.md
      - name: Core, specialists, Ruff and coverage qualification
        run: python scripts/run_ci.py
      - name: Universal Skillpack closure
        run: |
          python -m tsao.skillpacks --root .
          python -m tsao.cli package template --family "generic process"
      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation . -w wheelhouse
      - name: Verify wheel members and installed runtime
        run: |
          python scripts/verify_wheel_contents.py --wheel-dir wheelhouse
          python scripts/verify_wheel_runtime.py --wheel-dir wheelhouse
      - name: Extended performance regression gate
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: |
          python scripts/benchmark_performance_v2.py \
            --repeats 7 \
            --wheel-dir wheelhouse \
            --output reports/runtime/PERFORMANCE_RESULTS_V2.json
          python scripts/compare_performance_v2.py \
            --baseline reports/PERFORMANCE_BASELINE_ALPHA10_EXTENDED.json \
            --current reports/runtime/PERFORMANCE_RESULTS_V2.json \
            --output reports/runtime/PERFORMANCE_COMPARISON_V2.json
          python scripts/update_performance_readme.py \
            --comparison reports/PERFORMANCE_COMPARISON_ALPHA11.json --check
      - name: CLI smoke
        run: |
          python -m tsao.cli doctor --root . --profile core
          python -m tsao.skillpacks --root .
          python -m tsao.cli route "POE solution polymerization and solvent recovery"
          python -m tsao.cli package template --family "continuous chemical process"
          python -m tsao.cli epdm status
          python -m tsao.cli epdm audit
          python -m tsao.cli epdm reference-demo
          python -m tsao.cli epdm model-suite --temperature-k 323.15 --residence-s 300
          python -m tsao.cli poe status --root .
          python -m tsao.cli poe audit-p0 --root .
          python -m tsao.cli poe audit-p1 --root .
          python -m tsao.cli poe reference-demo
      - name: Upload matrix evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alpha11-cross-v5-${{ matrix.os }}-py${{ matrix.python-version }}-${{ github.run_id }}
          path: |
            reports/runtime/CI_RESULTS.json
            reports/runtime/PERFORMANCE_RESULTS_V2.json
            reports/runtime/PERFORMANCE_COMPARISON_V2.json
          if-no-files-found: warn
          retention-days: 30

  source-snapshot:
    needs: qualification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.QUALIFIED_SOURCE_SHA }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --quiet -e .
      - name: Refresh and verify committed source identity
        run: |
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
          python -m tsao.cli doctor --root . --profile core
      - name: Build deterministic public-source snapshot
        run: python scripts/export_source_snapshot.py --root . --out TSAO-PROCESSING-SKILL-source-alpha.11.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alpha11-source-v5-${{ github.run_id }}
          path: |
            TSAO-PROCESSING-SKILL-source-alpha.11.zip
            TSAO-PROCESSING-SKILL-source-alpha.11.zip.sha256
          if-no-files-found: error
          retention-days: 30

  assemble-final-evidence:
    needs: [qualification, source-snapshot]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Build exact final evidence worktree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/alpha11-cross-platform-closure-once.yml
          rm -f reports/ALPHA11_CROSS_PLATFORM_HEARTBEAT.json
          python -m pip install --quiet -e '.[dev]'
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          qualification_path = root / "reports/ALPHA11_FINAL_QUALIFICATION.json"
          data = json.loads(qualification_path.read_text(encoding="utf-8"))
          collect = subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "pytest",
                  "--collect-only",
                  "-q",
                  "tests",
                  "skills/process-general/tests",
                  "skills/epdm/tests",
                  "skills/poe/tests",
                  "skills/polymer-general/tests",
              ],
              cwd=root,
              text=True,
              capture_output=True,
              check=True,
          )
          summary = collect.stdout + "\n" + collect.stderr
          matches = [int(value) for value in re.findall(r"(\d+) tests? collected", summary)]
          if not matches:
              raise SystemExit("could not determine collected test count")
          run_id = int(os.environ["GITHUB_RUN_ID"])
          data.update(
              {
                  "qualified_source_commit": os.environ["QUALIFIED_SOURCE_SHA"],
                  "cross_platform_qualification": "PASS",
                  "cross_platform_matrix": [
                      "ubuntu/3.11",
                      "ubuntu/3.12",
                      "ubuntu/3.13",
                      "ubuntu/3.14",
                      "windows/3.14",
                      "macos/3.14",
                  ],
                  "cross_platform_workflow_run_id": run_id,
                  "cross_platform_workflow_run_url": (
                      f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"
                  ),
                  "final_closure_validation": "PASS_EXACT_SOURCE_TREE_AND_EVIDENCE_WORKTREE",
                  "test_count": max(matches),
                  "permanent_ci": "READ_ONLY_SINGLE_WORKFLOW",
                  "temporary_workflows": "REMOVED_IN_FINAL_EVIDENCE_WORKTREE",
              }
          )
          qualification_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          closure = {
              "schema": "TSAO-ALPHA11-CROSS-PLATFORM-CLOSURE-1",
              "version": "0.1.0-alpha.11",
              "qualified_source_commit": os.environ["QUALIFIED_SOURCE_SHA"],
              "observer_commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": run_id,
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "matrix_status": "PASS",
              "final_evidence_worktree_status": "PASS",
              "qualification_boundary": "SOFTWARE_ONLY",
              "scientific_technical_approval": "NOT_EVALUATED",
              "engineering_design_approval": "NOT_EVALUATED",
              "customer_qualification": "NOT_EVALUATED",
              "industrial_performance_guarantee": "NOT_EVALUATED",
          }
          (root / "reports/ALPHA11_CROSS_PLATFORM_CLOSURE.json").write_text(
              json.dumps(closure, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
          python -m tsao.cli doctor --root . --profile core
          python -m pytest -q \
            tests/test_release_metadata_alpha11.py \
            tests/test_repository_contracts.py \
            tests/test_release_convergence.py \
            tests/test_wheel_contract.py \
            tests/test_performance_v2_numeric_parity.py \
            tests/test_skillpack_semantic_parity.py
          python -m ruff check tsao skills scripts tests
          git diff --check
          python -c "import subprocess; from pathlib import Path; tracked=[p for p in subprocess.check_output(['git','ls-files','-z']).decode().split(chr(0)) if p and p != '.github/workflows/alpha11-cross-platform-closure-once.yml' and p != 'reports/ALPHA11_CROSS_PLATFORM_HEARTBEAT.json']; w=sorted(p for p in tracked if p.startswith('.github/workflows/')); assert w==['.github/workflows/ci.yml'],w; f=[p for p in tracked if '-once.yml' in Path(p).name or 'CANDIDATE' in Path(p).name or 'DIAGNOSTIC' in Path(p).name]; assert not f,f"
      - name: Upload finalization payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alpha11-finalization-payload-v5-${{ github.run_id }}
          path: |
            reports/ALPHA11_FINAL_QUALIFICATION.json
            reports/ALPHA11_CROSS_PLATFORM_CLOSURE.json
            reports/SOURCE_CORE_MANIFEST.tsv
          if-no-files-found: error
          retention-days: 30
