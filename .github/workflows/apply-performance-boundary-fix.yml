name: Apply historical performance-boundary correction

on:
  push:
    branches:
      - fix/20260831-historical-performance-boundary

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  apply-and-qualify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/20260831-historical-performance-boundary
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Apply reviewed source, regression and README changes
        run: python scripts/apply_historical_performance_boundary.py
      - name: Install exact locked environment
        run: |
          python scripts/verify_dependency_lock.py requirements.lock --pyproject pyproject.toml
          python -m pip install --quiet --require-hashes -r requirements.lock
          python -m pip install --quiet --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Format and run focused regressions
        run: |
          python -m ruff format scripts/compare_performance_v2.py tests/test_historical_performance_boundary.py
          python -m ruff check scripts/compare_performance_v2.py tests/test_historical_performance_boundary.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_historical_performance_boundary.py \
            tests/test_performance_v2_reports.py \
            tests/test_distribution_containment_v20.py \
            tests/test_public_distribution_boundary_workflow.py
          python scripts/run_ci.py
          git diff --check
      - name: Commit the qualified clean tree
        run: |
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(performance): retire blocked public-wheel historical workload"
          git push origin HEAD:fix/20260831-historical-performance-boundary
