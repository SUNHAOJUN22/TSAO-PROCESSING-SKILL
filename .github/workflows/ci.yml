name: TSAO acceptance source export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tsao-source-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR merge tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Export current tree and original main CI
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=TSAO-current-source.zip HEAD
          git show origin/main:.github/workflows/ci.yml > TSAO-main-ci.yml
          sha256sum TSAO-current-source.zip TSAO-main-ci.yml > SHA256SUMS.export
      - name: Upload exact source export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsao-exact-source-${{ github.sha }}
          path: |
            TSAO-current-source.zip
            TSAO-main-ci.yml
            SHA256SUMS.export
          if-no-files-found: error
          retention-days: 1
