name: Finalize alpha9 release identity once
# Decisive seal after Ubuntu, Windows and macOS full-chain diagnostic PASS evidence.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tsao-finalize-alpha9-release-once
  cancel-in-progress: true

jobs:
  seal-main:
    if: ${{ contains(github.event.head_commit.message, '[SEAL-ALPHA9]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development environment
        run: |
          python -m pip install --quiet -e .[dev]
          python -m pip check
          python -c "import pathlib, shutil; [shutil.rmtree(path) for path in pathlib.Path('.').glob('*.egg-info') if path.is_dir()]"
      - name: Apply and seal alpha9 identity
        run: |
          python -m py_compile .github/apply_alpha9_release.py .github/fix_alpha9_release_residuals.py
          python .github/apply_alpha9_release.py
          python .github/fix_alpha9_release_residuals.py
          python -c "from pathlib import Path; Path('.github/apply_alpha9_release.py').unlink(); Path('.github/fix_alpha9_release_residuals.py').unlink(); Path('.github/workflows/finalize-alpha9-release-once.yml').unlink()"
          python scripts/generate_readme_assets.py
          python scripts/generate_extended_readme_assets.py
          python scripts/generate_decision_readme_assets.py
          git diff --exit-code -- docs/assets/readme
          python -m tsao.cli doctor --root . --profile core --refresh-source-manifest
      - name: Complete repository qualification
        run: |
          python scripts/run_ci.py
          python -m tsao.skillpacks --root .
          python skills/epdm/scripts/audit_epdm.py
          python skills/poe/scripts/audit_p0.py --root .
          python skills/poe/scripts/audit_p1.py --root .
      - name: Build and verify final alpha9 Wheel
        run: |
          python -c "import shutil; shutil.rmtree('wheelhouse', ignore_errors=True)"
          python -m pip wheel --no-deps --no-build-isolation . -w wheelhouse
          python scripts/verify_wheel_contents.py --wheel-dir wheelhouse
          python scripts/verify_wheel_runtime.py --wheel-dir wheelhouse
      - name: Final command checks
        run: |
          python -c "import tsao; assert tsao.__version__ == '0.1.0-alpha.9'"
          python -m tsao.cli doctor --root . --profile core
          python -m tsao.skillpacks --root .
          python -m tsao.cli package template --family "continuous chemical process"
          python -m tsao.cli epdm model-suite --temperature-k 323.15 --residence-s 300
      - name: Commit finalized main
        run: |
          python -c "import shutil; [shutil.rmtree(path, ignore_errors=True) for path in ('wheelhouse', 'build', 'dist')]"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: seal 0.1.0-alpha.9 identity"
          git push origin HEAD:main
