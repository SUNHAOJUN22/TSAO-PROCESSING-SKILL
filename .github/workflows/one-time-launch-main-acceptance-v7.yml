name: One-time launch Processing main acceptance v7

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  repair-publish-and-launch:
    if: contains(github.event.head_commit.message || '', '[run-processing-main-acceptance-v7]')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install exact locked environment
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_dependency_lock.py requirements.lock --pyproject pyproject.toml
          python -m pip install --quiet --require-hashes -r requirements.lock
          python -m pip install --quiet --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Extract V6 audited scripts
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/one-time-diagnose-six-hour-matrix.yml /tmp/processing-v6-controller.yml
          python - <<'PY'
          from pathlib import Path

          source = Path('/tmp/processing-v6-controller.yml').read_text(
              encoding='utf-8'
          ).splitlines()

          def extract(step_name: str, target: str) -> None:
              marker = f'- name: {step_name}'
              index = next(
                  i for i, line in enumerate(source)
                  if line.strip() == marker
              )
              run_index = next(
                  i for i in range(index + 1, len(source))
                  if source[i].strip() == 'run: |'
              )
              run_indent = len(source[run_index]) - len(source[run_index].lstrip())
              body: list[str] = []
              for line in source[run_index + 1:]:
                  indent = len(line) - len(line.lstrip())
                  if line.strip() and indent <= run_indent:
                      break
                  body.append(line[run_indent + 2:] if len(line) >= run_indent + 2 else '')
              if not body:
                  raise SystemExit(f'empty run script for {step_name!r}')
              Path(target).write_text('\n'.join(body) + '\n', encoding='utf-8')

          extract(
              'Apply root-cause code, regression, README and provenance fixes',
              '/tmp/processing-apply.sh',
          )
          extract(
              'Validate candidate before publication',
              '/tmp/processing-validate.sh',
          )
          extract(
              'Dispatch permanent eight-matrix qualification',
              '/tmp/processing-dispatch.sh',
          )
          PY
          chmod +x \
            /tmp/processing-apply.sh \
            /tmp/processing-validate.sh \
            /tmp/processing-dispatch.sh

      - name: Apply root-cause repair and validate candidate
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/processing-apply.sh
          rm -f .github/workflows/one-time-launch-main-acceptance-v7.yml
          bash /tmp/processing-validate.sh

      - name: Publish clean repaired source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: isolate EPDM acceptance timing from memory tracing"
          git push origin HEAD:main
          echo "clean_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch permanent eight-matrix qualification
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash /tmp/processing-dispatch.sh

      - name: Generate six-hour active workflow bound to clean source
        id: harness
        shell: bash
        env:
          CLEAN_SHA: ${{ steps.source.outputs.clean_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          clean_sha = os.environ['CLEAN_SHA']
          if not clean_sha:
              raise SystemExit('clean source SHA is empty')

          template = r'''name: Processing six-hour active qualification

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  stage-1:
    if: github.event.issue.number == 68 && github.event.comment.body == '/run-processing-six-hour-active-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    outputs:
      active_ns: __GH_OPEN__ steps.soak.outputs.active_ns __GH_CLOSE__
      cycles: __GH_OPEN__ steps.soak.outputs.cycles __GH_CLOSE__
      tested_sha: __GH_OPEN__ steps.target.outputs.tested_sha __GH_CLOSE__
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: __SHA__
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact clean source
        id: target
        shell: bash
        run: |
          set -euo pipefail
          tested_sha=$(git rev-parse HEAD)
          test "$tested_sha" = "__SHA__"
          echo "tested_sha=$tested_sha" >> "$GITHUB_OUTPUT"
      - name: Record run start
        shell: bash
        env:
          GH_TOKEN: __GH_OPEN__ github.token __GH_CLOSE__
        run: |
          set -euo pipefail
          gh issue comment 68 --repo "$GITHUB_REPOSITORY" --body "Processing six-hour active qualification: RUNNING.

- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
- immutable tested source: \`__SHA__\`
- required active test time: \`21,600,000,000,000 ns\`
- duration basis: \`MONOTONIC_ACTIVE_TEST_EXECUTION_ONLY\`

Queueing, dependency installation and artifact upload time are excluded."
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install exact locked environment
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_dependency_lock.py requirements.lock --pyproject pyproject.toml
          python -m pip install --quiet --require-hashes -r requirements.lock
          python -m pip install --quiet --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Write deterministic qualification cycle
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/processing-six-hour-cycle.sh" <<'CYCLE'
          set -euo pipefail
          python scripts/run_ci.py
          python scripts/qualify_acceptance.py \
            --project skills/epdm/fixtures/v2_phase_a1_reference_project.json \
            --output "$RUNNER_TEMP/processing-acceptance.json" \
            --load-samples 3
          python -m tsao.cli doctor --root . --profile core
          CYCLE
          chmod +x "$RUNNER_TEMP/processing-six-hour-cycle.sh"
      - name: Accumulate active qualification runtime
        id: soak
        shell: bash
        env:
          ACTIVE_INITIAL_NS: "0"
          ACTIVE_TARGET_NS: "9000000000000"
          STAGE_NUMBER: "1"
          TESTED_SHA: __GH_OPEN__ steps.target.outputs.tested_sha __GH_CLOSE__
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/processing-six-hour-evidence"
          python - <<'PY1'
          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          evidence_dir = Path(os.environ['RUNNER_TEMP']) / 'processing-six-hour-evidence'
          stage = int(os.environ['STAGE_NUMBER'])
          active_ns = int(os.environ['ACTIVE_INITIAL_NS'])
          target_ns = int(os.environ['ACTIVE_TARGET_NS'])
          tested_sha = os.environ['TESTED_SHA']
          cycle = 0
          ledger = evidence_dir / f'stage-{stage}.ndjson'
          ledger.write_text('', encoding='utf-8')
          while active_ns < target_ns:
              cycle += 1
              started_epoch = int(time.time())
              started_active = time.monotonic_ns()
              log = evidence_dir / f'stage-{stage}-current.log'
              with log.open('w', encoding='utf-8') as stream:
                  completed = subprocess.run(
                      ['bash', os.path.join(os.environ['RUNNER_TEMP'], 'processing-six-hour-cycle.sh')],
                      stdout=stream,
                      stderr=subprocess.STDOUT,
                      text=True,
                      check=False,
                  )
              ended_active = time.monotonic_ns()
              ended_epoch = int(time.time())
              cycle_active_ns = ended_active - started_active
              active_ns += cycle_active_ns
              row = {
                  'stage': stage,
                  'cycle': cycle,
                  'tested_sha': tested_sha,
                  'started_epoch': started_epoch,
                  'ended_epoch': ended_epoch,
                  'cycle_active_ns': cycle_active_ns,
                  'cumulative_active_ns': active_ns,
                  'target_active_ns': target_ns,
                  'returncode': completed.returncode,
              }
              with ledger.open('a', encoding='utf-8') as stream:
                  stream.write(json.dumps(row, sort_keys=True) + '\n')
              if completed.returncode != 0:
                  print(log.read_text(encoding='utf-8', errors='replace')[-30000:])
                  raise SystemExit(f'stage {stage} cycle {cycle} failed')
              print(
                  f'stage={stage} cycle={cycle} PASS '
                  f'active={active_ns / 3_600_000_000_000:.6f} h',
                  flush=True,
              )
          summary = {
              'schema': 'SUNHJ-SIX-HOUR-ACTIVE-QUALIFICATION-1',
              'stage': stage,
              'pass': True,
              'tested_sha': tested_sha,
              'stage_cycles': cycle,
              'cumulative_active_ns': active_ns,
              'cumulative_active_hours': active_ns / 3_600_000_000_000,
              'required_active_ns': target_ns,
              'duration_basis': 'MONOTONIC_ACTIVE_TEST_EXECUTION_ONLY',
          }
          (evidence_dir / f'stage-{stage}-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write(f'active_ns={active_ns}\n')
              stream.write(f'cycles={cycle}\n')
          PY1
      - name: Upload stage 1 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: processing-six-hour-stage-1-__GH_OPEN__ github.run_id __GH_CLOSE__
          path: __GH_OPEN__ runner.temp __GH_CLOSE__/processing-six-hour-evidence/
          if-no-files-found: error
          retention-days: 30

  stage-2:
    needs: stage-1
    if: github.event.issue.number == 68 && github.event.comment.body == '/run-processing-six-hour-active-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      active_ns: __GH_OPEN__ steps.soak.outputs.active_ns __GH_CLOSE__
      cycles: __GH_OPEN__ steps.soak.outputs.cycles __GH_CLOSE__
      tested_sha: __GH_OPEN__ needs.stage-1.outputs.tested_sha __GH_CLOSE__
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: __GH_OPEN__ needs.stage-1.outputs.tested_sha __GH_CLOSE__
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install exact locked environment
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_dependency_lock.py requirements.lock --pyproject pyproject.toml
          python -m pip install --quiet --require-hashes -r requirements.lock
          python -m pip install --quiet --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Write deterministic qualification cycle
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/processing-six-hour-cycle.sh" <<'CYCLE'
          set -euo pipefail
          python scripts/run_ci.py
          python scripts/qualify_acceptance.py \
            --project skills/epdm/fixtures/v2_phase_a1_reference_project.json \
            --output "$RUNNER_TEMP/processing-acceptance.json" \
            --load-samples 3
          python -m tsao.cli doctor --root . --profile core
          CYCLE
          chmod +x "$RUNNER_TEMP/processing-six-hour-cycle.sh"
      - name: Accumulate active qualification runtime
        id: soak
        shell: bash
        env:
          ACTIVE_INITIAL_NS: __GH_OPEN__ needs.stage-1.outputs.active_ns __GH_CLOSE__
          ACTIVE_TARGET_NS: "21600000000000"
          STAGE_NUMBER: "2"
          TESTED_SHA: __GH_OPEN__ needs.stage-1.outputs.tested_sha __GH_CLOSE__
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/processing-six-hour-evidence"
          python - <<'PY2'
          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          evidence_dir = Path(os.environ['RUNNER_TEMP']) / 'processing-six-hour-evidence'
          stage = int(os.environ['STAGE_NUMBER'])
          active_ns = int(os.environ['ACTIVE_INITIAL_NS'])
          target_ns = int(os.environ['ACTIVE_TARGET_NS'])
          tested_sha = os.environ['TESTED_SHA']
          cycle = 0
          ledger = evidence_dir / f'stage-{stage}.ndjson'
          ledger.write_text('', encoding='utf-8')
          while active_ns < target_ns:
              cycle += 1
              started_epoch = int(time.time())
              started_active = time.monotonic_ns()
              log = evidence_dir / f'stage-{stage}-current.log'
              with log.open('w', encoding='utf-8') as stream:
                  completed = subprocess.run(
                      ['bash', os.path.join(os.environ['RUNNER_TEMP'], 'processing-six-hour-cycle.sh')],
                      stdout=stream,
                      stderr=subprocess.STDOUT,
                      text=True,
                      check=False,
                  )
              ended_active = time.monotonic_ns()
              ended_epoch = int(time.time())
              cycle_active_ns = ended_active - started_active
              active_ns += cycle_active_ns
              row = {
                  'stage': stage,
                  'cycle': cycle,
                  'tested_sha': tested_sha,
                  'started_epoch': started_epoch,
                  'ended_epoch': ended_epoch,
                  'cycle_active_ns': cycle_active_ns,
                  'cumulative_active_ns': active_ns,
                  'target_active_ns': target_ns,
                  'returncode': completed.returncode,
              }
              with ledger.open('a', encoding='utf-8') as stream:
                  stream.write(json.dumps(row, sort_keys=True) + '\n')
              if completed.returncode != 0:
                  print(log.read_text(encoding='utf-8', errors='replace')[-30000:])
                  raise SystemExit(f'stage {stage} cycle {cycle} failed')
              print(
                  f'stage={stage} cycle={cycle} PASS '
                  f'active={active_ns / 3_600_000_000_000:.6f} h',
                  flush=True,
              )
          summary = {
              'schema': 'SUNHJ-SIX-HOUR-ACTIVE-QUALIFICATION-1',
              'stage': stage,
              'pass': True,
              'tested_sha': tested_sha,
              'stage_cycles': cycle,
              'cumulative_active_ns': active_ns,
              'cumulative_active_hours': active_ns / 3_600_000_000_000,
              'required_active_ns': target_ns,
              'duration_basis': 'MONOTONIC_ACTIVE_TEST_EXECUTION_ONLY',
          }
          (evidence_dir / f'stage-{stage}-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write(f'active_ns={active_ns}\n')
              stream.write(f'cycles={cycle}\n')
          PY2
      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: processing-six-hour-final-__GH_OPEN__ github.run_id __GH_CLOSE__
          path: __GH_OPEN__ runner.temp __GH_CLOSE__/processing-six-hour-evidence/
          if-no-files-found: error
          retention-days: 30

  duration-gate:
    needs: [stage-1, stage-2]
    if: always() && github.event.issue.number == 68 && github.event.comment.body == '/run-processing-six-hour-active-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce six active hours and write ledger
        shell: bash
        env:
          GH_TOKEN: __GH_OPEN__ github.token __GH_CLOSE__
          STAGE1_RESULT: __GH_OPEN__ needs.stage-1.result __GH_CLOSE__
          STAGE2_RESULT: __GH_OPEN__ needs.stage-2.result __GH_CLOSE__
          ACTIVE_NS: __GH_OPEN__ needs.stage-2.outputs.active_ns __GH_CLOSE__
          TESTED_SHA: __GH_OPEN__ needs.stage-2.outputs.tested_sha __GH_CLOSE__
          STAGE1_CYCLES: __GH_OPEN__ needs.stage-1.outputs.cycles __GH_CLOSE__
          STAGE2_CYCLES: __GH_OPEN__ needs.stage-2.outputs.cycles __GH_CLOSE__
        run: |
          set -euo pipefail
          verdict=FAIL
          if [[ "$STAGE1_RESULT" == success && "$STAGE2_RESULT" == success ]] \
            && [[ "${ACTIVE_NS:-0}" -ge 21600000000000 ]]; then
            verdict=PASS
          fi
          gh issue comment 68 --repo "$GITHUB_REPOSITORY" --body "Processing six-hour active qualification: **$verdict**

- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
- stage 1: \`$STAGE1_RESULT\`
- stage 2: \`$STAGE2_RESULT\`
- measured active test time: \`${ACTIVE_NS:-0} ns\`
- required active test time: \`21,600,000,000,000 ns\`
- immutable tested source: \`${TESTED_SHA:-UNRESOLVED}\`
- qualification cycles: \`${STAGE1_CYCLES:-0} + ${STAGE2_CYCLES:-0}\`
- duration basis: \`MONOTONIC_ACTIVE_TEST_EXECUTION_ONLY\`

Scientific, engineering, HSE, customer and industrial approvals remain NOT_EVALUATED."
          test "$verdict" = PASS
'''
          active = (
              template
              .replace('__SHA__', clean_sha)
              .replace('__GH_OPEN__', '$' + '{{')
              .replace('__GH_CLOSE__', '}}')
          )
          path = Path('.github/workflows/one-time-processing-six-hour-active.yml')
          path.write_text(active, encoding='utf-8')
          PY
          git add .github/workflows/one-time-processing-six-hour-active.yml
          git diff --cached --check
          git commit -m "ci: bind Processing six-hour qualification to repaired source"
          git push origin HEAD:main
          echo "harness_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Start Processing six-hour qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 15
          gh issue comment 68 --repo "$GITHUB_REPOSITORY" --body '/run-processing-six-hour-active-v1'

      - name: Record launcher result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN_SHA: ${{ steps.source.outputs.clean_sha }}
          HARNESS_SHA: ${{ steps.harness.outputs.harness_sha }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          RUN_URL: ${{ steps.dispatch.outputs.run_url }}
        run: |
          set -euo pipefail
          gh issue comment 68 --repo "$GITHUB_REPOSITORY" --body "PROCESSING_MAIN_ACCEPTANCE_V7: **${{ job.status }}**

- clean repaired source: \`${CLEAN_SHA:-UNPUBLISHED}\`
- permanent matrix run: ${RUN_URL:-UNRESOLVED}
- permanent matrix run id: \`${RUN_ID:-UNRESOLVED}\`
- six-hour harness commit: \`${HARNESS_SHA:-UNPUBLISHED}\`
- six-hour command: \`/run-processing-six-hour-active-v1\`

The 21,600,000,000,000 ns Gate and all existing lock, coverage, numerical and approval boundaries remain unchanged."
