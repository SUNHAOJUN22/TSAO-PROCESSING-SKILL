name: Observe EPDM A1 patch once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  observe:
    if: ${{ github.event.issue.title == '[OBSERVE-EPDM-A1-PATCH]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Restore repository tree immediately
        run: |
          rm -f .github/workflows/observe-epdm-a1-patch-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows
          git commit -m 'chore: remove EPDM A1 patch observer'
          git push origin HEAD:main
      - name: Report patch run
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TARGET_SHA: e70440ffd6c811948fd2f780253f3c771cf94b41
        run: |
          python - <<'PY' > /tmp/patch-observation.md
          import json
          import os
          import subprocess

          repo = os.environ['GITHUB_REPOSITORY']
          target = os.environ['TARGET_SHA']
          raw = subprocess.check_output(['gh','api',f'/repos/{repo}/actions/workflows/patch-epdm-a1-qualification-once.yml/runs?event=issues&per_page=20'], text=True)
          runs = [run for run in json.loads(raw).get('workflow_runs', []) if run.get('head_sha') == target]
          print(f'Patch target head: {target}')
          if not runs:
              print('- no matching patch run found')
          for run in runs:
              print(f"- run {run['id']}: status={run['status']}, conclusion={run.get('conclusion')}, url={run['html_url']}")
              jobs_raw = subprocess.check_output(['gh','api',f"/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100"], text=True)
              for job in json.loads(jobs_raw).get('jobs', []):
                  print(f"  - {job['name']}: status={job['status']}, conclusion={job.get('conclusion')}, job_id={job['id']}")
          PY
          gh issue comment --repo "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" --body-file /tmp/patch-observation.md
